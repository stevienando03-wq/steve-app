<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma version">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Meilleure version de moi-même</title>
<style>
:root{
  --bleu:#14213D; --creme:#F5F1E8; --anthr:#4A5568; --or:#C8A24B;
  --vert:#1E6B33; --vertbg:#DFF0D8; --rouge:#9C2330; --rougebg:#F8D7DA;
  --ligne:#E3DFD4; --bleuclair:#8FA8C8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--creme);color:var(--bleu);
  font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:76px;max-width:520px;margin:0 auto;min-height:100vh}
.head{background:var(--bleu);color:#fff;padding:16px 18px 13px;position:sticky;top:0;z-index:20}
.head h1{font-size:17px;font-weight:700}
.head .date{font-size:12px;color:var(--or);margin-top:4px;font-weight:600}
.head button{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);border:0;color:#fff;
  width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
.wrap{padding:14px}
.card{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:15px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--anthr);margin-bottom:10px;font-weight:700}
.card h2 .tag{float:right;font-size:11px;color:var(--or);text-transform:none;letter-spacing:0}
.hero{background:var(--bleu);color:#fff;border:0}
.hero h2{color:#B9C2D6}
.hero .big{font-size:26px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.hero .sub{font-size:13px;color:#C3CADB;line-height:1.5}
.sec-or{border-left:4px solid var(--or)}
.sec-vert{border-left:4px solid #5BA86B}
.sec-rouge{border-left:4px solid var(--rouge)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0ECE2;gap:10px}
.row:last-child{border-bottom:0}
.row .lab{font-size:13.5px;color:var(--anthr);flex:1;line-height:1.45}
.row .lab b{color:var(--bleu)}
.note{font-size:12.5px;color:var(--anthr);line-height:1.55}
.pill{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:8px 15px;font-size:13px;
  font-weight:600;color:var(--anthr);cursor:pointer;display:inline-block}
.pill.on{background:var(--vertbg);border-color:#9BC6A4;color:var(--vert)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:block;width:100%;text-align:center;background:var(--bleu);color:#fff;border:0;padding:13px;
  border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.light{background:#fff;color:var(--bleu);border:1px solid var(--ligne)}
.btn.or{background:var(--or)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:36px;height:36px;border-radius:9px;border:1px solid var(--ligne);background:#fff;font-size:20px;
  color:var(--bleu);font-weight:700;cursor:pointer;line-height:1}
.step .val{min-width:56px;text-align:center;font-weight:700;font-size:15px}
.bar{height:9px;background:#EEE9DD;border-radius:6px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--or);border-radius:6px}
.bar.vert > i{background:#5BA86B}
.acc{border:1px solid var(--ligne);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.acc > .h{padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc > .h .nm{font-weight:700;font-size:13.5px}
.acc > .h .meta{font-size:11px;color:var(--or);font-weight:600;white-space:nowrap}
.acc > .b{display:none;padding:0 15px 14px;font-size:13px;line-height:1.65;color:var(--anthr);white-space:pre-line;border-top:1px solid #F0ECE2}
.acc.open > .b{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--ligne);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 2px 8px;cursor:pointer;color:#A9A293;font-size:10px;font-weight:600}
.nav button .ic{font-size:19px;display:block;margin-bottom:2px}
.nav button.act{color:var(--bleu)}
.tab{display:none}.tab.act{display:block}
.rdv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #F0ECE2;align-items:flex-start}
.rdv:last-child{border-bottom:0}
.rdv .j{background:var(--creme);border-radius:10px;padding:6px 9px;text-align:center;min-width:52px;flex:none}
.rdv .j .n{font-size:17px;font-weight:800;line-height:1}
.rdv .j .m{font-size:9.5px;text-transform:uppercase;color:var(--anthr);letter-spacing:.4px}
.rdv .c{flex:1}
.rdv .c .t{font-weight:700;font-size:13.5px}
.rdv .c .h{font-size:12px;color:var(--or);font-weight:600;margin-top:1px}
.rdv .c .w{font-size:12px;color:var(--anthr);margin-top:4px;line-height:1.45}
.rdv.urgent .j{background:var(--rougebg)}
.gcal{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--bleu);
  background:var(--creme);border:1px solid var(--ligne);border-radius:16px;padding:5px 12px;text-decoration:none}
.donut{display:block;margin:4px auto 0}
#restT.fini{color:var(--vert);animation:flash .5s ease-in-out 3}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.25}}
.donut-c{font-size:20px;font-weight:800;fill:var(--bleu)}
.donut-l{font-size:9px;fill:var(--anthr);text-transform:uppercase;letter-spacing:.6px}
.mvt{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F0ECE2;font-size:13px;gap:8px}
.mvt:last-child{border-bottom:0}
.mvt .g{flex:1}
.mvt .cat{font-size:11px;color:var(--anthr)}
.mvt .amt{font-weight:700;white-space:nowrap}
.mvt .amt.in{color:var(--vert)}
.mvt .amt.out{color:var(--rouge)}
.mvt .del{background:none;border:0;color:#C9C2B4;font-size:15px;cursor:pointer;padding:0 2px}
.form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form input,.form select{flex:1;min-width:88px;padding:11px;border:1px solid var(--ligne);border-radius:10px;
  font-size:14px;font-family:inherit;background:#fff;color:var(--bleu)}
.kpi{display:flex;gap:10px}
.kpi .box{flex:1;background:var(--creme);border-radius:12px;padding:11px 8px;text-align:center}
.kpi .box .n{font-size:18px;font-weight:800}
.kpi .box .t{font-size:9.5px;color:var(--anthr);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.kpi .box.v .n{color:var(--vert)}.kpi .box.r .n{color:var(--rouge)}
.skill{border:1px solid var(--ligne);border-radius:12px;padding:12px;margin-bottom:9px;background:#fff}
.skill .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skill .nm{font-weight:700;font-size:13.5px}
.skill .lvl{font-size:11px;color:var(--or);font-weight:700;white-space:nowrap}
.skill .why{font-size:12px;color:var(--anthr);margin-top:5px;line-height:1.5}
.skill .dots{display:flex;gap:5px;margin-top:9px}
.skill .dots span{width:26px;height:8px;border-radius:4px;background:#EEE9DD;cursor:pointer}
.skill .dots span.on{background:var(--or)}
.skill .res{font-size:11.5px;color:var(--anthr);margin-top:8px;line-height:1.5;padding-top:8px;border-top:1px solid #F0ECE2}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid #F0ECE2;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .bx{width:20px;height:20px;border:2px solid var(--ligne);border-radius:6px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;color:#fff}
.chk.on .bx{background:var(--vert);border-color:var(--vert)}
.chk.on .nm{text-decoration:line-through;color:#A9A293}
.hint{background:#FCF8EC;border:1px dashed var(--or);border-radius:11px;padding:11px 13px;font-size:12.5px;
  color:var(--anthr);line-height:1.55;margin-bottom:12px}
textarea{width:100%;border:1px solid var(--ligne);border-radius:10px;padding:10px;font-size:13.5px;
  font-family:inherit;color:var(--bleu);min-height:60px;background:#fff}
.jour-repas{border:1px solid var(--ligne);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:#fff}
.jour-repas:last-child{margin-bottom:0}
.jour-repas.auj{border-color:var(--or);border-width:2px;background:#FCF8EC}
.jour-repas .d{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--or);margin-bottom:6px}
.jour-repas .l{display:flex;gap:9px;font-size:12.5px;padding:3px 0;line-height:1.45}
.jour-repas .l .q{color:#A9A293;min-width:64px;flex:none;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding-top:3px}
.jour-repas .l .v{color:var(--anthr);flex:1}
.jour-repas .l .v b{color:var(--bleu)}
.chk .nm .sq{display:block;font-size:11px;color:#A9A293;font-weight:600;margin-top:1px}
.chk .qt{font-size:11px;color:#A9A293;white-space:nowrap;margin-left:auto;font-weight:700;flex:none}
.chk.on .qt,.chk.on .sq{text-decoration:line-through}
.alerte{background:var(--rougebg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;
  color:var(--rouge);font-weight:600;margin-top:9px}
.etape{display:flex;gap:9px;padding:4px 0;font-size:12.5px;line-height:1.6;color:var(--anthr)}
.etape .n{width:19px;height:19px;border-radius:50%;background:var(--bleu);color:#fff;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.ing{background:var(--creme);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:var(--anthr)}
.ing b{color:var(--bleu)}
body.dark{--creme:#161b24;--bleu:#E8EBF1;--anthr:#AEB6C4;--ligne:#2c3543}
body.dark .card,body.dark .acc,body.dark .skill,body.dark .nav,body.dark input,body.dark select,
body.dark textarea,body.dark .pill,body.dark .step button{background:#1f2733;color:var(--bleu)}
body.dark .head{background:#0e1729}
body.dark .hero{background:#26304a}
body.dark .kpi .box,body.dark .rdv .j{background:#2a3346}
body.dark .hint{background:#2a2410}
body.dark .jour-repas{background:#1f2733}
body.dark .jour-repas.auj{background:#2a2410}
body.dark .alerte{background:#3a1c22;color:#F0A0AA}
body.dark .ing{background:#2a3346}
body.dark .etape .n{background:#3b4763}
body.dark .bar{background:#2c3543}
body.dark .nav button{color:#7e879a}
body.dark .donut-c{fill:#E8EBF1}
</style>
</head>
<body>

<div class="head">
  <h1>Meilleure version de moi-même</h1>
  <div class="date" id="hdate"></div>
  <button id="darkBtn" title="Mode sombre">🌙</button>
</div>

<div class="tab act" id="t-jour"><div class="wrap" id="jour"></div></div>
<div class="tab" id="t-semaine"><div class="wrap" id="semaine"></div></div>
<div class="tab" id="t-sport"><div class="wrap" id="sport"></div></div>
<div class="tab" id="t-skills"><div class="wrap" id="skills"></div></div>
<div class="tab" id="t-euro"><div class="wrap" id="euro"></div></div>
<div class="tab" id="t-bouffe"><div class="wrap" id="bouffe"></div></div>

<div class="nav">
  <button class="act" data-tab="jour"><span class="ic">📌</span>Aujourd'hui</button>
  <button data-tab="semaine"><span class="ic">🗓️</span>Semaine</button>
  <button data-tab="sport"><span class="ic">💪</span>Sport</button>
  <button data-tab="skills"><span class="ic">🚀</span>Skills</button>
  <button data-tab="euro"><span class="ic">💶</span>Budget</button>
  <button data-tab="bouffe"><span class="ic">🍽️</span>Bouffe</button>
</div>

<script>
/* ================= RÉGLAGES ================= */
const TRAVAIL = {debut:"09h30", fin:"18h30", jours:[1,2,3,4,5]};

/* Cycle 2 jours ON / 1 jour OFF, calé sur le vendredi 21 août 2026 :
   ce jour-là LEGS, le lendemain PUSH, le surlendemain repos. Tout se calcule tout seul ensuite. */
const CYCLE_DEBUT = "2026-08-21";
const CYCLE = ["LEGS","PUSH","REPOS","PULL","LEGS","REPOS","PUSH","PULL","REPOS"];

const RECURRENT = [
  {jour:4, h:"20:30", dur:90, t:"Réunion hebdomadaire", note:"Tous les jeudis soir. Séance de sport le matin ce jour-là si c'est un jour ON."}
];

const RDV = [
  {d:"2026-09-02", h:"16:00", dur:45,  t:"Rendez-vous santé",           note:"Mercredi, en pleine journée de travail. Pose deux heures maintenant, pas la veille."},
  {d:"2026-09-05", h:"11:00", dur:60,  t:"Rendez-vous santé",           note:"Samedi matin, rien à poser."},
  {d:"2026-09-07", h:"13:00", dur:150, t:"Rattrapage Handimanagement",  note:"Lundi début d'après-midi. Pose ta demi-journée et révise le week-end du 5."},
  {d:"2026-09-08", h:"17:30", dur:75,  t:"État des lieux de sortie",    note:"Mardi. Tu finis à 18h30 : préviens ton manager et pars plus tôt. Appartement vide et propre, compteurs relevés."}
];

const SKILLS = [
  {cat:"Ce qui fait la différence sur un CV finance", nm:"Power BI", cible:"Un tableau de bord qui se met à jour tout seul",
   why:"Tu fais tout sous Excel. Power BI est ce que les entreprises demandent aujourd'hui, et c'est le plus gros écart entre un profil comptable et un profil analyste.",
   faire:"Reprends ton reporting mensuel Astridsen et refais-le dans Power BI, en te connectant directement à l'export Pennylane. Deux heures le dimanche pendant six semaines.",
   liens:[["Parcours Power BI, gratuit","https://learn.microsoft.com/fr-fr/training/browse/?products=power-bi"],
          ["Kenji Explains, chaîne YouTube finance et data","https://www.youtube.com/@KenjiExplains"]],
   lire:"La certification PL-300 vaut le coup une fois que tu sais faire. Elle se voit sur un CV."},

  {cat:"Ce qui fait la différence sur un CV finance", nm:"Modélisation financière", cible:"Un modèle à trois états qui tourne, sans référence circulaire",
   why:"C'est ce qui sépare un contrôleur de gestion d'un analyste financier. Ça ne s'apprend qu'en construisant.",
   faire:"Refais le business plan du groupe depuis une feuille vide : compte de résultat, bilan et trésorerie liés entre eux, avec une zone d'hypothèses. Puis casse-le et répare-le.",
   liens:[["Corporate Finance Institute, cours et modèles","https://corporatefinanceinstitute.com/"],
          ["La Lettre Vernimmen, gratuite tous les mois","https://www.vernimmen.net/Lire/Lettre_Vernimmen.php"]],
   lire:"Le Vernimmen, Finance d'entreprise. C'est la référence en France, tu peux le lire par chapitres."},

  {cat:"Ce qui fait la différence sur un CV finance", nm:"SQL", cible:"Sortir une donnée d'une base sans demander à personne",
   why:"Dès qu'une entreprise a un ERP ou un entrepôt de données, savoir écrire une requête te rend autonome. C'est aussi ce qui te permettra d'alimenter Power BI proprement.",
   faire:"Une demi-heure le soir, trois fois par semaine, jusqu'à finir SQLBolt. Puis rejoue les mêmes requêtes sur tes propres données.",
   liens:[["SQLBolt, exercices interactifs","https://sqlbolt.com/"],
          ["Le tutoriel SQL de Mode, plus poussé","https://mode.com/sql-tutorial/"]],
   lire:"Après SQLBolt, vise les jointures et les fonctions de fenêtrage. C'est ce qu'on demande en entretien."},

  {cat:"Ce qui fait la différence sur un CV finance", nm:"Anglais financier", cible:"Tenir une réunion de clôture en anglais sans la préparer",
   why:"Tu es à l'aise à l'écrit. C'est l'oral en contexte technique qui se travaille : le vocabulaire comptable, les chiffres, le reporting.",
   faire:"Écris les commentaires de ton reporting en anglais une fois par mois. Et vingt minutes d'écoute par jour dans les transports.",
   liens:[["BBC Learning English, gratuit","https://www.bbc.co.uk/learningenglish/"],
          ["Toastmasters Paris bilingue, on y parle les deux langues","https://toastmasters-paris-bilingue.org/"]],
   lire:"Apprends par cœur les vingt termes de ton quotidien : accruals, deferred income, trial balance, write-off, headcount."},

  {cat:"Ce qui fait la différence sur un CV finance", nm:"IFRS et consolidation", cible:"Lire un jeu de comptes consolidés sans aide",
   why:"Tu consolides déjà huit entités. Mettre la théorie derrière ta pratique transforme une tâche en argument d'entretien.",
   faire:"Prends le rapport annuel d'un groupe coté que tu connais, LVMH ou Hermès, et lis les annexes en entier. Une fois. C'est long et ça change tout.",
   liens:[["Focus IFRS, la référence française","https://www.focusifrs.com/"],
          ["Autorité des normes comptables","https://www.anc.gouv.fr/"]],
   lire:"Le règlement 99-02 pour la consolidation française, et IFRS 10 et 16 pour l'international."},

  {cat:"Ce qui te fera avancer plus vite", nm:"Prise de parole", cible:"Présenter en comité de direction sans notes",
   why:"Tu présentes déjà chaque mois. Passer de lire ses slides à raconter ses chiffres change la façon dont on te regarde.",
   faire:"Enregistre-toi trois minutes avant chaque comité, puis réécoute. C'est désagréable et c'est ce qui marche le mieux.",
   liens:[["Club Étincelle, Paris 13e, trois visites gratuites","https://club-etincelle.org/"],
          ["Club Expressions, Paris 12e, deux lundis par mois","https://toastmastersexpressions.fr/"]],
   lire:"Un club de prise de parole coûte moins de cent euros par an et te fait progresser plus vite que n'importe quelle vidéo."},

  {cat:"Ce qui te fera avancer plus vite", nm:"Négociation salariale", cible:"Savoir demander sans avoir la gorge serrée",
   why:"Tu vas négocier ton premier vrai contrat dans quelques mois. Cinq minutes de conversation peuvent valoir plusieurs milliers d'euros par an.",
   faire:"Avant chaque entretien, écris trois chiffres sur un papier : ce que tu demandes, ce que tu acceptes, ce que tu refuses. Et ne donne jamais ton chiffre en premier si tu peux l'éviter.",
   liens:[["Baromètre des salaires finance, Apec","https://www.apec.fr/tous-nos-metiers.html"],
          ["Salaires par poste, Compta Online","https://www.compta-online.com/"]],
   lire:"Never Split the Difference, de Chris Voss. Court, concret, écrit par un négociateur du FBI."},

  {cat:"Ce qui te fera avancer plus vite", nm:"Écrire clairement", cible:"Une note d'une page qu'un dirigeant lit jusqu'au bout",
   why:"Un bon chiffre mal expliqué ne sert à rien. Savoir écrire court est rare, et ça se remarque tout de suite.",
   faire:"Une note de synthèse par mois sur un sujet de ton travail. Une page, jamais deux. La conclusion en premier, le détail après.",
   liens:[["Les publications de la DFCG, association des directeurs financiers","https://www.dfcg.fr/"]],
   lire:"Regarde comment sont écrites les notes de l'ACPR ou de la Banque de France : conclusion d'abord, preuve ensuite."},

  {cat:"Ce qui te fera avancer plus vite", nm:"Réseau professionnel", cible:"Dix personnes qui pensent à toi quand un poste s'ouvre",
   why:"La moitié des postes ne sont jamais publiés. Ton réseau actuel se limite à tes collègues et ta promo, c'est trop peu.",
   faire:"Un message par semaine à quelqu'un dont le métier t'intéresse, pour poser une question précise, jamais pour demander un poste. Et un événement DFCG ou Apec par trimestre.",
   liens:[["Événements DFCG","https://www.dfcg.fr/"],["Ateliers et rencontres Apec","https://www.apec.fr/candidat.html"]],
   lire:"Les anciens de ton école sont ta ressource la plus sous-utilisée. Cherche ESG Finance sur LinkedIn, filtre par entreprise."},

  {cat:"Le style de vie qui tient sur la durée", nm:"Sommeil régulier", cible:"Couché avant 23h30, cinq soirs sur sept",
   why:"Tout dépend de ça : la salle, la concentration, l'humeur. C'est le levier avec le meilleur rendement, et le plus facile à négliger.",
   faire:"Une alarme de coucher à 22h45, et le téléphone qui charge hors de la chambre. La deuxième partie compte plus que la première.",
   liens:[], lire:"Ton réveil est fixe de toute façon à cause du travail. C'est l'heure du coucher qui décide de ta nuit."},

  {cat:"Le style de vie qui tient sur la durée", nm:"Trois séances par semaine, minimum", cible:"Ne jamais descendre en dessous, même en période chargée",
   why:"La régularité bat l'intensité. Trois séances tenues toute l'année valent mieux que six pendant un mois puis rien.",
   faire:"Sac préparé la veille, posé devant la porte. Les jours sans motivation, applique la règle des cinq minutes : tu as le droit de repartir après cinq minutes. Personne ne repart.",
   liens:[], lire:"Ton cycle est déjà calé dans l'onglet Sport, tu n'as plus à décider."},

/* ================= DATES ================= */
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const JOURS_C = ["dim","lun","mar","mer","jeu","ven","sam"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function auj(){ return iso(new Date()); }
function moisCourant(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function parse(s){ const p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function joursEntre(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function plusJours(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function libelle(s){ const d=parse(s); return JOURS_C[d.getDay()]+" "+d.getDate()+" "+MOIS_C[d.getMonth()]; }
function libelleLong(s){ const d=parse(s); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }

/* type de séance du jour, calculé depuis le début du cycle */
function seanceDu(dateIso){
  const n = joursEntre(CYCLE_DEBUT, dateIso);
  const i = ((n % CYCLE.length) + CYCLE.length) % CYCLE.length;
  return CYCLE[i];
}
function estTravail(dateIso){ return TRAVAIL.jours.indexOf(parse(dateIso).getDay()) >= 0; }
function creneauSport(dateIso){
  const d = parse(dateIso).getDay();
  if (d === 4) return "le matin avant le travail, tu as ta réunion à 20h30";
  if (estTravail(dateIso)) return "après le travail, vers 19h00";
  return "quand tu veux dans la journée";
}
/* rendez-vous d'un jour donné, fixes plus les tiens */
function rdvDu(dateIso){
  let out = RDV.concat(S.rdv).filter(r => r.d === dateIso);
  const jour = parse(dateIso).getDay();
  RECURRENT.forEach(r => { if (r.jour === jour) out.push({d:dateIso, h:r.h, dur:r.dur, t:r.t, note:r.note, rec:true}); });
  return out.sort((a,b) => a.h.localeCompare(b.h));
}
function prochainsRdv(n){
  const t = auj();
  let out = RDV.concat(S.rdv).filter(r => r.d >= t).sort((a,b) => (a.d+a.h).localeCompare(b.d+b.h));
  return out.slice(0, n);
}

  }));
  const ta = el("jour").querySelector("[data-note]");
  if (ta) ta.addEventListener("change", () => { S.track[auj()].note = ta.value; save(); });

function renderSemaine(){
  let h = '<div class="card"><h2>Tes sept prochains jours</h2>';
  for (let i = 0; i < 7; i++) {

         (estTravail(d) ? ' &nbsp;<span style="font-size:11px;color:#A9A293">bureau ' + TRAVAIL.debut + " à " + TRAVAIL.fin + '</span>' : '') +

           '</div></div>';

  } else { h += '<div class="note">Rien de prévu pour le moment.</div>'; }
  h += '<div class="form"><input type="text" id="rdvT" placeholder="Ajouter : intitulé"><input type="date" id="rdvD">' +
       '<input type="time" id="rdvH" value="09:00"></div>' +
       '<button class="btn light" id="addRdv">Ajouter ce rendez-vous</button></div>';

  h += '<div class="card sec-or"><h2>Régler tes rappels une bonne fois</h2>' +
       '<div class="note"><b>Le réglage qui change tout.</b> Google applique son propre délai, trente minutes ' +
       'par défaut, à tout événement qui n\'apporte pas le sien. Change ce délai une seule fois et tous tes ' +
       'prochains rendez-vous seront à deux jours, sans jamais y revenir.</div>' +
       '<div class="note" style="margin-top:8px">Sur ordinateur : Google Agenda, la roue dentée en haut à ' +
       'droite, <b>Paramètres</b>. Dans la colonne de gauche, sous <b>Paramètres de mes agendas</b>, ouvre ton ' +
       'agenda puis <b>Paramètres de l\'agenda</b>. Sous <b>Notifications relatives à un événement</b>, ' +
       'remplace 30 minutes par 2 jours. Le réglage se synchronise sur ton téléphone.</div>' +
       '<div class="note" style="margin-top:8px"><b>Attention :</b> ce délai vaut pour les <b>nouveaux</b> ' +
       'événements. Ceux qui sont déjà dans ton agenda gardent celui qu\'ils avaient. Reprends-les à la main, ' +
       'ou réimporte le fichier ci-dessous qui écrase leur réglage.</div>' +
       '<div class="note" style="margin-top:10px"><b>Le fichier, lui, porte ses propres rappels.</b> Le bouton ' +
       'bleu te donne tes rendez-vous avec trois rappels déjà réglés, deux jours avant, la veille et deux ' +
       'heures avant. Importe-le par Paramètres puis Importer et exporter. Google garde ces rappels et laisse ' +
       'son délai par défaut de côté. C\'est la seule voie qui te donne les trois niveaux d\'un coup.</div>' +
       '<div class="note" style="margin-top:10px"><b>Le bouton gris sous chaque rendez-vous</b> ouvre Google ' +
       'avec l\'événement déjà rempli. Il ne peut pas transporter de rappel, le format de lien de Google ne le ' +
       'prévoit pas. C\'est donc le délai par défaut de ton agenda qui s\'applique, d\'où le réglage du dessus.</div>' +
       '<div class="note" style="margin-top:10px"><b>Sur ce téléphone.</b> Le bouton ci-dessous autorise l\'app à te prévenir. Elle t\'enverra une notification deux jours avant chaque rendez-vous, à l\'ouverture. Pour être prévenu même app fermée, garde le fichier de l\'agenda, lui seul sonne tout seul.</div>' +
       '<button class="btn light" id="okNotif">' + (('Notification' in window) && Notification.permission === 'granted' ? 'Notifications déjà activées' : 'Activer les notifications') + '</button>' +
       '<button class="btn" id="dlRdv">Mes rendez-vous avec les rappels</button>' +
       '<button class="btn light" id="dlIcs">Tout le calendrier, séances comprises</button>' +
       '<button class="btn light" id="copyIcs">Copier le lien d\'abonnement</button>' +
       '<div class="note" style="margin-top:10px"><b>À savoir sur l\'abonnement.</b> Il se met à jour tout seul, ' +
       'mais Google ne relit le fichier que toutes les huit à vingt-quatre heures : rien n\'apparaît dans la minute. ' +
       'Et sur un calendrier abonné, Google ignore mes rappels et applique les siens, c\'est-à-dire ceux du ' +
       'réglage du dessus. Une raison de plus de le faire.</div></div>';

  el("semaine").innerHTML = h;

  el("addRdv").addEventListener("click", () => {
    const t = el("rdvT").value.trim(), d = el("rdvD").value, hh = el("rdvH").value;
    if (!t || !d) { alert("Il manque l'intitulé ou la date."); return; }
    S.rdv.push({d:d, h:hh, dur:60, t:t, note:""}); save(); renderSemaine(); renderJour();
  });
  el("okNotif").addEventListener("click", function(){
    const b = this;
    demanderNotif(ok => {
      b.textContent = ok ? "Notifications activées" : "Refusé par le téléphone";
      if (ok) { notifier("C'est bon", "Je te préviendrai deux jours avant chaque rendez-vous."); rappelsDeuxJours(); }
    });
  });
  el("dlRdv").addEventListener("click", () => telechargerIcs(true));
  el("dlIcs").addEventListener("click", () => telechargerIcs(false));
  el("copyIcs").addEventListener("click", function(){
    const u = "https://stevienando03-wq.github.io/steve-app/steve.ics";
    if (navigator.clipboard) navigator.clipboard.writeText(u).then(() => { this.textContent = "Lien copié"; });
    else this.textContent = u;
  });
}

function renderSport(){
  const s = seanceDu(auj());
  let h = '<div class="card hero"><h2>Aujourd\'hui</h2><div class="big">' +
          (s === "REPOS" ? "Repos" : s) + '</div><div class="sub">' +
          (s === "REPOS" ? "Pas de salle. Marche, étirements, et au lit tôt." : "Séance " + creneauSport(auj()) + ".") +
          '</div></div>';
  h += '<div class="hint">Deux jours de salle, un jour de repos, en boucle. Le programme tourne tout seul : ' +
       'PUSH, PULL, LEGS. Chaque séance finit par son circuit abdos.</div>';
  PROG.forEach(p => {
    h += '<div class="acc"><div class="h"><span class="nm">' + p.t + '</span><span class="meta">voir</span></div>' +
         '<div class="b">' + p.x + '</div></div>';
  });
  h += '<div class="card"><h2>Minuteur de repos</h2>' +
       '<div style="font-size:42px;text-align:center;font-weight:800" id="restT">prêt</div>' +
       '<div class="pills" style="justify-content:center;margin-top:8px">' +
       '<span class="pill" data-rest="60">60 s</span><span class="pill" data-rest="90">90 s</span>' +
       '<span class="pill" data-rest="120">2 min</span><span class="pill" data-rest="0">Stop</span></div></div>';
  el("sport").innerHTML = h;
  el("sport").querySelectorAll(".acc").forEach(a =>
    a.querySelector(".h").addEventListener("click", () => a.classList.toggle("open")));
  el("sport").querySelectorAll("[data-rest]").forEach(b => b.addEventListener("click", () => {
    clearInterval(window._rt);
    const n = +b.dataset.rest, z = el("restT");
    z.classList.remove("fini");
    if (n <= 0) { z.textContent = "prêt"; return; }
    demanderNotif();
    /* on vise une heure de fin : si le téléphone met l'app en veille, le compte reste juste */
    const fin = Date.now() + n * 1000;
    function tic(){
      const reste = Math.ceil((fin - Date.now()) / 1000);
      if (reste > 0) { z.textContent = reste + " s"; return; }
      clearInterval(window._rt);
      z.textContent = "C'est reparti";
      z.classList.add("fini");
      bip();
      notifier("C'est reparti", "Repos terminé, enchaîne la série suivante.");
    }
    tic();
    window._rt = setInterval(tic, 250);
  }));
}

function renderSkills(){
  let h = '<div class="hint">Ce que tu veux savoir faire dans un an. Pour chacune : pourquoi ça compte, ' +
          'quoi faire concrètement, et où aller. Touche les barres pour marquer où tu en es.</div>';
  let catCourante = "";
  SKILLS.forEach((sk, i) => {
    if (sk.cat !== catCourante) {
      catCourante = sk.cat;
      h += '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--or);' +
           'font-weight:700;margin:16px 0 8px">' + sk.cat + '</div>';
    }
    const st = S.skills[sk.nm] || {n:0, note:""};
    h += '<div class="skill"><div class="top"><span class="nm">' + sk.nm + '</span>' +
         '<span class="lvl">' + st.n + ' sur 5</span></div>' +
         '<div class="why">' + sk.why + '</div>' +
         '<div class="dots">' + [1,2,3,4,5].map(n =>
           '<span class="' + (st.n >= n ? "on" : "") + '" data-sk="' + i + '" data-n="' + n + '"></span>').join("") + '</div>' +
         '<div class="res"><b>L\'objectif :</b> ' + sk.cible + '</div>' +
         '<div class="res" style="border-top:0;padding-top:4px"><b>Ce que tu fais :</b> ' + sk.faire + '</div>';
    if (sk.liens && sk.liens.length) {
      h += '<div class="res" style="border-top:0;padding-top:6px"><b>Où aller :</b><br>' +
           sk.liens.map(l => '<a href="' + l[1] + '" target="_blank" rel="noopener" ' +
             'style="color:var(--or);font-weight:600;text-decoration:none">' + l[0] + '</a>').join('<br>') + '</div>';
    }
    if (sk.lire) h += '<div class="res" style="border-top:0;padding-top:6px;font-style:italic">' + sk.lire + '</div>';
    h += '<textarea style="margin-top:9px;min-height:44px" data-sknote="' + i + '" placeholder="Ce que tu as fait, ce que tu as compris.">' + (st.note || "") + '</textarea></div>';
  });
  el("skills").innerHTML = h;
  el("skills").querySelectorAll("[data-sk]").forEach(d => d.addEventListener("click", () => {
    const sk = SKILLS[+d.dataset.sk].nm, n = +d.dataset.n;
    const cur = S.skills[sk] || {n:0, note:""};
    cur.n = (cur.n === n) ? n - 1 : n;
    S.skills[sk] = cur; save(); renderSkills();
  }));
  el("skills").querySelectorAll("[data-sknote]").forEach(t => t.addEventListener("change", () => {
    const sk = SKILLS[+t.dataset.sknote].nm;
    const cur = S.skills[sk] || {n:0, note:""};
    cur.note = t.value; S.skills[sk] = cur; save();
  }));
}

function renderEuro(){
  const b = S.budget;
  const entrees = b.mvts.filter(m => m.type === "in").reduce((a, m) => a + m.montant, 0);
  const sorties = b.mvts.filter(m => m.type === "out").reduce((a, m) => a + m.montant, 0);
  const base = (b.soldeDebut || 0) + entrees;
  const solde = base - sorties;
  const pct = base > 0 ? Math.max(0, Math.min(1, solde / base)) : 0;
  const prec = b.histo.length ? b.histo[b.histo.length - 1] : null;
  let h = "";

  if (b.soldeDebut === null) {
    h += '<div class="card"><h2>Pour commencer</h2>' +
         '<div class="note">Entre ce que tu as sur ton compte aujourd\'hui. Ensuite tu ajoutes tes entrées et tes sorties, le cercle suit.</div>' +
         '<div class="form"><input type="number" inputmode="decimal" id="initSolde" placeholder="Solde actuel en euros"></div>' +
         '<button class="btn" id="setSolde">Enregistrer</button></div>';
    el("euro").innerHTML = h;
    el("setSolde").addEventListener("click", () => {
      const v = parseFloat((el("initSolde").value || "").replace(",", "."));
      if (!isNaN(v)) { S.budget.soldeDebut = v; S.budget.mois = moisCourant(); save(); renderEuro(); }
    });
    return;
  }

  /* épargne : ce qui est mis de côté moins ce qui est repris, sur tous les mois */
  function epargneDe(mvts) {
    let mis = 0, repris = 0;
    mvts.forEach(m => {
      if (m.type === "out" && m.cat === CAT_EPARGNE.sortie) mis += m.montant;
      if (m.type === "in" && m.cat === CAT_EPARGNE.entree) repris += m.montant;
    });
    return {mis:mis, repris:repris, net:mis - repris};
  }
  const epMois = epargneDe(b.mvts);
  let epTotal = epMois.net;
  b.histo.forEach(m => { epTotal += (m.epargne || 0); });

  const R = 62, C = 2 * Math.PI * R;
  h += '<div class="card"><h2>Mon solde <span class="tag">' + MOIS[new Date().getMonth()] + '</span></h2>' +
       '<svg class="donut" width="170" height="170" viewBox="0 0 170 170">' +
       '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="#EEE9DD" stroke-width="15"></circle>' +
       '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="' + (pct > .35 ? "#1E6B33" : pct > .15 ? "#C8A24B" : "#9C2330") + '" ' +
       'stroke-width="15" stroke-linecap="round" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '" ' +
       'transform="rotate(-90 85 85)"></circle>' +
       '<text x="85" y="88" text-anchor="middle" class="donut-c">' + eur(solde) + '</text>' +
       '<text x="85" y="106" text-anchor="middle" class="donut-l">disponible</text></svg>' +
       '<div class="kpi" style="margin-top:10px">' +
       '<div class="box v"><div class="n">+' + eur(entrees) + '</div><div class="t">entrées</div></div>' +
       '<div class="box r"><div class="n">-' + eur(sorties) + '</div><div class="t">sorties</div></div>' +
       '<div class="box"><div class="n">' + eur(entrees - sorties) + '</div><div class="t">net du mois</div></div>' +
       '</div></div>';

  /* épargne */
  h += '<div class="card sec-or"><h2>Mon épargne <span class="tag">' + eur(epTotal) + ' au total</span></h2>' +
       '<div class="kpi"><div class="box v"><div class="n">' + eur(epMois.mis) + '</div><div class="t">mis de côté ce mois</div></div>' +
       '<div class="box r"><div class="n">' + eur(epMois.repris) + '</div><div class="t">repris ce mois</div></div>' +
       '<div class="box"><div class="n">' + eur(epTotal) + '</div><div class="t">épargne cumulée</div></div></div>' +
       '<div class="note" style="margin-top:9px">Pour mettre de côté, ajoute une dépense avec la catégorie ' +
       '<b>Mise de côté</b> : elle sort de ton disponible et vient grossir cette ligne. Pour piocher dedans, ' +
       'ajoute une entrée <b>Retrait d\'épargne</b>. Objectif : un mois de salaire d\'avance.</div></div>';

  h += '<div class="card sec-vert"><h2>J\'ai reçu de l\'argent</h2>' +
       '<div class="form"><input type="number" inputmode="decimal" id="inM" placeholder="Montant">' +
       '<select id="inC">' + CAT_IN.map(c => '<option>' + c + '</option>').join("") + '</select></div>' +
       '<button class="btn light" id="addIn">Ajouter cette entrée</button></div>';

  h += '<div class="card sec-rouge"><h2>J\'ai dépensé</h2>' +
       '<div class="form"><input type="number" inputmode="decimal" id="outM" placeholder="Montant">' +
       '<select id="outC">' + CAT_OUT.map(c => '<option>' + c + '</option>').join("") + '</select></div>' +
       '<button class="btn light" id="addOut">Ajouter cette dépense</button></div>';

  /* tableaux par catégorie, avec la colonne du mois précédent si elle existe */
  const parCat = {in:{}, out:{}};
  b.mvts.forEach(m => { parCat[m.type][m.cat] = (parCat[m.type][m.cat] || 0) + m.montant; });

  function tableauCat(type, titre, total, couleur) {
    const catsPrec = prec ? (prec.cats && prec.cats[type] ? prec.cats[type] : {}) : {};
    const toutes = Object.keys(parCat[type]).concat(Object.keys(catsPrec))
                     .filter((v, i, a) => a.indexOf(v) === i)
                     .sort((a, x) => (parCat[type][x] || 0) - (parCat[type][a] || 0));
    let t = '<div class="card"><h2>' + titre + ' <span class="tag">' + eur(total) + '</span></h2>';
    if (!toutes.length) return t + '<div class="note">Rien pour l\'instant ce mois-ci.</div></div>';
    t += '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
         '<tr style="border-bottom:1px solid var(--ligne)">' +
         '<th style="text-align:left;padding:6px 0;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Catégorie</th>' +
         '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Nb</th>' +
         '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Ce mois</th>' +
         (prec ? '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">' + prec.libelle + '</th>' +
                 '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Écart</th>' : '') +
         '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Part</th></tr>';
    toutes.forEach(c => {
      const v = parCat[type][c] || 0, vp = catsPrec[c] || 0, ecart = v - vp;
      const n = b.mvts.filter(m => m.type === type && m.cat === c).length;
      const p = total > 0 ? v / total * 100 : 0;
      const coulEcart = (type === "out" ? (ecart > 0 ? "var(--rouge)" : "var(--vert)")
                                        : (ecart > 0 ? "var(--vert)" : "var(--rouge)"));
      t += '<tr style="border-bottom:1px solid #F0ECE2"><td style="padding:8px 0">' + c + '</td>' +
           '<td style="text-align:right;color:var(--anthr)">' + n + '</td>' +
           '<td style="text-align:right;font-weight:700;color:' + couleur + '">' + eur(v) + '</td>' +
           (prec ? '<td style="text-align:right;color:var(--anthr)">' + eur(vp) + '</td>' +
                   '<td style="text-align:right;font-weight:600;color:' + (ecart === 0 ? "var(--anthr)" : coulEcart) + '">' +
                   (ecart > 0 ? "+" : "") + eur(ecart) + '</td>' : '') +
           '<td style="text-align:right;color:var(--anthr)">' + pourcent(p) + '</td></tr>';
    });
    t += '<tr><td style="padding:9px 0;font-weight:700">Total</td><td></td>' +
         '<td style="text-align:right;font-weight:800;color:' + couleur + '">' + eur(total) + '</td>' +
         (prec ? '<td style="text-align:right;font-weight:700">' + eur(type === "out" ? prec.sorties : prec.entrees) + '</td><td></td>' : '') +
         '<td style="text-align:right;font-weight:700">100 %</td></tr></table></div>';
    return t;
  }
  h += tableauCat("out", "Où part l'argent", sorties, "var(--rouge)");
  h += tableauCat("in", "Ce qui rentre", entrees, "var(--vert)");

  /* comparaison globale avec le mois précédent */
  if (prec) {
    const dS = sorties - prec.sorties, dE = entrees - prec.entrees, dN = (entrees - sorties) - (prec.entrees - prec.sorties);
    h += '<div class="card"><h2>Comparé à ' + prec.libelle + '</h2>' +
         '<div class="kpi"><div class="box"><div class="n" style="color:' + (dE >= 0 ? "var(--vert)" : "var(--rouge)") + '">' +
         (dE > 0 ? "+" : "") + eur(dE) + '</div><div class="t">entrées</div></div>' +
         '<div class="box"><div class="n" style="color:' + (dS <= 0 ? "var(--vert)" : "var(--rouge)") + '">' +
         (dS > 0 ? "+" : "") + eur(dS) + '</div><div class="t">sorties</div></div>' +
         '<div class="box"><div class="n" style="color:' + (dN >= 0 ? "var(--vert)" : "var(--rouge)") + '">' +
         (dN > 0 ? "+" : "") + eur(dN) + '</div><div class="t">net</div></div></div>' +
         '<div class="note" style="margin-top:9px">' +
         (dS <= 0 ? "Tu dépenses moins que le mois dernier. C'est exactement ce qu'on veut voir."
                  : "Tu as dépensé " + eur(dS) + " de plus. Regarde quelle ligne a bougé dans le tableau au-dessus.") +
         '</div></div>';
  }

  h += '<div class="card"><h2>Le détail <span class="tag">' + b.mvts.length + ' mouvements</span></h2>';
  if (b.mvts.length) {
    b.mvts.slice().reverse().forEach((m, idx) => {
      const vrai = b.mvts.length - 1 - idx;
      h += '<div class="mvt"><div class="g"><div>' + m.cat + '</div><div class="cat">' + libelle(m.d) + '</div></div>' +
           '<span class="amt ' + m.type + '">' + (m.type === "in" ? "+" : "-") + eur(m.montant) + '</span>' +
           '<button class="del" data-del="' + vrai + '">✕</button></div>';
    });
  } else { h += '<div class="note">Rien pour l\'instant.</div>'; }
  h += '<button class="btn or" id="resetMois" style="margin-top:14px">Clôturer le mois et repartir de zéro</button>' +
       '<div class="note" style="margin-top:8px">Le mois est archivé pour la comparaison, ton solde devient le point de départ du suivant, et la liste se vide.</div></div>';

  /* historique des mois clôturés */
  if (b.histo.length) {
    h += '<div class="card"><h2>Les mois précédents</h2>' +
         '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
         '<tr style="border-bottom:1px solid var(--ligne)">' +
         '<th style="text-align:left;padding:6px 0;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Mois</th>' +
         '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Entrées</th>' +
         '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Sorties</th>' +
         '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Net</th>' +
         '<th style="text-align:right;font-size:10.5px;color:var(--anthr);text-transform:uppercase">Épargne</th></tr>';
    b.histo.slice().reverse().forEach(m => {

           '<td style="text-align:right;color:var(--vert)">' + eur(m.entrees) + '</td>' +
           '<td style="text-align:right;color:var(--rouge)">' + eur(m.sorties) + '</td>' +
           '<td style="text-align:right;font-weight:700">' + (net > 0 ? "+" : "") + eur(net) + '</td>' +
           '<td style="text-align:right;color:var(--or);font-weight:600">' + eur(m.epargne || 0) + '</td></tr>';

  });
  el("addOut").addEventListener("click", () => {

    if (isNaN(v) || v <= 0) return;

  });
  el("euro").querySelectorAll("[data-del]").forEach(x => x.addEventListener("click", () => {
    S.budget.mvts.splice(+x.dataset.del, 1); save(); renderEuro();
  }));
  el("resetMois").addEventListener("click", () => {
    if (!confirm("Clôturer le mois ? Il sera archivé pour que tu puisses comparer, et la liste repart à zéro.")) return;
    const d = new Date(), moisFini = MOIS[d.getMonth()] + " " + d.getFullYear();
    S.budget.histo.push({
      mois: S.budget.mois, libelle: moisFini,
      soldeDebut: S.budget.soldeDebut, soldeFin: solde,
      entrees: entrees, sorties: sorties, epargne: epMois.net,
      cats: {in: Object.assign({}, parCat.in), out: Object.assign({}, parCat.out)}
    });
    if (S.budget.histo.length > 12) S.budget.histo.shift();
    S.budget.soldeDebut = solde; S.budget.mvts = []; S.budget.mois = moisCourant();
    save(); renderEuro();
  });
}

function fmtEur(v){ return v.toFixed(2).replace(".", ",") + " \u20ac"; }
/* budget : deux decimales, separateur de milliers, jamais d'arrondi */
function eur(v){
  const p = Math.abs(v).toFixed(2).split(".");
  return (v < 0 ? "-" : "") + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "," + p[1] + " \u20ac";
}
function pourcent(v){ return v.toFixed(2).replace(".", ",") + " %"; }
function cleShop(i){ return "p" + PERIODE.du + "_" + i; }
function joursPeriode(){
  const L = [];
  for (let d = PERIODE.du; d <= PERIODE.au; d = plusJours(d, 1)) L.push(d);
  return L;
}
function repasDu(d){ return PERIODE.planning[d] || null; }
function dinerDu(d){ return PERIODE.diners[d] || null; }

function blocJourRepas(d){
  const p = repasDu(d); if (!p) return "";
  const din = dinerDu(d), estAuj = (d === auj());
  let x = '<div class="jour-repas' + (estAuj ? " auj" : "") + '">' +
          '<div class="d">' + (estAuj ? "Aujourd\'hui, " : "") + libelle(d) + '</div>';
  function l(q, v){ return v ? '<div class="l"><span class="q">' + q + '</span><span class="v">' + v + '</span></div>' : ""; }
  x += l("Matin", p.matin);
  x += l("Collation", p.collation);
  x += l("Midi", p.midi);
  x += l("Soir", din ? "<b>" + din.nm + "</b>, " + din.temps : p.soir);
  if (d === PERIODE.courses.d) x += l("Courses", "<b>Les courses</b>, vers " + PERIODE.courses.h.replace(":", "h") + ", environ " + PERIODE.courses.attendu + " \u20ac");
  if (din && din.alerte) x += '<div class="alerte">' + din.alerte + '</div>';
  return x + '</div>';
}

  h += '<div class="card"><h2>Ta réserve de recettes <span class="tag">hors période</span></h2>' +
       '<div class="note" style="margin-bottom:9px">Pour les jours qui ne sont pas couverts, ou quand tu veux changer.</div>';
  RECETTES.forEach(r => {
    h += '<div class="acc"><div class="h"><span class="nm">' + r.nm + '</span><span class="meta">' + r.meta + '</span></div>' +
         '<div class="b">' + r.b + '</div></div>';

  h += '</div>';

  el("bouffe").innerHTML = h;
  el("bouffe").querySelectorAll(".acc").forEach(a =>
    a.querySelector(".h").addEventListener("click", () => a.classList.toggle("open")));
  el("bouffe").querySelectorAll("[data-shop]").forEach(x => x.addEventListener("click", () => {
    S.shop[x.dataset.shop] = !S.shop[x.dataset.shop]; save(); renderBouffe();
  }));

/* ================= NOTIFICATIONS ================= */
function notifOk(){ return ("Notification" in window) && Notification.permission === "granted"; }
function demanderNotif(cb){
  if (!("Notification" in window)) { if (cb) cb(false); return; }
  if (Notification.permission === "granted") { if (cb) cb(true); return; }
  if (Notification.permission === "denied") { if (cb) cb(false); return; }
  Notification.requestPermission().then(p => { if (cb) cb(p === "granted"); });
}
function notifier(titre, corps){
  if (navigator.vibrate) { try { navigator.vibrate([200, 90, 200]); } catch(e){} }
  if (!notifOk()) return false;
  const o = {body: corps, icon: "./icon-192.png", badge: "./icon-192.png", tag: "steve", renotify: true};
  function simple(){ try { new Notification(titre, o); } catch(e){} }
  /* ready ne rejette jamais : sans delai, une page sans service worker n'afficherait rien */
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    Promise.race([navigator.serviceWorker.ready,
                  new Promise((_, rej) => setTimeout(() => rej(new Error("delai")), 800))])
      .then(r => r.showNotification(titre, o))
      .catch(simple);
  } else { simple(); }
  return true;
}
/* trois bips courts, sans fichier son */
function bip(){
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    const c = new A();
    if (c.state === "suspended") c.resume();
    [0, 0.20, 0.40].forEach(t => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, c.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.30, c.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.18);
    });
    setTimeout(() => { try { c.close(); } catch(e){} }, 1200);
  } catch(e){}
}
/* rappel deux jours avant, quand l'app est ouverte. Une seule fois par rendez-vous. */
function rappelsDeuxJours(){
  if (!notifOk()) return;
  const cible = plusJours(auj(), 2);
  RDV.concat(S.rdv).filter(r => r.d === cible).forEach((r, i) => {
    const cle = "steve_n2j_" + cible + "_" + i;
    if (localStorage.getItem(cle)) return;
    const j = parse(r.d);
    notifier("Dans deux jours", r.t + ", le " + j.getDate() + " " +
             ["janvier","février","mars","avril","mai","juin","juillet","août","septembre",
              "octobre","novembre","décembre"][j.getMonth()] + " à " + r.h.replace(":", "h"));
    localStorage.setItem(cle, "1");
  });
}

/* ================= CALENDRIER ================= */
/* lien qui ouvre Google Agenda avec l'evenement deja rempli, dans l'agenda personnel */
function lienGoogle(r){
  const hm = r.h.split(":");
  const debut = parse(r.d);
  debut.setHours(+hm[0], +hm[1], 0, 0);
  const fin = new Date(debut.getTime() + (r.dur || 60) * 60000);
  function fmt(d){
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") +
           "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00";
  }
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: r.t,
    dates: fmt(debut) + "/" + fmt(fin),
    ctz: "Europe/Paris",
    details: (r.note || "") + "\n\nRappel par défaut de ton agenda. Pour deux jours avant sur tout : " +
             "Paramètres, Paramètres de mes agendas, ton agenda, Notifications relatives à un événement."
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

function icsDate(d, h){
  return d.replace(/-/g, "") + "T" + h.replace(":", "") + "00";
}
function construireIcs(seulementRdv){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Steve//Ma version//FR","CALSCALE:GREGORIAN",
             "METHOD:PUBLISH",(seulementRdv ? "X-WR-CALNAME:Mes rendez-vous" : "X-WR-CALNAME:Steve, ma semaine"),"X-WR-TIMEZONE:Europe/Paris",
             "REFRESH-INTERVAL;VALUE=DURATION:PT6H","X-PUBLISHED-TTL:PT6H"];
  function ev(uid, d, h, dur, titre, desc, alarmes){
    const fin = new Date(parse(d).getTime());
    const hm = h.split(":");
    fin.setHours(+hm[0], +hm[1] + dur, 0, 0);
    L.push("BEGIN:VEVENT", "UID:" + uid, "DTSTAMP:" + icsDate(auj(), "08:00") + "Z",
           "DTSTART:" + icsDate(d, h),
           "DTEND:" + icsDate(iso(fin), String(fin.getHours()).padStart(2,"0") + ":" + String(fin.getMinutes()).padStart(2,"0")),
           "SUMMARY:" + titre);
    if (desc) L.push("DESCRIPTION:" + desc.replace(/,/g, "\\,"));
    (alarmes || []).forEach(a => L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + a[1].replace(/,/g,"\\,"),
                                        "TRIGGER;RELATED=START:" + a[0], "END:VALARM"));
    L.push("END:VEVENT");
  }
  /* séances des 60 prochains jours, sautées si on ne veut que les rendez-vous */
  for (let i = 0; i < (seulementRdv ? 0 : 60); i++) {
    const d = plusJours(auj(), i), s = seanceDu(d);
    if (s === "REPOS") continue;
    const dj = parse(d).getDay();
    const h = (dj === 4 || dj === 0 || dj === 6) ? "09:00" : "19:00";
    ev("sport-" + d + "@steve", d, h, 75, "Salle, " + s,
       "Deux jours de salle un jour de repos. Le circuit abdos se fait en fin de séance.",
       [["-PT2H", "Séance dans deux heures, prépare ton sac"]]);
  }
  /* réunion du jeudi, sur 60 jours */
  for (let i = 0; i < (seulementRdv ? 0 : 60); i++) {
    const d = plusJours(auj(), i);
    if (parse(d).getDay() !== 4) continue;
    ev("hebdo-" + d + "@steve", d, "20:30", 90, "Réunion hebdomadaire", "",
       [["-PT3H", "Réunion ce soir à 20h30"]]);
  }
  /* rendez-vous, avec rappels à deux jours, un jour et deux heures */
  RDV.concat(S.rdv).forEach((r, i) => {
    ev("rdv" + i + "-" + r.d + "@steve", r.d, r.h, r.dur || 60, r.t, r.note || "",
       [["-P2D", r.t + " dans deux jours"], ["-P1D", r.t + " demain"], ["-PT2H", r.t + " dans deux heures"]]);
  });
  /* courses et sessions de cuisine de la période en cours */
  if (!seulementRdv) {
    const C = PERIODE.courses;
    if (C.d >= auj()) {
      ev("courses-" + C.d + "@steve", C.d, C.h, C.dur || 45, "Courses, environ " + C.attendu + " \u20ac",
         C.lignes.map(l => l.n + " " + l.q).join(", "),
         [["-PT1H", "Courses dans une heure, la liste est dans l\'app"]]);
    }
    joursPeriode().forEach(d => {
      const r = dinerDu(d);
      if (!r || d < auj()) return;
      ev("cuisine-" + d + "@steve", d, r.h, r.dur, "Cuisine : " + r.nm,
         r.ing + (r.alerte ? " || " + r.alerte : ""),
         [["-PT1H", r.nm + " à préparer dans une heure"]]);
    });
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function telechargerIcs(seulementRdv){
  const blob = new Blob([construireIcs(seulementRdv)], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = seulementRdv ? "mes-rendez-vous.ics" : "ma-semaine.ics";
  a.click();
}
