<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Meilleure version de moi-même</title>
<style>
:root{
  --bleu:#14213D; --creme:#F5F1E8; --anthr:#4A5568; --or:#C8A24B;
  --vert:#1E6B33; --vertbg:#DFF0D8; --rouge:#9C2330; --rougebg:#F8D7DA;
  --ligne:#E3DFD4; --bleuclair:#8FA8C8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--creme);color:var(--bleu);
  font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:76px;max-width:520px;margin:0 auto;min-height:100vh}
.head{background:var(--bleu);color:#fff;padding:16px 18px 13px;position:sticky;top:0;z-index:20}
.head h1{font-size:17px;font-weight:700}
.head .date{font-size:12px;color:var(--or);margin-top:4px;font-weight:600}
.head button{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);border:0;color:#fff;
  width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
.wrap{padding:14px}
.card{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:15px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--anthr);margin-bottom:10px;font-weight:700}
.card h2 .tag{float:right;font-size:11px;color:var(--or);text-transform:none;letter-spacing:0}
.hero{background:var(--bleu);color:#fff;border:0}
.hero h2{color:#B9C2D6}
.hero .big{font-size:26px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.hero .sub{font-size:13px;color:#C3CADB;line-height:1.5}
.sec-or{border-left:4px solid var(--or)}
.sec-vert{border-left:4px solid #5BA86B}
.sec-rouge{border-left:4px solid var(--rouge)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0ECE2;gap:10px}
.row:last-child{border-bottom:0}
.row .lab{font-size:13.5px;color:var(--anthr);flex:1;line-height:1.45}
.row .lab b{color:var(--bleu)}
.note{font-size:12.5px;color:var(--anthr);line-height:1.55}
.pill{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:8px 15px;font-size:13px;
  font-weight:600;color:var(--anthr);cursor:pointer;display:inline-block}
.pill.on{background:var(--vertbg);border-color:#9BC6A4;color:var(--vert)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:block;width:100%;text-align:center;background:var(--bleu);color:#fff;border:0;padding:13px;
  border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.light{background:#fff;color:var(--bleu);border:1px solid var(--ligne)}
.btn.or{background:var(--or)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:36px;height:36px;border-radius:9px;border:1px solid var(--ligne);background:#fff;font-size:20px;
  color:var(--bleu);font-weight:700;cursor:pointer;line-height:1}
.step .val{min-width:56px;text-align:center;font-weight:700;font-size:15px}
.bar{height:9px;background:#EEE9DD;border-radius:6px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--or);border-radius:6px}
.bar.vert > i{background:#5BA86B}
.acc{border:1px solid var(--ligne);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.acc > .h{padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc > .h .nm{font-weight:700;font-size:13.5px}
.acc > .h .meta{font-size:11px;color:var(--or);font-weight:600;white-space:nowrap}
.acc > .b{display:none;padding:0 15px 14px;font-size:13px;line-height:1.65;color:var(--anthr);white-space:pre-line;border-top:1px solid #F0ECE2}
.acc.open > .b{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--ligne);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 2px 8px;cursor:pointer;color:#A9A293;font-size:10px;font-weight:600}
.nav button .ic{font-size:19px;display:block;margin-bottom:2px}
.nav button.act{color:var(--bleu)}
.tab{display:none}.tab.act{display:block}
.rdv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #F0ECE2;align-items:flex-start}
.rdv:last-child{border-bottom:0}
.rdv .j{background:var(--creme);border-radius:10px;padding:6px 9px;text-align:center;min-width:52px;flex:none}
.rdv .j .n{font-size:17px;font-weight:800;line-height:1}
.rdv .j .m{font-size:9.5px;text-transform:uppercase;color:var(--anthr);letter-spacing:.4px}
.rdv .c{flex:1}
.rdv .c .t{font-weight:700;font-size:13.5px}
.rdv .c .h{font-size:12px;color:var(--or);font-weight:600;margin-top:1px}
.rdv .c .w{font-size:12px;color:var(--anthr);margin-top:4px;line-height:1.45}
.rdv.urgent .j{background:var(--rougebg)}
.donut{display:block;margin:4px auto 0}
.donut-c{font-size:27px;font-weight:800;fill:var(--bleu)}
.donut-l{font-size:9px;fill:var(--anthr);text-transform:uppercase;letter-spacing:.6px}
.mvt{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F0ECE2;font-size:13px;gap:8px}
.mvt:last-child{border-bottom:0}
.mvt .g{flex:1}
.mvt .cat{font-size:11px;color:var(--anthr)}
.mvt .amt{font-weight:700;white-space:nowrap}
.mvt .amt.in{color:var(--vert)}
.mvt .amt.out{color:var(--rouge)}
.mvt .del{background:none;border:0;color:#C9C2B4;font-size:15px;cursor:pointer;padding:0 2px}
.form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form input,.form select{flex:1;min-width:88px;padding:11px;border:1px solid var(--ligne);border-radius:10px;
  font-size:14px;font-family:inherit;background:#fff;color:var(--bleu)}
.kpi{display:flex;gap:10px}
.kpi .box{flex:1;background:var(--creme);border-radius:12px;padding:11px 8px;text-align:center}
.kpi .box .n{font-size:18px;font-weight:800}
.kpi .box .t{font-size:9.5px;color:var(--anthr);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.kpi .box.v .n{color:var(--vert)}.kpi .box.r .n{color:var(--rouge)}
.skill{border:1px solid var(--ligne);border-radius:12px;padding:12px;margin-bottom:9px;background:#fff}
.skill .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skill .nm{font-weight:700;font-size:13.5px}
.skill .lvl{font-size:11px;color:var(--or);font-weight:700;white-space:nowrap}
.skill .why{font-size:12px;color:var(--anthr);margin-top:5px;line-height:1.5}
.skill .dots{display:flex;gap:5px;margin-top:9px}
.skill .dots span{width:26px;height:8px;border-radius:4px;background:#EEE9DD;cursor:pointer}
.skill .dots span.on{background:var(--or)}
.skill .res{font-size:11.5px;color:var(--anthr);margin-top:8px;line-height:1.5;padding-top:8px;border-top:1px solid #F0ECE2}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid #F0ECE2;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .bx{width:20px;height:20px;border:2px solid var(--ligne);border-radius:6px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;color:#fff}
.chk.on .bx{background:var(--vert);border-color:var(--vert)}
.chk.on .nm{text-decoration:line-through;color:#A9A293}
.hint{background:#FCF8EC;border:1px dashed var(--or);border-radius:11px;padding:11px 13px;font-size:12.5px;
  color:var(--anthr);line-height:1.55;margin-bottom:12px}
textarea{width:100%;border:1px solid var(--ligne);border-radius:10px;padding:10px;font-size:13.5px;
  font-family:inherit;color:var(--bleu);min-height:60px;background:#fff}
body.dark{--creme:#161b24;--bleu:#E8EBF1;--anthr:#AEB6C4;--ligne:#2c3543}
body.dark .card,body.dark .acc,body.dark .skill,body.dark .nav,body.dark input,body.dark select,
body.dark textarea,body.dark .pill,body.dark .step button{background:#1f2733;color:var(--bleu)}
body.dark .head{background:#0e1729}
body.dark .hero{background:#26304a}
body.dark .kpi .box,body.dark .rdv .j{background:#2a3346}
body.dark .hint{background:#2a2410}
body.dark .bar{background:#2c3543}
body.dark .nav button{color:#7e879a}
body.dark .donut-c{fill:#E8EBF1}
</style>
</head>

/* ================= DATES ================= */
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const JOURS_C = ["dim","lun","mar","mer","jeu","ven","sam"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function auj(){ return iso(new Date()); }
function moisCourant(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function parse(s){ const p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function joursEntre(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function plusJours(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function libelle(s){ const d=parse(s); return JOURS_C[d.getDay()]+" "+d.getDate()+" "+MOIS_C[d.getMonth()]; }
function libelleLong(s){ const d=parse(s); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }

/* type de séance du jour, calculé depuis le début du cycle */
function seanceDu(dateIso){
  const n = joursEntre(CYCLE_DEBUT, dateIso);
  const i = ((n % CYCLE.length) + CYCLE.length) % CYCLE.length;
  return CYCLE[i];
}
function estTravail(dateIso){ return TRAVAIL.jours.indexOf(parse(dateIso).getDay()) >= 0; }
function creneauSport(dateIso){
  const d = parse(dateIso).getDay();
  if (d === 4) return "le matin avant le travail, tu as ta réunion à 20h30";
  if (estTravail(dateIso)) return "après le travail, vers 19h00";
  return "quand tu veux dans la journée";
}
/* rendez-vous d'un jour donné, fixes plus les tiens */
function rdvDu(dateIso){
  let out = RDV.concat(S.rdv).filter(r => r.d === dateIso);
  const jour = parse(dateIso).getDay();
  RECURRENT.forEach(r => { if (r.jour === jour) out.push({d:dateIso, h:r.h, dur:r.dur, t:r.t, note:r.note, rec:true}); });
  return out.sort((a,b) => a.h.localeCompare(b.h));
}
function prochainsRdv(n){
  const t = auj();
  let out = RDV.concat(S.rdv).filter(r => r.d >= t).sort((a,b) => (a.d+a.h).localeCompare(b.d+b.h));
  return out.slice(0, n);
}

    const a = b.dataset.act, s2 = S.track[auj()];
    if (a === "seance") s2.seance = !s2.seance;
    if (a === "eau") s2.eau = Math.max(0, Math.min(8, s2.eau + (+b.dataset.v)));
    save(); renderJour();
  }));

}

function renderEuro(){
  const b = S.budget;
  if (b.mois !== moisCourant() && b.mvts.length === 0) b.mois = moisCourant();
  const entrees = b.mvts.filter(m => m.type === "in").reduce((a, m) => a + m.montant, 0);
  const sorties = b.mvts.filter(m => m.type === "out").reduce((a, m) => a + m.montant, 0);
  const base = (b.soldeDebut || 0) + entrees;
  const solde = base - sorties;
  const pct = base > 0 ? Math.max(0, Math.min(1, solde / base)) : 0;
  let h = "";

  if (b.soldeDebut === null) {
    h += '<div class="card"><h2>Pour commencer</h2>' +
         '<div class="note">Entre ce que tu as sur ton compte aujourd\'hui. Ensuite tu ajoutes tes entrées et tes sorties, le cercle suit.</div>' +
         '<div class="form"><input type="number" inputmode="decimal" id="initSolde" placeholder="Solde actuel en euros"></div>' +
         '<button class="btn" id="setSolde">Enregistrer</button></div>';
    el("euro").innerHTML = h;
    el("setSolde").addEventListener("click", () => {
      const v = parseFloat((el("initSolde").value || "").replace(",", "."));
      if (!isNaN(v)) { S.budget.soldeDebut = v; S.budget.mois = moisCourant(); save(); renderEuro(); }
    });
    return;
  }

  const R = 62, C = 2 * Math.PI * R;
  h += '<div class="card"><h2>Mon solde <span class="tag">' + MOIS[new Date().getMonth()] + '</span></h2>' +
       '<svg class="donut" width="170" height="170" viewBox="0 0 170 170">' +
       '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="#EEE9DD" stroke-width="15"></circle>' +
       '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="' + (pct > .35 ? "#1E6B33" : pct > .15 ? "#C8A24B" : "#9C2330") + '" ' +
       'stroke-width="15" stroke-linecap="round" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '" ' +
       'transform="rotate(-90 85 85)"></circle>' +
       '<text x="85" y="88" text-anchor="middle" class="donut-c">' + Math.round(solde) + ' €</text>' +
       '<text x="85" y="106" text-anchor="middle" class="donut-l">disponible</text></svg>' +
       '<div class="kpi" style="margin-top:10px">' +
       '<div class="box v"><div class="n">+' + Math.round(entrees) + ' €</div><div class="t">entrées</div></div>' +
       '<div class="box r"><div class="n">-' + Math.round(sorties) + ' €</div><div class="t">sorties</div></div>' +
       '<div class="box"><div class="n">' + Math.round(entrees - sorties) + ' €</div><div class="t">net du mois</div></div>' +
       '</div></div>';

  h += '<div class="card sec-vert"><h2>J\'ai reçu de l\'argent</h2>' +
       '<div class="form"><input type="number" inputmode="decimal" id="inM" placeholder="Montant">' +
       '<select id="inC">' + CAT_IN.map(c => '<option>' + c + '</option>').join("") + '</select></div>' +
       '<button class="btn light" id="addIn">Ajouter cette entrée</button></div>';

  h += '<div class="card sec-rouge"><h2>J\'ai dépensé</h2>' +
       '<div class="form"><input type="number" inputmode="decimal" id="outM" placeholder="Montant">' +
       '<select id="outC">' + CAT_OUT.map(c => '<option>' + c + '</option>').join("") + '</select></div>' +
       '<button class="btn light" id="addOut">Ajouter cette dépense</button></div>';

  const parCat = {in:{}, out:{}};
  b.mvts.forEach(m => { parCat[m.type][m.cat] = (parCat[m.type][m.cat] || 0) + m.montant; });
  function tableauCat(type, titre, total, couleur) {
    const cats = Object.keys(parCat[type]).sort((a, x) => parCat[type][x] - parCat[type][a]);
    let t = '<div class="card"><h2>' + titre + ' <span class="tag">' + Math.round(total) + ' €</span></h2>';
    if (!cats.length) { return t + '<div class="note">Rien pour l\'instant ce mois-ci.</div></div>'; }
    t += '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
         '<tr style="border-bottom:1px solid var(--ligne)">' +
         '<th style="text-align:left;padding:6px 0;font-size:11px;color:var(--anthr);text-transform:uppercase">Catégorie</th>' +
         '<th style="text-align:right;font-size:11px;color:var(--anthr);text-transform:uppercase">Nombre</th>' +
         '<th style="text-align:right;font-size:11px;color:var(--anthr);text-transform:uppercase">Montant</th>' +
         '<th style="text-align:right;font-size:11px;color:var(--anthr);text-transform:uppercase">Part</th></tr>';
    cats.forEach(c => {
      const n = b.mvts.filter(m => m.type === type && m.cat === c).length;
      const p = total > 0 ? parCat[type][c] / total * 100 : 0;
      t += '<tr style="border-bottom:1px solid #F0ECE2"><td style="padding:8px 0">' + c + '</td>' +
           '<td style="text-align:right;color:var(--anthr)">' + n + '</td>' +
           '<td style="text-align:right;font-weight:700;color:' + couleur + '">' + Math.round(parCat[type][c]) + ' €</td>' +
           '<td style="text-align:right;color:var(--anthr)">' + Math.round(p) + ' %</td></tr>';
    });
    t += '<tr><td style="padding:9px 0;font-weight:700">Total</td><td></td>' +
         '<td style="text-align:right;font-weight:800;color:' + couleur + '">' + Math.round(total) + ' €</td>' +
         '<td style="text-align:right;font-weight:700">100 %</td></tr></table></div>';
    return t;
  }
  h += tableauCat("out", "Où part l'argent", sorties, "var(--rouge)");
  h += tableauCat("in", "Ce qui rentre", entrees, "var(--vert)");

  h += '<div class="card"><h2>Le détail <span class="tag">' + b.mvts.length + ' mouvements</span></h2>';
  if (b.mvts.length) {
    b.mvts.slice().reverse().forEach((m, idx) => {
      const vrai = b.mvts.length - 1 - idx;
      h += '<div class="mvt"><div class="g"><div>' + m.cat + '</div><div class="cat">' + libelle(m.d) + '</div></div>' +
           '<span class="amt ' + m.type + '">' + (m.type === "in" ? "+" : "-") + Math.round(m.montant) + ' €</span>' +
           '<button class="del" data-del="' + vrai + '">✕</button></div>';
    });
  } else { h += '<div class="note">Rien pour l\'instant.</div>'; }
  h += '<button class="btn or" id="resetMois" style="margin-top:14px">Clôturer le mois et repartir de zéro</button>' +
       '<div class="note" style="margin-top:8px">Le solde actuel devient ton point de départ du mois suivant, et la liste se vide.</div></div>';

  el("euro").innerHTML = h;

  el("addIn").addEventListener("click", () => {
    const v = parseFloat((el("inM").value || "").replace(",", "."));
    if (isNaN(v) || v <= 0) return;
    S.budget.mvts.push({d:auj(), type:"in", montant:v, cat:el("inC").value}); save(); renderEuro();
  });
  el("addOut").addEventListener("click", () => {
    const v = parseFloat((el("outM").value || "").replace(",", "."));
    if (isNaN(v) || v <= 0) return;
    S.budget.mvts.push({d:auj(), type:"out", montant:v, cat:el("outC").value}); save(); renderEuro();
  });
  el("euro").querySelectorAll("[data-del]").forEach(x => x.addEventListener("click", () => {
    S.budget.mvts.splice(+x.dataset.del, 1); save(); renderEuro();
  }));
  el("resetMois").addEventListener("click", () => {
    if (!confirm("Clôturer le mois ? Ton solde actuel devient le point de départ et la liste des mouvements est vidée.")) return;
    S.budget.soldeDebut = solde; S.budget.mvts = []; S.budget.mois = moisCourant(); save(); renderEuro();
  });
}

function renderBouffe(){
  let h = '<div class="hint">Le midi c\'est toujours le bowl du batch, sans réfléchir. Le soir tu piques dans la liste. ' +
          'Un plat nouveau par semaine pour ne pas te lasser.</div>';
  h += '<div class="card"><h2>Recettes <span class="tag">protéines par plat</span></h2>';
  RECETTES.forEach(r => {
    h += '<div class="acc"><div class="h"><span class="nm">' + r.nm + '</span><span class="meta">' + r.meta + '</span></div>' +
         '<div class="b">' + r.b + '</div></div>';
  });
  h += '</div>';
  COURSES.forEach((bloc, bi) => {
    h += '<div class="card"><h2>' + bloc[0] + '</h2>';
    bloc[1].forEach((it, ii) => {
      const id = "c" + bi + "_" + ii;
      h += '<div class="chk' + (S.shop[id] ? " on" : "") + '" data-shop="' + id + '"><span class="bx">' +
           (S.shop[id] ? "✓" : "") + '</span><span class="nm">' + it + '</span></div>';
    });
    h += '</div>';
  });
  el("bouffe").innerHTML = h;
  el("bouffe").querySelectorAll(".acc").forEach(a =>
    a.querySelector(".h").addEventListener("click", () => a.classList.toggle("open")));
  el("bouffe").querySelectorAll("[data-shop]").forEach(x => x.addEventListener("click", () => {
    S.shop[x.dataset.shop] = !S.shop[x.dataset.shop]; save(); renderBouffe();
  }));
}

/* ================= CALENDRIER ================= */
function icsDate(d, h){
  return d.replace(/-/g, "") + "T" + h.replace(":", "") + "00";
}
function construireIcs(){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Steve//Ma version//FR","CALSCALE:GREGORIAN",
             "METHOD:PUBLISH","X-WR-CALNAME:Steve, ma semaine","X-WR-TIMEZONE:Europe/Paris",
             "REFRESH-INTERVAL;VALUE=DURATION:PT6H","X-PUBLISHED-TTL:PT6H"];
  function ev(uid, d, h, dur, titre, desc, alarmes){
    const fin = new Date(parse(d).getTime());
    const hm = h.split(":");
    fin.setHours(+hm[0], +hm[1] + dur, 0, 0);
    L.push("BEGIN:VEVENT", "UID:" + uid, "DTSTAMP:" + icsDate(auj(), "08:00") + "Z",
           "DTSTART:" + icsDate(d, h),
           "DTEND:" + icsDate(iso(fin), String(fin.getHours()).padStart(2,"0") + ":" + String(fin.getMinutes()).padStart(2,"0")),
           "SUMMARY:" + titre);
    if (desc) L.push("DESCRIPTION:" + desc.replace(/,/g, "\\,"));
    (alarmes || []).forEach(a => L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + a[1].replace(/,/g,"\\,"),
                                        "TRIGGER:" + a[0], "END:VALARM"));
    L.push("END:VEVENT");
  }
  /* séances des 60 prochains jours */
  for (let i = 0; i < 60; i++) {
    const d = plusJours(auj(), i), s = seanceDu(d);
    if (s === "REPOS") continue;
    const dj = parse(d).getDay();
    const h = (dj === 4 || dj === 0 || dj === 6) ? "09:00" : "19:00";
    ev("sport-" + d + "@steve", d, h, 75, "Salle, " + s,
       "Deux jours de salle un jour de repos. Le circuit abdos se fait en fin de séance.",
       [["-PT2H", "Séance dans deux heures, prépare ton sac"]]);
  }
  /* réunion du jeudi, sur 60 jours */
  for (let i = 0; i < 60; i++) {
    const d = plusJours(auj(), i);
    if (parse(d).getDay() !== 4) continue;
    ev("hebdo-" + d + "@steve", d, "20:30", 90, "Réunion hebdomadaire", "",
       [["-PT3H", "Réunion ce soir à 20h30"]]);
  }
  /* rendez-vous, avec rappels à trois jours, un jour et deux heures */
  RDV.concat(S.rdv).forEach((r, i) => {
    ev("rdv" + i + "-" + r.d + "@steve", r.d, r.h, r.dur || 60, r.t, r.note || "",
       [["-P3D", r.t + " dans trois jours"], ["-P1D", r.t + " demain"], ["-PT2H", r.t + " dans deux heures"]]);
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function telechargerIcs(){
  const blob = new Blob([construireIcs()], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ma-semaine.ics";
  a.click();
}
