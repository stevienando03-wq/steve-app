<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E1413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma version">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Meilleure version de moi-même</title>
<!-- Les polices de Cap 2027, que Steve a retenues. Chargees depuis Google
     Fonts avec une vraie pile de repli : hors connexion l app tombe sur les
     polices du systeme et reste parfaitement lisible, elle perd juste son
     caractere. Rien d autre ne depend du reseau. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- La palette de Cap 2027, portee dans l app le 21/09/2026 ----------
   Steve : « l app n est pas du tout a jour comme Cap 2027 sur les couleurs,
   j ai beaucoup aime, applique dans tous les modules ».
   Les NOMS de variables ne changent pas, seules leurs VALEURS : tout le reste
   de la feuille continue de marcher, et l identite change partout d un coup.
   Roles : --creme est le fond, --bleu l encre, --anthr le texte attenue,
   --ligne les filets, --or et --accent les deux accents, --vert et --rouge
   le semantique. --surface et --surface2 sont nouvelles : avant, les fonds de
   cartes etaient ecrits en dur dans une vingtaine de regles. */
:root{
  --bleu:#15201F; --creme:#F4F6F5; --anthr:#5C6B68; --or:#9A6B1F;
  --vert:#2F6A47; --vertbg:#E1EEE6; --rouge:#9E3524; --rougebg:#F8E4DF;
  --ligne:#D9E0DD; --bleuclair:#7E8F8B;
  --surface:#FFFFFF; --surface2:#EDF1EF; --accent:#0E5B51;
  --hintbg:#FCF8EC; --surBadge:#FFFFFF;
  /* Une teinte par chantier, la meme grammaire que dans Parcours. */
  --h-agenda:#5C6B68; --h-sante:#8F6318; --h-cv:#0E5B51; --h-nat:#39539E;
  --h-civ:#6B3F9E; --h-bi:#15687F; --h-sql:#54761C; --h-can:#A84360;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--creme);color:var(--bleu);
  font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:76px;max-width:520px;margin:0 auto;min-height:100vh}
.head{background:var(--bleu);color:#fff;padding:16px 18px 13px;position:sticky;top:0;z-index:20}
.head h1{font-size:17px;font-weight:700}
.head .date{font-size:12px;color:var(--or);margin-top:4px;font-weight:600}
.head button{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);border:0;color:#fff;
  width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
.wrap{padding:14px;overflow-wrap:break-word}
.card{background:var(--surface);border:1px solid var(--ligne);border-radius:14px;padding:15px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--anthr);margin-bottom:10px;font-weight:700}
.card h2 .tag{float:right;font-size:11px;color:var(--or);text-transform:none;letter-spacing:0}
.hero{background:var(--bleu);color:#fff;border:0}
.hero h2{color:#B9C2D6}
.hero .big{font-size:26px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.hero .sub{font-size:13px;color:#C3CADB;line-height:1.5}
.sec-or{border-left:4px solid var(--or)}
.sec-vert{border-left:4px solid #5BA86B}
.sec-rouge{border-left:4px solid var(--rouge)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0ECE2;gap:10px}
/* Un enfant de flex a min-width:auto par defaut et REFUSE de retrecir sous la taille de son
   contenu. Un texte long dans une colonne poussait donc la page entiere a 946 px de large
   sur un ecran de 375. Constate le 13/09/2026. */
.row > *{min-width:0}
.row:last-child{border-bottom:0}
.row .lab{font-size:13.5px;color:var(--anthr);flex:1;line-height:1.45}
.row .lab b{color:var(--bleu)}
.note{font-size:12.5px;color:var(--anthr);line-height:1.55}
.pill{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:8px 15px;font-size:13px;
  font-weight:600;color:var(--anthr);cursor:pointer;display:inline-block}
.pill.on{background:var(--vert);border-color:var(--vert);color:var(--surBadge)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--surBadge);border:0;padding:13px;
  border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.light{background:var(--surface);color:var(--bleu);border:1px solid var(--ligne)}
.btn.or{background:var(--or)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:36px;height:36px;border-radius:9px;border:1px solid var(--ligne);background:#fff;font-size:20px;
  color:var(--bleu);font-weight:700;cursor:pointer;line-height:1}
.step .val{min-width:56px;text-align:center;font-weight:700;font-size:15px}
.bar{height:9px;background:#EEE9DD;border-radius:6px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--or);border-radius:6px}
.bar.vert > i{background:#5BA86B}
.acc{border:1px solid var(--ligne);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.acc > .h{padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc > .h .nm{font-weight:700;font-size:13.5px}
.acc > .h .meta{font-size:11px;color:var(--or);font-weight:600;white-space:nowrap}
.acc > .b{display:none;padding:0 15px 14px;font-size:13px;line-height:1.65;color:var(--anthr);white-space:pre-line;border-top:1px solid #F0ECE2}
.acc.open > .b{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--ligne);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 2px 8px;cursor:pointer;color:#A9A293;font-size:10px;font-weight:600}
.nav button .ic{font-size:19px;display:block;margin-bottom:2px}
.nav button.act{color:var(--bleu)}
.tab{display:none}
/* --- onglet Finance : calcul mental et fiches --- */
.fq{font-size:20px;font-weight:800;color:var(--bleu);line-height:1.35;margin:2px 0 12px}
.fin-in{width:100%;padding:13px;font-size:19px;font-weight:700;text-align:center;
  border:2px solid var(--ligne);border-radius:11px;background:#fff;color:var(--bleu)}
.fin-in:focus{outline:0;border-color:var(--bleu)}
.fbon{background:var(--vertbg);border-color:var(--vert)}
.fmal{background:var(--rougebg);border-color:var(--rouge)}
.ftip{background:#FCF8EC;border-left:3px solid var(--or);border-radius:0 9px 9px 0;
  padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--anthr);margin-top:10px}
.frep{font-size:15px;font-weight:700;margin-top:10px}
.fprog{height:5px;background:var(--ligne);border-radius:3px;overflow:hidden;margin-bottom:12px}
.fprog i{display:block;height:100%;background:var(--bleu)}
.fmeta{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--or);margin-bottom:6px}
.fduo{display:flex;gap:9px;margin-top:10px}
.fduo .btn{margin-top:0}
.bsec{background:var(--surface);color:var(--bleu);border:1px solid var(--ligne)}
body.dark .fin-in,body.dark .fq{color:var(--accent)}
body.dark .ftip{background:var(--surface2)}.tab.act{display:block}
.rdv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #F0ECE2;align-items:flex-start}
.rdv:last-child{border-bottom:0}
.rdv .j{background:var(--creme);border-radius:10px;padding:6px 9px;text-align:center;min-width:52px;flex:none}
.rdv .j .n{font-size:17px;font-weight:800;line-height:1}
.rdv .j .m{font-size:9.5px;text-transform:uppercase;color:var(--anthr);letter-spacing:.4px}
.rdv .c{flex:1}
.rdv .c .t{font-weight:700;font-size:13.5px}
.rdv .c .h{font-size:12px;color:var(--or);font-weight:600;margin-top:1px}
.rdv .c .w{font-size:12px;color:var(--anthr);margin-top:4px;line-height:1.45}
.rdv.urgent .j{background:var(--rougebg)}
.gcal{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--bleu);
  background:var(--creme);border:1px solid var(--ligne);border-radius:16px;padding:5px 12px;text-decoration:none}
.donut{display:block;margin:4px auto 0}
#restT.fini{color:var(--vert);animation:flash .5s ease-in-out 3}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.25}}
.donut-c{font-size:20px;font-weight:800;fill:var(--bleu)}
.donut-l{font-size:9px;fill:var(--anthr);text-transform:uppercase;letter-spacing:.6px}
.mvt{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F0ECE2;font-size:13px;gap:8px}
.mvt:last-child{border-bottom:0}
.mvt .g{flex:1}
.mvt .cat{font-size:11px;color:var(--anthr)}
.mvt .amt{font-weight:700;white-space:nowrap}
.mvt .amt.in{color:var(--vert)}
.mvt .amt.out{color:var(--rouge)}
.mvt .del{background:none;border:0;color:#C9C2B4;font-size:15px;cursor:pointer;padding:0 2px}
.form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form input,.form select{flex:1;min-width:88px;padding:11px;border:1px solid var(--ligne);border-radius:10px;background:var(--surface);color:var(--bleu);
  font-size:14px;font-family:inherit;background:#fff;color:var(--bleu)}
.kpi{display:flex;gap:10px}
.kpi .box{flex:1;background:var(--creme);border-radius:12px;padding:11px 8px;text-align:center}
.kpi .box .n{font-size:18px;font-weight:800}
.kpi .box .t{font-size:9.5px;color:var(--anthr);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.kpi .box.v .n{color:var(--vert)}.kpi .box.r .n{color:var(--rouge)}
.skill{border:1px solid var(--ligne);border-radius:12px;padding:12px;margin-bottom:9px;background:#fff}
.skill .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skill .nm{font-weight:700;font-size:13.5px}
.skill .lvl{font-size:11px;color:var(--or);font-weight:700;white-space:nowrap}
.skill .why{font-size:12px;color:var(--anthr);margin-top:5px;line-height:1.5}
.skill .dots{display:flex;gap:5px;margin-top:9px}
.skill .dots span{width:26px;height:8px;border-radius:4px;background:#EEE9DD;cursor:pointer}
.skill .dots span.on{background:var(--or)}
.skill .res{font-size:11.5px;color:var(--anthr);margin-top:8px;line-height:1.5;padding-top:8px;border-top:1px solid #F0ECE2}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid #F0ECE2;cursor:pointer}
.chk:last-child{border-bottom:0}
/* La case a cocher du Parcours, posee DANS le titre d'un accordeon : elle doit
   pouvoir etre touchee sans ouvrir ni fermer le bloc. */
.pchk{display:inline-flex;width:19px;height:19px;border:2px solid var(--ligne);border-radius:6px;
  align-items:center;justify-content:center;font-size:12px;color:transparent;margin-right:8px;
  vertical-align:-3px;flex:none;cursor:pointer}
/* La coche prend --surBadge et non du blanc : en mode sombre le vert
   s'eclaircit, et un blanc dessus ne se voit plus. */
.pchk.on{background:var(--vert);border-color:var(--vert);color:var(--surBadge)}
.chk .bx{color:transparent}
.chk.on .bx{color:var(--surBadge)}

/* ---------- La typographie de Cap 2027 ----------
   Trois roles, trois polices. Bricolage Grotesque pour les titres, parce qu il
   a du caractere sans etre bavard. IBM Plex Sans pour le corps, qui tient bien
   les accents francais. IBM Plex Mono partout ou il y a des CHIFFRES ou des
   etiquettes : des nombres qui ne s alignent pas se comparent mal. */
.head h1, .card h2, .hero .big, .avt h2, .acquis h2, .fq{
  font-family:'Bricolage Grotesque', Georgia, serif;
}
.head h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.card h2{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:600}
.head .date, .avp, .tally, .chip, .lvl, .avl b, .fmeta, .meta, .pill{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
}
.hero .big{font-weight:800;letter-spacing:-.02em}
.fq{font-weight:800;letter-spacing:-.015em;color:var(--accent)}
.nav button.act{color:var(--accent)}
.avp{color:var(--accent)}
.card h2 .tag{color:var(--accent)}

/* Le bandeau de mise a jour, pose au-dessus de la barre du bas. */
#majBar{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;
  background:var(--accent);color:#fff;display:flex;align-items:center;gap:10px;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));font-size:13px;font-weight:600}
#majBar button{margin-left:auto;background:#fff;color:var(--accent);border:0;border-radius:9px;
  padding:7px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
@media (min-width:980px){ #majBar{max-width:none;left:238px} }
#horsBar{position:fixed;left:0;right:0;bottom:0;z-index:55;max-width:520px;margin:0 auto;
  background:var(--anthr);color:var(--surBadge);text-align:center;font-size:12px;font-weight:600;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
@media (min-width:980px){ #horsBar{max-width:none;left:238px} }

/* ---------- L'avancement : un seul dessin, sur tous les onglets ---------- */
.avb{display:flex;gap:3px;border-radius:99px;overflow:hidden}
.avs{position:relative;border-radius:99px;overflow:hidden;background:var(--ligne);cursor:pointer;
  transition:transform .12s ease}
.avs:hover{transform:translateY(-1px)}
.avs i{position:absolute;top:0;bottom:0;left:0;display:block;border-radius:99px;width:0;
  transition:width .45s cubic-bezier(.22,.9,.3,1)}

.avt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px}
.avt h2{margin:0}
.avp{font-size:26px;font-weight:800;line-height:1;color:var(--bleu);font-variant-numeric:tabular-nums}
.avp span{font-size:14px;font-weight:700;margin-left:1px;opacity:.7}
.avl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--anthr)}
.avl span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.avl i{width:8px;height:8px;border-radius:50%;flex:none}
.avl b{font-variant-numeric:tabular-nums}
/* La barre fine de l'en-tete, visible sur tous les onglets. Elle porte son
   nom a gauche et son pourcentage a droite : sans eux, personne ne sait ce
   qu'il regarde. */
.avtop{padding:0 14px 10px}
.avtop-in{display:flex;align-items:center;gap:10px}
.avtop-in .avb{flex:1;min-width:0}
.avtop-t{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.55);
  white-space:nowrap;flex:none;transition:color .2s}
.avtop-t.vif{color:var(--accent);text-transform:none;letter-spacing:0;font-size:10.5px}
.avtop-p{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;
  font-weight:600;color:#fff;font-variant-numeric:tabular-nums;flex:none}
.avtop .avs{background:rgba(255,255,255,.14)}
@media (prefers-reduced-motion: reduce){ .avs i{transition:none} .avs:hover{transform:none} }

/* ================= LA VERSION ORDINATEUR =================
   Pas un second fichier : la MEME app, une autre mise en page. Steve a
   demande « ne cree plus d autre app », donc tout se joue ici, en CSS.
   Sur telephone rien ne change. A partir de 980 pixels, le menu du bas
   devient une colonne a gauche, l en-tete prend toute la largeur, et le
   contenu respire au lieu de rester coince dans 520 pixels. */
@media (min-width: 980px){
  body{
    max-width:none; margin:0; padding-bottom:0; min-height:100vh;
    display:grid; align-items:start;
    grid-template-columns:238px minmax(0, 1fr);
    grid-template-rows:auto auto 1fr;
    grid-template-areas:"menu entete" "menu barre" "menu contenu";
    background:var(--fondpage, transparent);
  }
  .head{grid-area:entete; padding:20px 26px 16px}
  .head h1{font-size:21px}
  .head button{top:18px; right:22px}
  .avtop{grid-area:barre; padding:0 26px 12px; background:var(--bleu)}

  /* Le menu devient une colonne, colle en haut, et dit ou on est. */
  .nav{
    grid-area:menu; position:sticky; top:0; align-self:stretch;
    max-width:none; margin:0; height:100vh;
    flex-direction:column; justify-content:flex-start; gap:2px;
    border-top:0; border-right:1px solid var(--ligne);
    padding:18px 10px 18px 12px;
  }
  .nav button{
    flex:none; display:flex; align-items:center; gap:11px; width:100%;
    text-align:left; padding:11px 13px; font-size:13.5px; border-radius:10px;
    transition:background .14s ease, color .14s ease;
  }
  .nav button .ic{display:inline; margin:0; font-size:18px; line-height:1}
  .nav button:hover{background:rgba(20,33,61,.06); color:var(--anthr)}
  .nav button.act{background:var(--bleu); color:#fff}
  body.dark .nav button:hover{background:rgba(255,255,255,.07)}

  .tab{grid-area:contenu}
  /* Le contenu devient une GRILLE de cartes, corrige le 22/09/2026.
     Steve : la version pc ne prend pas tout mon ecran. Mesure a 1920 :
     le body etait bloque a 1280 pixels, 312 vides a gauche, 328 a droite,
     et le contenu n utilisait que 54 % de l ecran.
     Les cartes de l app sont dessinees pour un telephone, autour de 490
     pixels. On les garde a cette taille et on en met autant que l ecran
     en porte, chacune d au moins 460 pixels : une colonne sur un petit
     portable, deux vers 1366 ou 1536, trois sur un ecran de 1920. */
  .wrap{
    padding:22px 26px 60px; max-width:none;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(460px, 1fr));
    gap:14px; align-items:start;
  }
  .wrap > *{margin-bottom:0}
  /* Ce qui introduit l onglet prend toute la ligne. */
  .wrap > .hero, .wrap > .hint, .wrap > .avc, .wrap > .note,
  .wrap > p, .wrap > h2, .wrap > h3{grid-column:1 / -1}
  /* Une carte seule, l ecran de demarrage du budget par exemple, se centre
     au lieu de rester collee a gauche avec deux colonnes vides a cote. */
  .wrap > :only-child{grid-column:1 / -1; justify-self:center; width:100%;
    max-width:760px}

  /* Le raccourci clavier, affiche a droite de chaque entree du menu. */
  .nav button::after{
    content:attr(data-k); margin-left:auto; font-size:10.5px; font-weight:700;
    opacity:.45; border:1px solid currentColor; border-radius:5px;
    padding:1px 5px; line-height:1.3;
  }
}

/* A l impression, on garde le fond blanc, on enleve le menu et les barres,
   et on laisse le plan tenir sur le papier. */
@media print{
  .nav, .avtop, #darkBtn, .asFab, .asVoile{display:none !important}
  body{max-width:none; display:block; padding:0}
  .head{position:static; background:#fff; color:#000; border-bottom:2px solid #000}
  .head h1{color:#000} .head .date{color:#444}
  .card{break-inside:avoid; border:1px solid #bbb; box-shadow:none}
  .acc .b{display:block !important}
}
.chk .bx{width:20px;height:20px;border:2px solid var(--ligne);border-radius:6px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;color:#fff}
.chk.on .bx{background:var(--vert);border-color:var(--vert)}
.chk.on .nm{text-decoration:line-through;color:#A9A293}
.hint{background:#FCF8EC;border:1px dashed var(--or);border-radius:11px;padding:11px 13px;font-size:12.5px;
  color:var(--anthr);line-height:1.55;margin-bottom:12px}
textarea{width:100%;border:1px solid var(--ligne);border-radius:10px;padding:10px;font-size:13.5px;
  font-family:inherit;color:var(--bleu);min-height:60px;background:#fff}
.jour-repas{border:1px solid var(--ligne);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:#fff}
.jour-repas:last-child{margin-bottom:0}
.jour-repas.auj{border-color:var(--or);border-width:2px;background:#FCF8EC}
.jour-repas .d{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--or);margin-bottom:6px}
.jour-repas .l{display:flex;gap:9px;font-size:12.5px;padding:3px 0;line-height:1.45}
.jour-repas .l .q{color:#A9A293;min-width:64px;flex:none;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding-top:3px}
.jour-repas .l .v{color:var(--anthr);flex:1}
.jour-repas .l .v b{color:var(--bleu)}
.chk .nm .sq{display:block;font-size:11px;color:#A9A293;font-weight:600;margin-top:1px}
.chk .qt{font-size:11px;color:#A9A293;white-space:nowrap;margin-left:auto;font-weight:700;flex:none}
.chk.on .qt,.chk.on .sq{text-decoration:line-through}
.alerte{background:var(--rougebg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;
  color:var(--rouge);font-weight:600;margin-top:9px}
.etape{display:flex;gap:9px;padding:4px 0;font-size:12.5px;line-height:1.6;color:var(--anthr)}
.etape .n{width:19px;height:19px;border-radius:50%;background:var(--bleu);color:#fff;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.ing{background:var(--creme);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:var(--anthr)}
.ing b{color:var(--bleu)}
body.dark{
  --creme:#0E1413; --bleu:#E7EEEB; --anthr:#9BABA7; --ligne:#293533;
  --or:#D7A34E; --vert:#6DBE8B; --rouge:#E58573; --accent:#54BCA7;
  --surface:#171F1E; --surface2:#1E2827; --bleuclair:#75847F;
  --hintbg:#2E2617; --surBadge:#0E1413;
  --vertbg:#172C20; --rougebg:#33201C;
  --h-agenda:#9FB5B1; --h-sante:#E3B04B; --h-cv:#54BCA7; --h-nat:#8AA8F0;
  --h-civ:#B58AE0; --h-bi:#4FB8D9; --h-sql:#A6CC63; --h-can:#EF8FA8;
}
body.dark .card,body.dark .acc,body.dark .skill,body.dark .nav,body.dark input,body.dark select,
body.dark textarea,body.dark .pill,body.dark .step button{background:var(--surface);color:var(--bleu)}
body.dark .head{background:#0B100F;border-bottom:1px solid var(--ligne)}
body.dark .hero{background:#12302C}
body.dark .kpi .box,body.dark .rdv .j{background:var(--surface2)}
body.dark .hint{background:#2E2617}
body.dark .jour-repas{background:var(--surface2)}
body.dark .jour-repas.auj{background:#2E2617}
body.dark .alerte{background:var(--rougebg);color:#F0B5A8}
/* la ligne qu'il vient d'importer brille, la ou il regarde */
.row.papflash{background:var(--vertbg);box-shadow:inset 3px 0 0 var(--vert);transition:background .6s}
body.dark .ing{background:var(--surface2)}
body.dark .etape .n{background:#2A3A36}
body.dark .bar{background:var(--ligne)}
body.dark .nav button{color:var(--bleuclair)}
body.dark .donut-c{fill:var(--bleu)}
/* ---------- L'assistant global, ajoute le 13/09/2026 ---------- */
.asFab{position:fixed;left:12px;bottom:72px;z-index:60;width:54px;height:54px;border-radius:50%;
  background:var(--bleu);color:#fff;font-size:21px;cursor:pointer;
  /* Le lisere creme le detache du texte : sans lui il se posait au ras des phrases. */
  border:3px solid var(--creme);
  box-shadow:0 6px 18px rgba(31,56,100,.34);display:flex;align-items:center;justify-content:center;
  transition:transform .16s ease}
.asFab:active{transform:scale(.92)}
.asVoile{position:fixed;inset:0;z-index:70;background:rgba(20,24,34,.46);display:none;
  opacity:0;transition:opacity .2s ease}
.asVoile.on{display:block}
.asVoile.vu{opacity:1}
.asPan{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--creme);
  border-radius:20px 20px 0 0;display:none;flex-direction:column;height:88vh;max-height:88vh;
  box-shadow:0 -10px 34px rgba(20,24,34,.24);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.22,1,.36,1)}
.asPan.on{display:flex}
.asPan.vu{transform:translateY(0)}

/* La poignee : glisser vers le bas ferme, c'est le geste attendu sur telephone. */
.asPoignee{padding:9px 0 4px;cursor:grab;touch-action:none;display:flex;justify-content:center}
.asPoignee i{display:block;width:42px;height:4px;border-radius:3px;background:var(--ligne)}
.asPan > .t{padding:2px 15px 11px;border-bottom:1px solid var(--ligne);display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.asPan > .t .nom{display:flex;align-items:center;gap:9px;min-width:0}
.asPan > .t .av{width:30px;height:30px;border-radius:50%;background:var(--bleu);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.asPan > .t b{font-size:15px;display:block;line-height:1.15}
.asPan > .t .sous{font-size:11px;color:var(--anthr);opacity:.75}
.asPan > .t .out{display:flex;gap:4px;flex:0 0 auto}
.asPan > .t .x{background:none;border:none;font-size:19px;line-height:1;cursor:pointer;
  color:var(--anthr);width:34px;height:34px;border-radius:9px}
.asPan > .t .x:active{background:var(--ligne)}

.asLog{flex:1;overflow-y:auto;padding:14px 15px 4px;min-height:120px;-webkit-overflow-scrolling:touch}
.asEch{margin-bottom:16px}
.asQ{background:var(--bleu);color:#fff;border-radius:16px 16px 5px 16px;padding:10px 14px;
  margin:0 0 9px auto;max-width:84%;width:fit-content;font-size:14.5px;line-height:1.5;
  animation:asMonte .22s ease both}
.asDe{font-size:10.5px;color:var(--anthr);opacity:.62;margin:0 2px 4px;display:flex;
  align-items:center;gap:5px}
.asDe.moi{justify-content:flex-end}
.asR{background:#fff;border-radius:16px 16px 16px 5px;padding:13px 15px;
  font-size:14.5px;line-height:1.62;color:var(--anthr);overflow-wrap:break-word;
  box-shadow:0 1px 3px rgba(20,24,34,.07);animation:asMonte .24s ease both}
.asR > *:first-child{margin-top:0}
.asR .ing{font-size:15px;line-height:1.5}
.asR .note{font-size:13.5px;line-height:1.58}
.asR .row{padding:9px 0}
.asR .lab{font-size:13.5px}
.asR .etape{font-size:13.5px;line-height:1.62;padding:6px 0}
@keyframes asMonte{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* Trois points : la reponse est instantanee, mais l'oeil a besoin de savoir ou regarder. */
.asTape{background:#fff;border-radius:16px 16px 16px 5px;padding:14px 16px;width:fit-content;
  box-shadow:0 1px 3px rgba(20,24,34,.07);display:flex;gap:5px}
.asTape i{width:7px;height:7px;border-radius:50%;background:var(--anthr);opacity:.4;
  animation:asPoint 1.1s infinite}
.asTape i:nth-child(2){animation-delay:.18s}
.asTape i:nth-child(3){animation-delay:.36s}
@keyframes asPoint{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:.85;transform:translateY(-4px)}}

.asSuites{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.asChip{background:var(--creme);border:1px solid var(--ligne);border-radius:16px;
  padding:8px 13px;font-size:13px;cursor:pointer;color:var(--bleu);font-weight:600;
  line-height:1.2}
.asChip:active{background:var(--ligne)}

.asBasBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:104px;z-index:5;
  background:#fff;border:1px solid var(--ligne);border-radius:50%;width:36px;height:36px;
  cursor:pointer;box-shadow:0 3px 10px rgba(20,24,34,.16);font-size:15px;display:none;
  color:var(--bleu)}
.asBasBtn.on{display:block}

.asBas{padding:11px 15px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--ligne);
  background:var(--creme);border-radius:0 0 20px 20px}
.asBas .form{display:flex;gap:8px;align-items:flex-end}
.asBas textarea{flex:1;min-width:0;resize:none;height:44px;max-height:112px;overflow-y:auto;
  font-size:15px;line-height:1.45;padding:11px 13px;font-family:inherit}
.asEnv{width:44px;height:44px;border-radius:50%;background:var(--bleu);color:#fff;border:none;
  font-size:17px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.asEnv:disabled{opacity:.4}
.asBas .pills{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px}
.asOk{background:var(--vertbg);border-radius:11px;padding:11px 13px;font-size:13.5px;
  line-height:1.55;color:var(--anthr);margin-top:8px}
.asIco{background:var(--creme);border:1px solid var(--ligne);border-radius:50%;width:44px;
  height:44px;font-size:17px;cursor:pointer;flex:0 0 auto;line-height:1}
body.dark .asPan,body.dark .asBas{background:var(--surface)}
body.dark .asR,body.dark .asTape{background:var(--surface2);box-shadow:none}
body.dark .asChip,body.dark .asBasBtn{background:var(--surface2);border-color:var(--ligne);color:var(--anthr)}
/* ---------- La voix et le mode cuisine, 13/09/2026 ---------- */
.asIco{background:var(--creme);border:1px solid var(--ligne);border-radius:12px;width:42px;
  height:38px;font-size:17px;cursor:pointer;flex:0 0 auto;line-height:1}
.asIco.on{background:var(--bleu);border-color:var(--bleu);color:#fff}
.asIco.ecoute{background:var(--rouge);border-color:var(--rouge);color:#fff;animation:asPulse 1s infinite}
@keyframes asPulse{0%,100%{opacity:1}50%{opacity:.45}}
.asCuis{background:var(--bleu);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.asCuis .p{font-size:11px;letter-spacing:.6px;text-transform:uppercase;opacity:.72}
.asCuis .e{font-size:15px;line-height:1.55;margin-top:5px}
.asCuis .b{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.asCuis .b button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:9px;
  padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.asMin{background:var(--orbg);border-radius:11px;padding:10px 13px;margin-bottom:11px;
  font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:9px}
.asMin b{font-size:16px}
body.dark .asIco{background:var(--surface2);border-color:var(--ligne);color:var(--bleu)}

/* --- onglet AMF : revision de la certification --- */
.aopt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--anthr);
  border:1.5px solid var(--ligne);border-radius:11px;padding:13px 14px;margin-bottom:9px;
  font-size:14px;line-height:1.45;cursor:pointer;font-family:inherit}
.aopt:disabled{cursor:default}
.aopt .alet{display:inline-block;width:21px;height:21px;line-height:21px;text-align:center;
  border-radius:50%;background:var(--ligne);color:var(--anthr);font-weight:800;font-size:11px;
  margin-right:9px;vertical-align:1px}
.aopt.bon{background:var(--vertbg);border-color:var(--vert)}
.aopt.bon .alet{background:var(--vert);color:#fff}
.aopt.mal{background:var(--rougebg);border-color:var(--rouge)}
.aopt.mal .alet{background:var(--rouge);color:#fff}
.abar{height:7px;border-radius:5px;background:var(--ligne);overflow:hidden;margin-top:6px}
.abar i{display:block;height:100%;background:var(--rouge);border-radius:5px}
.ath{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.ath:last-child{border-bottom:0}
.ath b{font-size:14px}
.ath span{font-size:12px;color:var(--anthr);white-space:nowrap}
.aprog{font-size:12px;color:var(--anthr);font-weight:700;letter-spacing:.04em}
/* L ecran de verrouillage de la version chiffree, voir le chargeur en bas de page. */
#verrou{position:fixed;inset:0;z-index:200;background:var(--bleu);color:#fff;
  display:flex;align-items:center;justify-content:center;padding:24px}
#verrou .vc{width:100%;max-width:420px}
#verrou h1{font-size:22px;font-weight:800;margin-bottom:10px}
#verrou p{font-size:14.5px;line-height:1.55;color:#C3CADB;margin-bottom:16px}
#verrou form{display:flex;gap:8px}
#verrou input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;
  border:0;border-radius:10px;letter-spacing:.05em}
#verrou button{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:10px;
  background:var(--or);color:var(--bleu);cursor:pointer}
#verrou button:disabled{opacity:.6}
#verrou .vm{margin:12px 0 0;color:#F2C94C;min-height:1.4em}

.aret{background:var(--vertbg);border-left:3px solid var(--vert);border-radius:0 9px 9px 0;
  padding:11px 13px;margin-top:12px;font-size:13.5px;line-height:1.5}
.aret b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--vert);margin-bottom:4px}
.afiche h3{font-size:15px;margin:18px 0 7px}
.afiche p{font-size:14px;line-height:1.6;margin:0 0 10px}
.afiche ul{margin:0 0 10px;padding-left:19px}
.afiche li{font-size:14px;line-height:1.55;margin-bottom:5px}
/* 03/10/2026 : la veille montre trois nouvelles, la suite derriere un bouton. */
.veille .sigPlus{display:none}
.veille.sigTout .sigPlus{display:block}
.sigCarre{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:middle}
/* La bulle de l'assistant s'efface en defilant vers le bas, elle cachait le debut des lignes. */
.asFab{transition:transform .25s ease, opacity .25s ease}
.asFab.cache{transform:translateY(160%);opacity:0;pointer-events:none}
/* Une carte pliable ne montre que son titre ; un toucher l'ouvre. */
.pliable > h2{cursor:pointer;display:flex;align-items:center;gap:8px}
.pliable > h2::after{content:"ouvrir";margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  color:var(--or);border:1px solid currentColor;border-radius:6px;padding:1px 7px;text-transform:none}
.pliable.ouvert > h2::after{content:"fermer"}
.pliable:not(.ouvert) > :not(h2):not(.top){display:none}
.pliable:not(.ouvert) > h2{margin-bottom:0}
/* 04/10/2026 : l'AMF rangé sous Finance, un sélecteur en haut des deux onglets. */
.nav button[data-sous]{display:none !important}
.sousnav{display:flex;gap:6px;padding:12px 14px 0}
.sousnav button{flex:1;font:inherit;font-size:13px;font-weight:700;padding:9px 10px;border-radius:10px;
  border:1px solid var(--ligne);background:var(--surface);color:var(--anthr);cursor:pointer}
/* --accent et --surBadge, comme le bouton principal : lisible en clair ET en sombre.
   --bleu devient presque blanc en mode sombre, le blanc dessus ne se lisait plus. */
#t-fin .sousnav [data-va="fin"], #t-amf .sousnav [data-va="amf"]{background:var(--accent);color:var(--surBadge);border-color:var(--accent)}
@media (min-width: 980px){ .sousnav{padding:22px 26px 0;max-width:620px} }
/* Les compétences se replient sous leur ligne de titre, comme les cartes. */
.pliable > .top{cursor:pointer}
.pliable > .top::after{content:"ouvrir";flex:none;font-size:10.5px;font-weight:700;color:var(--or);
  border:1px solid currentColor;border-radius:6px;padding:1px 7px}
.pliable.ouvert > .top::after{content:"fermer"}

/* ================= v129 : L'APP FAÇON JEU (Steve, 23/10/2026) =================
   « Beaucoup plus jolie, avec des belles transitions, comme Duolingo. » Les couleurs
   vives, les gros boutons à rebord qui s'enfoncent, la police ronde Nunito, les cartes
   qui arrivent en cascade. Tout est AJOUTÉ à la fin : les règles d'avant restent, celles-ci
   passent par-dessus. Le mode sombre garde ses variables. */
:root{
  --j-vert:#58CC02; --j-vertf:#46A302; --j-bleu:#1CB0F6; --j-bleuf:#1899D6;
  --j-or:#FFC800; --j-orf:#E5A100; --j-rouge:#FF4B4B; --j-rougef:#EA2B2B;
  --j-violet:#CE82FF; --j-violetf:#A568CC; --j-orange:#FF9600; --j-gris:#E5E5E5;
  --j-texte:#3C3C3C; --jHaut:64px;
}
body.dark{ --j-gris:#2E3C44; --j-texte:#EEF4F7; }
html,body{font-family:'Nunito','IBM Plex Sans',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif}
.head h1,.card h2,.hero .big,.avt h2,.acquis h2,.fq{font-family:'Nunito','Bricolage Grotesque',system-ui,sans-serif}
body{background:var(--creme)}
body.jFige{overflow:hidden}

/* L'en-tête : un dégradé vif, le score et la série à droite */
.head{background:linear-gradient(120deg,#58CC02 0%,#1CB0F6 100%);box-shadow:0 3px 0 rgba(0,0,0,.08)}
body.dark .head{background:linear-gradient(120deg,#2C6A0B 0%,#0B5E86 100%)}
.head h1{font-weight:900;letter-spacing:-.01em;padding-right:120px}
.head .date{color:#fff;opacity:.95;font-weight:800}
.head button{border-radius:12px}
.jXp{position:absolute;top:14px;right:56px;display:flex;gap:6px}
.jXp span{background:rgba(255,255,255,.22);color:#fff;font-weight:900;font-size:12.5px;border-radius:11px;padding:7px 8px;line-height:1}
.avtop{background:transparent}

/* Les cartes : épaisses, arrondies, un rebord en bas */
.card{border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:18px;scroll-margin-top:calc(var(--jHaut) + 58px)}
.card h2{font-weight:900;letter-spacing:.5px;color:var(--j-bleuf)}
body.dark .card h2{color:#7FD3FF}
.hero{background:linear-gradient(135deg,#1CB0F6 0%,#7A5AF8 100%);border:0;box-shadow:0 4px 0 #5B3FD6}
.hero h2{color:rgba(255,255,255,.85)!important}
body.dark .hero{background:linear-gradient(135deg,#0B5E86 0%,#4B33A8 100%)}
.card.jFlash{animation:jFlash .9s ease-out}
@keyframes jFlash{0%{box-shadow:0 0 0 0 rgba(28,176,246,.55)}100%{box-shadow:0 0 0 14px rgba(28,176,246,0)}}

/* Les boutons qui s'enfoncent */
.btn{background:var(--j-vert);color:#fff;border-radius:16px;font-weight:900;letter-spacing:.2px;
  box-shadow:0 4px 0 var(--j-vertf);transition:transform .08s ease,box-shadow .08s ease;margin-bottom:4px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--j-vertf)}
.btn:disabled{background:var(--j-gris);color:#AFAFAF;box-shadow:0 4px 0 #CFCFCF;cursor:default}
.btn.bsec,.btn.light{background:var(--surface);color:var(--j-bleuf);border:2px solid var(--j-gris);box-shadow:0 4px 0 var(--j-gris)}
.btn.or{background:var(--j-or);color:#4A3600;box-shadow:0 4px 0 var(--j-orf)}
.btn.rouge{background:var(--j-rouge);box-shadow:0 4px 0 var(--j-rougef)}
.pill{border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:14px;font-weight:800;color:var(--j-texte);
  transition:transform .08s ease;text-decoration:none}
.pill:active{transform:translateY(2px)}
.pill.on{background:var(--j-bleu);border-color:var(--j-bleuf);color:#fff}
.kpi .box{border-radius:14px}
.hero .kpi .box{background:rgba(255,255,255,.18)}
.hero .kpi .box .t{color:rgba(255,255,255,.85)}

/* La barre du bas : des icônes qui sautent quand on les touche */
.nav{border-top:2px solid var(--j-gris);padding-left:4px;padding-right:4px}
.nav button{border-radius:14px;margin:5px 1px;padding:6px 2px 5px;font-weight:800;color:#9AA3A8}
.nav button .ic{font-size:22px;filter:grayscale(.5);transition:transform .2s ease,filter .2s ease}
.nav button.act{color:var(--j-bleuf);background:rgba(28,176,246,.12);box-shadow:inset 0 0 0 2px rgba(28,176,246,.5)}
.nav button.act .ic{filter:none;animation:jHop .45s ease}
.nav button.cache{display:none!important}
@keyframes jHop{0%{transform:scale(.8)}55%{transform:scale(1.25) translateY(-3px)}100%{transform:none}}

/* Les onglets arrivent, les cartes suivent en cascade */
.tab.jEntre{animation:jTab .32s cubic-bezier(.2,.8,.2,1)}
@keyframes jTab{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tab.jEntre .wrap > .card{animation:jCarte .5s cubic-bezier(.2,.9,.3,1.15) both}
.tab.jEntre .wrap > .card:nth-child(2){animation-delay:.05s}
.tab.jEntre .wrap > .card:nth-child(3){animation-delay:.1s}
.tab.jEntre .wrap > .card:nth-child(4){animation-delay:.15s}
.tab.jEntre .wrap > .card:nth-child(5){animation-delay:.2s}
.tab.jEntre .wrap > .card:nth-child(n+6){animation-delay:.25s}
@keyframes jCarte{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* Le sommaire de l'onglet, collé sous l'en-tête */
.jSom{position:sticky;top:var(--jHaut);z-index:15;display:flex;gap:7px;overflow-x:auto;padding:10px 14px 8px;
  background:var(--creme);scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.jSom::-webkit-scrollbar{display:none}
.jSom button{flex:none;font:inherit;font-size:12.5px;font-weight:800;border:2px solid var(--j-gris);border-bottom-width:3px;
  background:var(--surface);color:var(--j-texte);border-radius:12px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.jSom button.on{background:var(--j-bleu);border-color:var(--j-bleuf);color:#fff}
.sousnav{padding-top:10px}

/* Le grand menu « Tout » */
.jHub{position:fixed;inset:0;z-index:80;background:rgba(15,25,35,.55);display:none;align-items:flex-end;justify-content:center}
.jHub.on{display:flex}
.jHub .p{background:var(--creme);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:jMonte .32s cubic-bezier(.2,.9,.3,1.1)}
@keyframes jMonte{from{transform:translateY(100%)}to{transform:none}}
.jHubT{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 12px;font-size:19px;font-weight:900}
.jHubT .x,.jLec .x{border:0;background:none;font-size:30px;line-height:1;color:#AFAFAF;cursor:pointer}
.jHub .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jTuile{border:0;border-radius:18px;padding:14px 6px 12px;color:#fff;font:inherit;font-weight:900;font-size:13.5px;cursor:pointer;
  background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.25);text-align:center;transition:transform .1s ease,box-shadow .1s ease}
.jTuile .e{display:block;font-size:30px;margin-bottom:6px;line-height:1.1}
.jTuile .s{display:block;font-weight:700;font-size:10.5px;opacity:.92;margin-top:3px;line-height:1.25}
.jTuile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.jHubPied{text-align:center;margin-top:14px}

/* Les points qui s'envolent, les confettis */
.jFlotte{position:fixed;z-index:120;transform:translate(-50%,-50%);font-weight:900;color:var(--j-or);font-size:22px;
  text-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none;animation:jFlotteA 1.1s ease-out forwards}
@keyframes jFlotteA{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}to{opacity:0;transform:translate(-50%,-160%) scale(1.15)}}
.jConf{position:fixed;top:-14px;width:9px;height:14px;z-index:130;border-radius:2px;pointer-events:none;animation:jConfA 2s ease-in forwards}
@keyframes jConfA{to{transform:translate(var(--dx),106vh) rotate(760deg)}}

/* Nova, la bulle qui parle */
.jBulleZ{display:flex;gap:10px;align-items:flex-end;margin:4px 0 10px}
.jNovaSvg{flex:none;animation:jFlotteNova 3s ease-in-out infinite}
@keyframes jFlotteNova{50%{transform:translateY(-4px) rotate(-4deg)}}
.jBulle{position:relative;background:var(--surface);color:var(--j-texte);border:2px solid var(--j-gris);border-radius:16px;
  padding:10px 13px;font-size:14px;font-weight:700;line-height:1.45}
.jBulle:before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--surface);
  border-left:2px solid var(--j-gris);border-bottom:2px solid var(--j-gris);transform:rotate(45deg)}
.asFab{display:flex;align-items:center;justify-content:center}

/* Le chemin de la semaine */
.jChemin{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 6px}
.jNoeud{position:relative;width:74px;height:68px;border-radius:50%;border:0;font:inherit;cursor:pointer;color:#fff;font-weight:900;
  background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .1s ease,box-shadow .1s ease}
.jNoeud .e{font-size:25px;line-height:1}
.jNoeud .l{font-size:10.5px;margin-top:3px;text-transform:capitalize}
.jNoeud .n{position:absolute;top:-4px;right:-4px;background:var(--j-rouge);color:#fff;border-radius:10px;font-size:11px;padding:2px 6px;border:2px solid var(--surface)}
.jNoeud:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.jNoeud.auj{outline:5px solid rgba(28,176,246,.4);outline-offset:3px;animation:jPulse 1.8s ease-in-out infinite}
@keyframes jPulse{50%{outline-color:rgba(28,176,246,.08)}}

/* La feuille plein écran : un jour, une leçon */
.jLec{position:fixed;inset:0;z-index:90;background:var(--creme);display:none;flex-direction:column}
.jLec.on{display:flex;animation:jTab .25s ease}
.jLec .haut{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:600px;width:100%;margin:0 auto}
.jLec .haut .ti{font-size:18px;font-weight:900;text-transform:capitalize}
.jLec .prog{flex:1;height:16px;background:var(--j-gris);border-radius:10px;overflow:hidden}
.jLec .prog i{display:block;height:100%;background:var(--j-vert);border-radius:10px;transition:width .45s cubic-bezier(.2,.9,.3,1.2);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.jLec .corps{flex:1;overflow:auto;padding:6px 18px 24px;max-width:600px;width:100%;margin:0 auto}
.jLec .pied{padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--j-gris);max-width:600px;width:100%;margin:0 auto}
.jLec .pied.bon{background:#D7FFB8;border-color:transparent;max-width:none}
.jLec .pied.mal{background:#FFDFE0;border-color:transparent;max-width:none}
.jLec .pied.bon .btn,.jLec .pied.mal .btn{max-width:568px;margin-left:auto;margin-right:auto}
body.dark .jLec .pied.bon{background:#1F3A12} body.dark .jLec .pied.mal{background:#3E1D1F}
.jVerdict{font-size:20px;font-weight:900;max-width:568px;margin:0 auto}
.pied.bon .jVerdict{color:#3E8A00} .pied.mal .jVerdict{color:#D02B2B}
body.dark .pied.bon .jVerdict{color:#8EE04F} body.dark .pied.mal .jVerdict{color:#FF8A8A}
.jVerdictX{font-size:14px;font-weight:700;margin:4px auto 4px;max-width:568px;line-height:1.45}
.jMot{font-size:34px;font-weight:900;margin:12px 0 2px;color:var(--j-texte)}
.jMotGros{font-size:28px;font-weight:900;color:var(--j-texte)}
.jEcoute{border:2px solid var(--j-gris);border-bottom-width:4px;background:var(--surface);border-radius:12px;font-size:18px;padding:3px 8px;cursor:pointer;vertical-align:middle}
.jDef{font-size:18px;font-weight:800;margin:12px 0 6px;line-height:1.4}
.jEx{font-style:italic;color:var(--anthr);line-height:1.6;margin:6px 0}
.jQT{font-size:21px;font-weight:900;margin:14px 0 10px}
.jQE{font-size:16px;font-weight:700;background:var(--surface);border:2px solid var(--j-gris);border-radius:16px;padding:13px;margin-bottom:8px;line-height:1.5}
.jOpt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;font-weight:700;border:2px solid var(--j-gris);border-bottom-width:4px;
  border-radius:16px;padding:13px 14px;margin:9px 0;background:var(--surface);color:var(--j-texte);cursor:pointer;line-height:1.4;transition:transform .08s ease}
.jOpt:active{transform:translateY(2px)}
.jOpt.sel{border-color:var(--j-bleu);background:#DDF4FF;color:#1478A8}
.jOpt.ok{border-color:var(--j-vert);background:#D7FFB8;color:#3E8A00}
.jOpt.ko{border-color:var(--j-rouge);background:#FFDFE0;color:#D02B2B}
.jFinKpi{display:flex;gap:10px;margin-top:16px}
.jFinKpi div{flex:1;border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:16px;padding:12px;text-align:center}
.jFinKpi b{display:block;font-size:22px;font-weight:900;color:var(--j-orange)}
.jFinKpi span{font-size:12px;color:var(--anthr);font-weight:800}
.jLigne{display:flex;gap:12px;align-items:flex-start;padding:12px;margin:9px 0;border:2px solid var(--j-gris);border-left:6px solid var(--c);
  border-radius:14px;background:var(--surface)}
.jLigne .e{font-size:24px;line-height:1}
.jLigne b{font-size:14.5px}
.jLigne.jFait{opacity:.55}

/* Les projets : les étapes à cocher */
.jHeroProj{display:flex;align-items:center;gap:12px}
.jHeroL{flex:1}
.jAnneau{flex:none;color:#fff}
.jBarre{height:12px;background:var(--j-gris);border-radius:8px;overflow:hidden;margin:2px 0 6px}
.jBarre i{display:block;height:100%;border-radius:8px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.jTache{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:2px solid var(--j-gris);cursor:pointer}
.jTache:last-of-type{border-bottom:0}
.jTache .c{flex:none;width:30px;height:30px;border-radius:10px;border:2px solid var(--j-gris);border-bottom-width:4px;display:flex;
  align-items:center;justify-content:center;color:transparent;font-weight:900;font-size:16px;transition:transform .15s ease}
.jTache.on .c{background:var(--j-vert);border-color:var(--j-vertf);color:#fff;animation:jHop .4s ease}
.jTache .t{font-weight:800;font-size:14px;line-height:1.35}
.jTache.on .t{text-decoration:line-through;opacity:.55}
.jTache .x{font-size:12.5px;color:var(--anthr);margin-top:3px;line-height:1.45}
.jAmb .pill{margin-top:10px}
.jSortie{display:flex;gap:12px;padding:12px 0;border-bottom:2px solid var(--j-gris)}
.jSortie .im{flex:none;width:80px;height:80px;border-radius:16px;background:var(--surface2) center/cover no-repeat;display:flex;
  align-items:center;justify-content:center;font-size:34px;border:2px solid var(--j-gris)}
.jSortie .im.photo span{display:none}
.jSortie .c{flex:1;min-width:0}
.jSortie .t{font-weight:900;font-size:14.5px;line-height:1.3}
.jSortie .m{font-size:12px;font-weight:800;color:var(--j-orange);margin-top:2px;text-transform:capitalize}
.jSortie .x{font-size:12.5px;color:var(--anthr);margin-top:4px;line-height:1.45}
.jSortie .a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.jSortie .a .pill{padding:6px 11px;font-size:12px}

/* Les mots */
.jHeroMots .jBulle{color:var(--j-texte)}
.jPiege{display:flex;flex-direction:column;gap:6px}
.jPiege .ko{background:#FFDFE0;color:#C62828;border-radius:12px;padding:10px 12px;font-weight:800;text-decoration:line-through}
.jPiege .ok{background:#D7FFB8;color:#2E7D00;border-radius:12px;padding:10px 12px;font-weight:900}
body.dark .jPiege .ko{background:#3E1D1F;color:#FF9A9A} body.dark .jPiege .ok{background:#1F3A12;color:#9BE564}
.jSemLu{display:flex;gap:6px;margin-top:12px}
.jSemLu span{flex:1;text-align:center;border-radius:10px;padding:7px 0;font-weight:900;font-size:12px;background:var(--j-gris);color:#9AA3A8;text-transform:uppercase}
.jSemLu span.on{background:var(--j-orange);color:#fff}

/* Les vrais logos */
.jLogos{display:inline-flex;gap:6px;margin:6px 0 2px;vertical-align:middle}
.jLogo{width:26px;height:26px;border-radius:7px;background:#fff;object-fit:contain;padding:2px;box-shadow:0 0 0 2px var(--j-gris)}
.jDrap{width:22px;height:15px;border-radius:3px;object-fit:cover;vertical-align:-2px;margin-right:7px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.jDrapE{margin-right:6px}
.jThemeLogo img{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:contain;padding:4px;box-shadow:0 0 0 2px var(--j-gris)}

/* Le calcul mental : le raccourci, en grand */
.jVite{background:#FFF4D1;border:2px solid var(--j-or);border-bottom-width:4px;border-radius:16px;padding:12px 13px;margin-top:10px;
  font-size:14px;line-height:1.5;color:#4A3600;font-weight:700}
.jVite b{display:block;margin-bottom:4px;font-weight:900}
body.dark .jVite{background:#3A3000;color:#FFE9A8}
.jChrono{display:inline-block;margin-left:8px;font-size:12.5px;font-weight:900;color:#fff;background:var(--j-bleu);border-radius:10px;padding:3px 8px;vertical-align:2px}
.jIndice{margin-top:10px}
.jRacc{display:flex;gap:10px;padding:9px 0;border-bottom:2px solid var(--j-gris)}
.jRacc b{flex:none;min-width:96px;color:var(--j-orange);font-weight:900}

/* Nova, dans le volet de l'assistant */
.iaBarre{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0 4px}
.iaMod{border:2px solid var(--j-gris);border-bottom-width:3px;border-radius:11px;padding:4px 9px;font:inherit;font-size:12px;font-weight:900;
  background:var(--surface);color:var(--j-texte);cursor:pointer;line-height:1.2}
.iaMod span{display:block;font-size:9.5px;font-weight:700;opacity:.75}
.iaMod.on{background:var(--j-violet);border-color:var(--j-violetf);color:#fff}
.iaNote{font-size:11px;color:var(--anthr);flex-basis:100%}
.iaRep{line-height:1.55}
.iaPuce{display:block;position:relative;padding-left:16px;margin:3px 0}
.iaPuce:before{content:"";position:absolute;left:3px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--j-violet)}
.iaNum{display:block;margin:3px 0}
.iaNum b{display:inline-block;min-width:20px;color:var(--j-violetf)}
.iaPied{font-size:10.5px;color:var(--anthr);margin-top:6px;font-weight:700}
.iaCurseur{display:inline-block;width:8px;height:14px;background:var(--j-violet);border-radius:2px;margin-left:2px;vertical-align:-2px;animation:jCli .8s steps(2) infinite}
@keyframes jCli{50%{opacity:0}}

@media (min-width:980px){
  .nav button.cache{display:flex!important}
  .nav .jTout{display:none}
  .head h1{padding-right:0}
  .jXp{right:64px;top:18px}
  .jSom{top:0;padding:14px 26px 8px}
  .jHub .g{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion: reduce){
  .tab.jEntre,.tab.jEntre .wrap > .card,.jNovaSvg,.jNoeud.auj,.nav button.act .ic,.jHub .p,.jLec.on{animation:none!important}
}

/* Les illustrations 3D (Fluent Emoji de Microsoft, licence MIT) */
.jFl{display:inline-block;object-fit:contain;vertical-align:middle}
.nav button .ic .jNavIc{width:26px;height:26px;display:block;margin:0 auto 2px}
.card h2 .jH2i{width:22px;height:22px;vertical-align:-6px;margin-right:7px}
.card{position:relative}
.hero .jHeroIc{position:absolute;right:14px;top:12px;width:66px;height:66px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
  animation:jFlotteNova 4s ease-in-out infinite;pointer-events:none}
.hero h2 .jH2i{display:none}
.hero > h2,.hero > .big{padding-right:76px}
.jTuile .e .jFl{width:44px;height:44px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.jNoeud .e .jFl{width:32px;height:32px}
.jLigne .e .jFl{width:30px;height:30px}
.jSortie .im .jFl{width:46px;height:46px}
.jXp .jFl{width:16px;height:16px;vertical-align:-3px}
.asFab .jFl{width:40px;height:40px}
.jNovaWow{animation:jSaute 1.1s ease-in-out infinite!important}
@keyframes jSaute{0%,100%{transform:none}30%{transform:translateY(-8px) rotate(-8deg)}60%{transform:rotate(6deg)}}

/* L'accueil en un coup d'œil : les anneaux du jour, façon Apple Forme */
.jAnx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px}
.jAnB{border:0;background:none;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--j-texte);padding:0}
.jAnB:active{transform:scale(.95)}
.jAnR{position:relative;width:62px;height:62px}
.jAnR svg{display:block}
.jAnR svg circle:last-child{transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1)}
.jAnR .jAnI{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px}
.jAnB b{font-size:12px;font-weight:900}
.jAnB > span:last-child{font-size:10.5px;color:var(--anthr);font-weight:700}
.jMaint{display:flex;gap:12px;align-items:center;background:var(--surface2);border-radius:16px;padding:10px 12px}
.jMaint b{font-size:15px;line-height:1.3}
@media (min-width:980px){ .nav button .ic .jNavIc{width:22px;height:22px;margin:0} }
@media (prefers-reduced-motion: reduce){ .hero .jHeroIc,.jNovaWow{animation:none!important} }

#t-mots .sousnav [data-va="mots"]{background:var(--accent);color:var(--surBadge);border-color:var(--accent)}

/* ================= v130 : L'ONGLET ARGENT ================= */
.aVues{display:flex;gap:7px;padding:2px 0 12px;grid-column:1 / -1}
.aVues button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:900;font-size:13px;
  border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:14px;padding:9px 6px;background:var(--surface);color:var(--j-texte);cursor:pointer}
.aVues button.on{background:#2F9E44;border-color:#23803A;color:#fff}
.aHero .big.neg{color:#FFD4D4}
.aDispo{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:12px;padding:7px 11px;margin:2px 0 8px;font-weight:800;font-size:13.5px;color:#fff}
.aDispo b{font-size:16px}
.aLogo{display:inline-flex;flex:none;align-items:center;justify-content:center;border-radius:12px;background:#fff;box-shadow:0 0 0 2px var(--j-gris);overflow:hidden;font-size:20px}
.aLogo img{width:72%;height:72%;object-fit:contain}
.aLogoE{background:var(--surface2);box-shadow:none}
.neg{color:var(--j-rouge)} .pos{color:#2F9E44}
body.dark .pos{color:#7EE08F}
.aBarreMois{height:22px;border-radius:12px;background:#58CC02;overflow:hidden;margin:4px 0 8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.aBarreMois i{display:block;height:100%;background:#FF9600;border-radius:12px 0 0 12px}
.aLegende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:800;color:var(--anthr);margin:4px 0 6px}
.aLegende span{display:inline-flex;align-items:center;gap:6px}
.aLegende b{width:12px;height:12px;border-radius:4px;display:inline-block}
.aChiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.aChiffres div{border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:14px;padding:10px 8px;text-align:center}
.aChiffres b{display:block;font-size:20px;font-weight:900;color:var(--j-texte)}
.aChiffres div:last-child b{color:var(--j-rouge)} .aChiffres div:first-child b{color:#2F9E44}
.aChiffres span{display:block;font-size:10.5px;color:var(--anthr);font-weight:700;line-height:1.3;margin-top:3px}
.aCourbe{width:100%;height:190px;display:block;background:var(--surface2);border-radius:14px}
.aSem{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--anthr);margin:12px 0 4px}
.aEv,.aRec,.aTx,.aCat,.aCompte,.aPea{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:2px solid var(--j-gris)}
.aEv:last-of-type,.aRec:last-of-type,.aTx:last-of-type{border-bottom:0}
.aEv .n,.aRec .n,.aTx .n,.aPea .n{flex:1;min-width:0}
.aEv b,.aRec b,.aTx b,.aPea b{display:block;font-size:13.5px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.aEv .n span,.aRec .n span,.aTx .n span,.aPea .n span{display:block;font-size:11.5px;color:var(--anthr);margin-top:2px;line-height:1.35}
.aEv .m,.aRec .m,.aTx .m,.aPea .m{font-weight:900;font-size:14px;white-space:nowrap;text-align:right}
.aPea .m i{display:block;font-style:normal;font-size:11px}
.aEv-paie{background:linear-gradient(90deg,rgba(88,204,2,.10),transparent);border-radius:12px}
.aEv-loyer{background:linear-gradient(90deg,rgba(255,150,0,.12),transparent);border-radius:12px}
.aEv-cadeau{background:linear-gradient(90deg,rgba(206,130,255,.15),transparent);border-radius:12px}
.aComptes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.aCompte{flex-direction:column;align-items:flex-start;gap:8px;border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:16px;padding:11px}
.aCompte b{font-size:13px;font-weight:900}
.aCompte span{display:block;font-size:19px;font-weight:900;margin-top:2px}
.aCompte i{display:block;font-style:normal;font-size:10.5px;color:var(--anthr);line-height:1.35;margin-top:3px}
.aRec.coupe .n b,.aRec.coupe .m{text-decoration:line-through;opacity:.5}
.aCiseau{flex:none;width:34px;height:34px;border-radius:11px;border:2px solid var(--j-gris);border-bottom-width:3px;background:var(--surface);cursor:pointer;font-size:15px;filter:grayscale(1);opacity:.6}
.aCiseau.on{background:#FFDFE0;border-color:var(--j-rouge);filter:none;opacity:1}
.aCiseau.vide{border:0;background:none;cursor:default}
.aGain{display:flex;align-items:center;gap:10px;margin-top:10px;background:#D7FFB8;color:#2E6B00;border-radius:14px;padding:10px 12px;font-weight:700;font-size:13.5px}
body.dark .aGain{background:#1F3A12;color:#9BE564}
.aCats{margin-top:8px}
.aCat{cursor:pointer}
.aCat .n{flex:1}
.aCat .t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.aCat .t span{font-weight:900}
.aCat .b{height:10px;background:var(--j-gris);border-radius:6px;overflow:hidden;margin-top:5px}
.aCat .b i{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.aTx.int{opacity:.55}
.aBq{width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-left:6px}
.aFlux{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.aFl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.aFl .fl{position:relative;text-align:center;font-weight:900;font-size:13.5px;padding:4px 0;border-bottom:3px dashed var(--j-bleu)}
.aFl .fl:after{content:"";position:absolute;right:-2px;bottom:-7px;border:6px solid transparent;border-left-color:var(--j-bleu)}
.aFl i{grid-column:1 / -1;font-style:normal;font-size:11px;color:var(--anthr);margin-top:-4px}
.aCons{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:2px solid var(--j-gris)}
.aCons:last-of-type{border-bottom:0}
.aCons .n{flex:1;min-width:0}
.aCons b{display:block;font-size:14px;font-weight:900;line-height:1.3}
.aCons p{font-size:12.5px;color:var(--anthr);line-height:1.5;margin:4px 0 6px}
.aCons .pill{font-size:11.5px;padding:5px 10px}
.aBadge{flex:none;background:#D7FFB8;color:#2E6B00;border-radius:12px;padding:6px 8px;font-weight:900;font-size:13px;text-align:center;line-height:1.1}
.aBadge i{display:block;font-style:normal;font-size:9.5px;font-weight:800;opacity:.8}
body.dark .aBadge{background:#1F3A12;color:#9BE564}
.aSemaines{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}
.aSemaines button{flex:none;min-width:70px;border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:8px 6px;font:inherit;cursor:pointer;color:var(--j-texte)}
.aSemaines button b{display:block;font-size:15px;font-weight:900}
.aSemaines button span{display:block;font-size:10px;color:var(--anthr);font-weight:700}
.aSemaines button.on{background:#CE82FF;border-color:#A568CC;color:#fff}
.aSemaines button.on span{color:#fff}
.aCinq{margin-top:12px}
.aCinq .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.aCinq .t span{color:var(--anthr);font-weight:700;font-size:12px}
.aEtape{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:2px solid var(--j-gris)}
.aEtape .r{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:#AFAFAF;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.aEtape.ok .r{background:var(--j-vert)}
.aEtape.ko .r{background:var(--j-orange)}
.aEtape b{font-size:14px;font-weight:900}
.aEtape p{font-size:12.5px;color:var(--anthr);margin-top:3px;line-height:1.45}
@media (min-width:980px){ .aVues{max-width:620px} .aComptes{grid-template-columns:repeat(4,1fr)} }

.aVues{display:grid;grid-template-columns:repeat(4,1fr)}
.aVues button{font-size:12px;padding:8px 4px;flex-direction:column;gap:2px}
.aTotaux{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 2px;font-size:12.5px;font-weight:700;color:var(--anthr)}
.aTotaux b{font-size:15px;font-weight:900}
.aCompte[data-abanque]{cursor:pointer}
.aCompte[data-abanque]:active{transform:translateY(2px)}

/* ================= v134 : le solde jour par jour ================= */
.aRegle{margin:4px 0 8px}
.aRegle label{display:block;font-size:13.5px;font-weight:700;margin-bottom:4px}
.aRegle input[type=range]{width:100%;accent-color:#7A5AF8;height:30px}
.aDateL{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 8px;font-weight:800;font-size:13.5px;flex-wrap:wrap}
.aDateL label{display:flex;align-items:center;gap:6px}
.aDateL input{font:inherit;font-weight:800;border:2px solid var(--j-gris);border-bottom-width:4px;border-radius:12px;padding:8px 10px;background:var(--surface);color:var(--j-texte)}
.aRes{border-radius:18px;padding:14px;margin:8px 0;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.aRes.ok{background:linear-gradient(135deg,#58CC02,#2F9E44)}
.aRes.dec{background:linear-gradient(135deg,#FFB020,#F08000)}
.aRes.ko{background:linear-gradient(135deg,#FF6B6B,#D32F2F)}
.aRes span{display:block;font-weight:800;font-size:13px;opacity:.95}
.aRes b{display:block;font-size:34px;font-weight:900;line-height:1.1;margin:4px 0}
.aRes i{display:block;font-style:normal;font-weight:700;font-size:12.5px;opacity:.95}
.aDecomp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.aDecomp span{border:2px solid var(--j-gris);border-radius:12px;padding:8px 4px;text-align:center;font-weight:900;font-size:13px}
.aDecomp i{display:block;font-style:normal;font-weight:700;font-size:10px;color:var(--anthr);margin-top:2px}
.aJourEv{margin-bottom:8px}
.aGrilles{display:grid;grid-template-columns:1fr;gap:16px;margin-top:12px}
.aGT{font-weight:900;font-size:14px;margin-bottom:6px;text-transform:capitalize}
.aGC{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.aGC em{font-style:normal;text-align:center;font-size:10.5px;font-weight:800;color:var(--anthr)}
.aGC span{min-height:46px}
.aGC .hors{display:flex;align-items:flex-start;justify-content:center;font-size:11px;color:#B8BEC2;padding-top:5px}
.aGC button{position:relative;min-height:48px;border:0;border-radius:10px;padding:3px 1px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s ease}
.aGC button:active{transform:scale(.94)}
.aGC button i{font-style:normal;font-size:10.5px;font-weight:800;opacity:.75}
.aGC button b{font-size:11px;font-weight:900;letter-spacing:-.3px}
.aGC button.ok{background:#E2F8D2;color:#2E6B00}
.aGC button.dec{background:#FFE9C7;color:#8A4B00}
.aGC button.ko{background:#FFD9D9;color:#B71C1C}
body.dark .aGC button.ok{background:#1F3A12;color:#9BE564}
body.dark .aGC button.dec{background:#3D2A0E;color:#FFC877}
body.dark .aGC button.ko{background:#3E1D1F;color:#FF9A9A}
.aGC button.ev:after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#1CB0F6}
.aGC button.sel{outline:3px solid #1CB0F6;outline-offset:1px}
@media (min-width:980px){ .aGrilles{grid-template-columns:1fr 1fr} }

.aCourbeW{position:relative;margin:4px 0 10px}
.aCourbe2{width:100%;height:auto;display:block;touch-action:pan-y}
.aCourbe2 .cg{stroke:var(--ligne);stroke-width:1}
.aCourbe2 .cg.zero{stroke:var(--anthr);stroke-opacity:.6}
.aCourbe2 .cy{font-size:10px;fill:var(--anthr);text-anchor:end;font-variant-numeric:tabular-nums;font-weight:700}
.aCourbe2 .cx{font-size:10px;fill:var(--anthr);text-anchor:middle;font-weight:700}
.aCourbe2 .cx.fin,.aCourbe2 .cnote.fin{text-anchor:end}
.aCourbe2 .cdec{stroke:#E53935;stroke-width:1;stroke-opacity:.7}
.aCourbe2 .cnote{font-size:9.5px;fill:var(--anthr);text-anchor:middle;font-weight:700}
.aCourbe2 .cnote.fort{fill:var(--j-texte);font-weight:900}
.aCourbe2 .cligne{fill:none;stroke:#7A5AF8;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.aCourbe2 .cvoile{fill:#7A5AF8;opacity:.10}
.aCourbe2 .cpaie{fill:#2F9E44;stroke:var(--surface);stroke-width:2}
.aCourbe2 .cloyer{fill:#F08000;stroke:var(--surface);stroke-width:2}
.aCourbe2 .cbas{fill:#E53935;stroke:var(--surface);stroke-width:2}
.aCourbe2 .csel{stroke:#1CB0F6;stroke-width:1.5}
.aCourbe2 .cselp{fill:#1CB0F6;stroke:var(--surface);stroke-width:2}
.aBulleC{position:absolute;top:0;min-width:150px;background:var(--j-texte);color:var(--surface);border-radius:10px;padding:6px 9px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s}
.aBulleC.on{opacity:.95}
.aBulleC span{display:block;font-size:11px;margin-top:3px;opacity:.85}

#aSimu .pill{font-family:'Nunito',system-ui,sans-serif}

<script id="chargeur">
/* Le chargeur, public. Sur GitHub le code de l'app est chiffre, voir .claude/chiffre_git.py.
   Ce script ne contient rien de personnel : un sel et un nombre d'iterations, publics par
   nature. Sur le PC de Steve la copie de travail est en clair, le bloc app a deja tourne
   et ce script ne fait rien. */
(function(){
  var C = window.__CHIFFRE;
  if (!C || !C.app) return;
  var SEL = "Ke3jHrZdU79puXzhQ47N9A==", ITER = 600000, CLE = "steve_cle";
  function de64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function en64(u){ var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function canon(p){ return String(p || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  async function derive(phrase){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(canon(phrase)), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({name: "PBKDF2", salt: de64(SEL), iterations: ITER, hash: "SHA-256"}, base, 256);
    return new Uint8Array(bits);
  }
  async function dechiffre(brut, bloc){
    var k = await crypto.subtle.importKey("raw", brut, "AES-GCM", false, ["decrypt"]);
    var clair = await crypto.subtle.decrypt({name: "AES-GCM", iv: de64(bloc.iv)}, k, de64(bloc.ct));
    return new TextDecoder().decode(clair);
  }
  /* On dechiffre TOUT avant de lancer quoi que ce soit : une moitie d'app ne sert a rien.
     signaux passe avant l'app, qui s'en sert. */
  async function toutDechiffrer(brut){
    var codes = [];
    if (C.signaux) codes.push(await dechiffre(brut, C.signaux));
    codes.push(await dechiffre(brut, C.app));
    return codes;
  }
  function lance(codes){
    codes.forEach(function(code){
      var s = document.createElement("script"); s.textContent = code; document.body.appendChild(s);
    });
  }
  function verrou(message){
    var v = document.getElementById("verrou");
    if (!v){
      v = document.createElement("div"); v.id = "verrou";
      v.innerHTML = '<div class="vc"><h1>Ton app est verrouillée</h1>' +
        '<p>Ce qui te concerne est chiffré sur internet. Tape ta phrase de passe, une seule fois sur cet appareil.</p>' +
        '<form><input id="vPhrase" type="text" enterkeyhint="go" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx" aria-label="Phrase de passe">' +
        '<button type="submit">Ouvrir</button></form><p id="vMsg" class="vm"></p></div>';
      document.body.appendChild(v);
      /* Entree envoie, meme quand le navigateur ne le fait pas de lui-meme : vu le 22/09
         en test, la touche seule ne declenchait pas l envoi du formulaire. */
      v.querySelector("#vPhrase").addEventListener("keydown", function(e){
        if (e.key !== "Enter") return;
        e.preventDefault();
        var f = v.querySelector("form");
        if (f.requestSubmit) f.requestSubmit(); else v.querySelector("button").click();
      });
      v.querySelector("form").addEventListener("submit", async function(e){
        e.preventDefault();
        var msg = v.querySelector("#vMsg"), bt = v.querySelector("button");
        bt.disabled = true; msg.textContent = "Un instant.";
        try {
          var brut = await derive(v.querySelector("#vPhrase").value);
          var codes = await toutDechiffrer(brut);
          try { localStorage.setItem(CLE, en64(brut)); } catch (err) {}
          v.remove();
          lance(codes);
        } catch (err) {
          bt.disabled = false;
          msg.textContent = "Ce n'est pas la bonne phrase. Vérifie les lettres et les chiffres.";
        }
      });
    }
    v.querySelector("#vMsg").textContent = message || "";
    setTimeout(function(){ var i = document.getElementById("vPhrase"); if (i) i.focus(); }, 50);
  }
  if (!window.crypto || !crypto.subtle){
    verrou("Ce navigateur ne sait pas déchiffrer la page. Ouvre-la en https, dans Chrome ou Safari.");
    return;
  }
  var stockee = null;
  try { stockee = localStorage.getItem(CLE); } catch (err) {}
  if (!stockee){ verrou(); return; }
  toutDechiffrer(de64(stockee)).then(lance).catch(function(){
    try { localStorage.removeItem(CLE); } catch (err) {}
    verrou("Ta phrase de passe a changé. Tape la nouvelle.");
  });
})();
</script>
