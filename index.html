/* Toujours SANS modele de langage. Il repond et il AGIT a partir de l'etat de l'app.
   Un bouton en bas a gauche, present sur les sept onglets. Ajoute le 13/09/2026. */

let asLog = [], asMode = "";

function asOngletActif(){
  const b = document.querySelector(".nav button.act");
  return b ? b.dataset.tab : "jour";
}
function asVa(tab){
  const b = document.querySelector('.nav button[data-tab="' + tab + '"]');
  if (b) b.click();
}
function asNb(n){
  const m = n.match(/(\d+(?:[.,]\d{1,2})?)/);
  return m ? parseFloat(m[1].replace(",", ".")) : null;
}

/* ---------------------------------------------------------------- LES ACTIONS */
/* Chacune rend null si elle ne s'applique pas. L'ordre compte : les plus specifiques
   d'abord, sinon « j'ai bu un verre » finirait dans le budget. */
const AS_ACTIONS = [
/* --- annuler la derniere action, par remise de l'etat photographie --- */
function(n, q){
  if (!/^(annule|annuler|undo|oublie ca|retire ca|non pas ca|c est faux)/.test(n)) return null;
  if (!asUndo.length) return '<b>Il n\'y a rien à annuler.</b>';
  const u = asUndo.pop();
  asRestaure(u.etat);
  asDit("Annulé.");
  return '<div class="asOk"><b>Annulé.</b><br>« ' + bEsc(u.q) + ' » n\'a plus d\'effet.</div>';
},

/* --- le mode cuisine, mains libres --- */
function(n, q){
  if (asCuis) {
    if (/^(suivant|ensuite|apres|la suite|next|etape suivante)/.test(n)) return asCuisPas(1);
    if (/^(precedent|avant|retour|etape d avant)/.test(n)) return asCuisPas(-1);
    if (/^(repete|redis|encore|relis)/.test(n)) return asCuisPas(0);
    if (/^(stop|fini|termine|arrete|c est bon)/.test(n)) {
      asCuis = null; asDit("Mode cuisine arrêté.");
      return '<div class="asOk">Mode cuisine arrêté.</div>';
    }
  }
  if (!/^(on cuisine|cuisine|mode cuisine|guide moi|aide moi a cuisiner|je cuisine)/.test(n)) return null;
  let d = auj(), r = dinerDu(d);
  const p = bPlat(n); if (p) { d = p.d; r = p.x; }
  if (!r) return '<b>Il n\'y a pas de plat prévu aujourd\'hui.</b><br>Dis « cuisine le curry » pour un autre soir.';
  asCuis = {d: d, i: 0};
  return '<div class="asOk"><b>Mode cuisine, ' + bEsc(r.nm) + '.</b><br>' + bEsc(r.ing) + '</div>' + asCuisEtape(r, 0);
},

/* --- le minuteur --- */
function(n, q){
  if (/^(stop minuteur|arrete le minuteur|annule le minuteur)/.test(n)) {
    if (!asTimer) return '<b>Aucun minuteur en cours.</b>';
    clearTimeout(asTimer.id); clearInterval(asTimer.tic); asTimer = null;
    return '<div class="asOk">Minuteur arrêté.</div>';
  }
  if (!/minuteur|minute|compte a rebours|previens moi dans|reveille moi dans/.test(n)) return null;
  const v = asNb(n);
  if (v === null || v <= 0 || v > 180) return '<b>Combien de minutes ?</b><br>Dis « minuteur 11 minutes ».';
  const quoi = asCuis ? (dinerDu(asCuis.d) ? dinerDu(asCuis.d).nm : "") : "";
  asMinuteur(v, quoi);
  asDit("Minuteur de " + v + " minutes lancé.");
  return '<div class="asOk"><b>Minuteur de ' + v + ' minutes.</b><br>Je te préviens, avec une vibration et la voix. Tu peux fermer le panneau, il continue.</div>';
},

/* --- lire la liste de courses --- */
function(n, q){

  if (!/liste|reste a prendre|reste quoi/.test(n)) return null;

},

/* --- ajouter une ligne de courses --- */
function(n, q){

},

/* --- enlever une ligne ajoutee --- */
function(n, q){
  const m = q.match(/^\s*(?:enleve|retire|supprime)\s+(.+?)\s*(?:de)?\s*(?:ma|la)?\s*liste\s*$/i);
  if (!m) return null;
  const c = bNorm(m[1]);

/* --- ajouter un rendez-vous --- */
function(n, q){
  const m = q.match(/^\s*(?:rendez[- ]vous|rdv|note un rendez[- ]vous)\s+(.+)/i);
  if (!m) return null;
  const reste = m[1];
  const d = asDate(bNorm(reste)), h = asHeure(bNorm(reste));
  if (!d) return '<b>Je n\'ai pas compris la date.</b><br>Dis « rendez-vous dentiste mardi à 14h », ou « rendez-vous dentiste le 25/09 à 14h ».';
  let titre = reste.replace(/\b(le|a|à|du)\b/gi, " ")
    .replace(/\d{1,2}\s*[\/.]\s*\d{1,2}/g, " ")
    .replace(/\d{1,2}\s*(?:h|heures?)\s*\d{0,2}/gi, " ")
    .replace(new RegExp("\\b(" + BJOURS.join("|") + "|demain|apres[- ]demain|" + AS_MOIS.join("|") + ")\\b", "gi"), " ")
    .replace(/\s+/g, " ").trim();
  if (!titre) titre = "Rendez-vous";
  titre = titre.charAt(0).toUpperCase() + titre.slice(1);
  S.rdv.push({d: d, h: h || "09:00", dur: 60, t: titre, note: ""});
  save(); renderSemaine(); renderJour();
  asDit(titre + " noté le " + libelleLong(d) + " à " + (h || "09:00").replace(":", " heures "));
  return '<div class="asOk"><b>' + bEsc(titre) + '</b><br>' + bEsc(libelleLong(d)) + ', ' + (h || "09:00").replace(":", "h") +
    (h ? '' : '<br>Pas d\'heure comprise, j\'ai mis 9h. Corrige dans l\'onglet Semaine.') + '</div>';
},

/* --- budget : une depense ou une rentree --- */
function(n, q){
  if (!/depens|j ai paye|j ai achet|ca m a coute|j ai recu|j ai gagne|encaiss|rembours/.test(n)) return null;
  const v = asNb(n);
  if (v === null || v <= 0) return '<b>Il me manque le montant.</b><br>Écris par exemple « j\'ai dépensé 12,50 en courses ».';
  const entree = /recu|gagne|encaiss|rembours|salaire/.test(n);
  const cats = entree ? CAT_IN : CAT_OUT;
  let cat = "Autre";
  cats.forEach(c => { if (n.indexOf(bNorm(c)) >= 0) cat = c; });
  if (cat === "Autre" && !entree) {
    if (/course|lidl|super|march/.test(n)) cat = "Courses";
    else if (/resto|restau|midi dehors|kebab|burger/.test(n)) cat = "Restaurant";
    else if (/metro|navigo|train|essence|uber|bus/.test(n)) cat = "Transport";
    else if (/loyer|edf|electric|internet|charges/.test(n)) cat = "Logement";
    else if (/pharma|medecin|dentiste|mutuelle/.test(n)) cat = "Santé";
    else if (/salle|proteine|sport/.test(n)) cat = "Sport";
    else if (/abonnement|spotify|netflix|forfait/.test(n)) cat = "Abonnements";
  }
  S.budget.mvts.push({d: auj(), type: entree ? "in" : "out", montant: v, cat: cat, lib: ""});
  save(); renderEuro(); renderJour();
  return '<div class="asOk"><b>C\'est noté.</b> ' + (entree ? "Entrée" : "Sortie") + ' de ' +
    fmtEur(v) + ' en ' + cat + ', datée d\'aujourd\'hui.</div>' + asSolde();
},

/* --- sport : la seance est faite --- */
function(n, q){
  if (!/(seance|salle|muscu|entrain).*(fait|fini|termin)|j ai fait ma seance|j ai ete a la salle|c est fait/.test(n)) return null;
  const t = auj();
  S.track[t] = S.track[t] || {seance: false, eau: 0, note: ""};
  if (S.track[t].seance) return '<div class="asOk">Ta séance d\'aujourd\'hui était déjà cochée.</div>';
  S.track[t].seance = true;
  if (typeof finPointe === "function") { /* la serie finance a son propre compteur */ }
  save(); renderJour(); renderSport();
  return '<div class="asOk"><b>Séance cochée.</b> ' + seanceDu(t) + ', ' + libelle(t) + '.</div>' + asSport();
},

/* --- suivi : un verre d'eau --- */
function(n, q){
  if (!/j ai bu|verre d eau|un verre|\+ ?1 eau|de l eau/.test(n)) return null;
  const t = auj();
  S.track[t] = S.track[t] || {seance: false, eau: 0, note: ""};
  const v = asNb(n);
  S.track[t].eau = Math.min(8, S.track[t].eau + (v && v <= 8 ? v : 1));
  save(); renderJour();
  return '<div class="asOk"><b>' + S.track[t].eau + ' verres sur 8</b> aujourd\'hui.' +
    (S.track[t].eau >= 8 ? ' Objectif atteint.' : ' Il t\'en reste ' + (8 - S.track[t].eau) + '.') + '</div>';
},

/* --- suivi : la note du jour --- */
function(n, q){
  const m = q.match(/^\s*note\s*:?\s*(.+)/i);
  if (!m) return null;
  const t = auj();
  S.track[t] = S.track[t] || {seance: false, eau: 0, note: ""};
  S.track[t].note = m[1].trim();
  save(); renderJour();
  return '<div class="asOk"><b>Note du jour enregistrée.</b><br>' + bEsc(m[1].trim()) + '</div>';
},

/* --- skills : poser un niveau --- */
function(n, q){
  if (typeof SKILLS === "undefined") return null;
  const m = n.match(/(?:je suis a|niveau|je mets|je me mets)\s*(\d)\s*(?:\/ ?5)?\s*(?:en|sur|pour|a)?\s*(.*)/);
  if (!m) return null;
  const niv = parseInt(m[1], 10);
  if (niv < 0 || niv > 5) return '<b>Le niveau va de 0 à 5.</b>';
  const cible = (m[2] || "").trim();
  if (!cible) return '<b>Quelle compétence ?</b><br>Écris par exemple « je suis à 3 en Power BI ».';
  let trouve = null;
  SKILLS.forEach(s => { if (!trouve && bNorm(s.nm).indexOf(cible) >= 0) trouve = s.nm; });
  if (!trouve) return '<b>Je ne trouve pas cette compétence.</b><br>Elles sont dans l\'onglet Skills.';
  const cur = S.skills[trouve] || {n: 0, note: ""};
  const av = cur.n;
  cur.n = niv; S.skills[trouve] = cur; save(); renderSkills();
  return '<div class="asOk"><b>' + bEsc(trouve) + ' : ' + niv + ' sur 5.</b>' +
    (av !== niv ? ' Tu étais à ' + av + '.' : '') + '</div>';
},

/* --- bouffe : cocher une ligne de courses --- */
function(n, q){
  if (!/j ai pris|coche|dans le panier|je l ai/.test(n)) return null;
  const C = PERIODE.courses;
  let idx = -1;
  C.lignes.forEach((l, i) => {
    const c = bNorm(l.n);
    if (idx < 0 && c.length > 2 && (n.indexOf(c) >= 0 || c.split(" ").some(w => w.length > 4 && n.indexOf(w) >= 0))) idx = i;
  });
  if (idx < 0) return '<b>Je ne vois pas quelle ligne.</b><br>Dis « j\'ai pris le poulet », avec le nom tel qu\'il est dans la liste.';
  const k = cleShop(idx);
  if (S.shop[k]) return '<div class="asOk">« ' + bEsc(C.lignes[idx].n) + ' » était déjà coché.</div>' + bBlocCourses();
  S.shop[k] = true; save(); renderBouffe();
  return '<div class="asOk"><b>« ' + bEsc(C.lignes[idx].n) + ' » coché.</b></div>' + bBlocCourses();
},

/* --- bouffe : intervertir deux soirs --- */
function(n, q){
  if (!/interverti|inverse|echange.*soir|permute/.test(n)) return null;
  const js = joursPeriode().filter(d => dinerDu(d));
  const vus = js.filter(d => n.indexOf(bNorm(BJOURS[parse(d).getDay()])) >= 0);
  if (vus.length !== 2) {
    let h = '<b>Quels deux soirs ?</b><br>Dis par exemple « inverse lundi et mercredi ». Tes soirs :';
    js.forEach(d => { h += '<div class="row"><div class="lab"><b>' + bEsc(libelle(d)) + '</b><br><span style="font-size:12.5px">' + bEsc(dinerDu(d).nm) + '</span></div></div>'; });
    return h;
  }
  const a = vus[0], b = vus[1], p = S.bouffe.perm, ra = p[a] || a, rb = p[b] || b;
  p[a] = rb; p[b] = ra;
  Object.keys(p).forEach(k => { if (p[k] === k) delete p[k]; });
  save(); renderBouffe(); renderJour(); renderSemaine();
  return '<div class="asOk"><b>Interverti.</b><br>' + bEsc(libelle(a)) + ' : ' + bEsc(dinerDu(a).nm) +
    '<br>' + bEsc(libelle(b)) + ' : ' + bEsc(dinerDu(b).nm) +
    '<br>Le calendrier et le fichier d\'agenda suivent.</div>';
},

/* --- finance : lancer un entrainement --- */
function(n, q){
  if (!/entraine|entrainement|exercice|calcul mental|fais moi reviser|interroge moi|quiz/.test(n)) return null;
  asFerme();
  asVa("fin");
  if (/calcul/.test(n)) { if (typeof finGo === "function") finGo("calcul"); return ""; }
  if (/fiche|quiz/.test(n)) { if (typeof finGo === "function") finGo("fiches"); return ""; }
  if (typeof exoGo === "function") exoGo("");
  return "";
},

/* --- navigation --- */
function(n, q){
  if (!/^(va|ouvre|montre|affiche|passe|amene)/.test(n)) return null;
  const T = {jour: /aujourd|jour|accueil/, semaine: /semaine|agenda|rendez/, sport: /sport|salle|muscu/,
             skills: /skill|competence|progres/, euro: /budget|argent|euro|compte/,
             bouffe: /bouffe|repas|manger|cuisine|course/, fin: /finance|revis|entrain/};
  let cible = null;
  Object.keys(T).forEach(k => { if (!cible && T[k].test(n)) cible = k; });

},

/* --- affichage --- */
function(n, q){

];

/* ---------------------------------------------------------------- LES RESUMES */
function asSolde(){
  if (!S.budget || S.budget.soldeDebut === null || S.budget.soldeDebut === undefined)
    return '<div class="note">Ton budget n\'est pas encore démarré, va dans l\'onglet Budget.</div>';
  const m = S.budget.mvts || [];
  const ent = m.filter(x => x.type === "in").reduce((a, x) => a + x.montant, 0);
  const sor = m.filter(x => x.type === "out").reduce((a, x) => a + x.montant, 0);
  const s = S.budget.soldeDebut + ent - sor;
  let h = '<div class="row"><div class="lab"><b>Solde aujourd\'hui</b></div><div style="font-weight:800;font-size:15px">' + fmtEur(s) + '</div></div>';
  h += '<div class="row"><div class="lab">Entré ce mois</div><div style="font-weight:700">' + fmtEur(ent) + '</div></div>';
  h += '<div class="row"><div class="lab">Sorti ce mois</div><div style="font-weight:700">' + fmtEur(sor) + '</div></div>';
  const prev = (S.budget.prev || []);
  if (prev.length) {
    const ar = prev.filter(x => x.type === "in").reduce((a, x) => a + x.montant, 0);
    const ap = prev.filter(x => x.type === "out").reduce((a, x) => a + x.montant, 0);
    h += '<div class="row"><div class="lab"><b>Fin de mois estimée</b><br><span style="font-size:12px">' +
      fmtEur(ar) + ' à recevoir, ' + fmtEur(ap) + ' à payer</span></div><div style="font-weight:800">' +
      fmtEur(s + ar - ap) + '</div></div>';
  }
  const top = {};
  m.filter(x => x.type === "out").forEach(x => { top[x.cat] = (top[x.cat] || 0) + x.montant; });
  const cl = Object.keys(top).sort((a, b) => top[b] - top[a]).slice(0, 3);
  if (cl.length) h += '<div class="note" style="margin-top:8px"><b>Où part l\'argent :</b> ' +
    cl.map(c => c + " " + fmtEur(top[c])).join(", ") + '.</div>';
  return h;
}

function asSport(){
  const t = auj(), st = S.track[t] || {};
  let h = '<div class="ing"><b>Aujourd\'hui : ' + seanceDu(t) + '</b>' +
    (seanceDu(t) === "REPOS" ? ", repos." : ", " + creneauSport(t) + ".") + '</div>';
  if (seanceDu(t) !== "REPOS") h += '<div class="note" style="margin-top:6px">' +
    (st.seance ? "Elle est cochée comme faite." : "Pas encore cochée. Dis-moi « séance faite » quand c'est fait.") + '</div>';
  h += bTitre("Les sept prochains jours");
  for (let i = 0; i < 7; i++) {
    const d = plusJours(t, i), s = seanceDu(d);
    h += '<div class="row"><div class="lab">' + (i === 0 ? "Aujourd'hui" : bEsc(libelle(d))) + '</div>' +
      '<span class="pill' + (s === "REPOS" ? '' : ' on') + '">' + (s === "REPOS" ? "repos" : s) + '</span></div>';
  }
  return h;
}

function asRdv(){
  const p = prochainsRdv(5);
  if (!p.length) return '<div class="note">Rien de prévu.</div>';
  let h = "";
  p.forEach(r => {
    const j = joursEntre(auj(), r.d);
    h += '<div class="row"><div class="lab"><b>' + bEsc(r.t) + '</b><br><span style="font-size:12.5px">' +
      bEsc(libelleLong(r.d)) + ", " + r.h.replace(":", "h") +
      (j === 0 ? ", aujourd'hui" : j === 1 ? ", demain" : ", dans " + j + " jours") + '</span></div></div>';
    if (r.note) h += '<div class="note" style="margin:-2px 0 8px">' + bEsc(r.note) + '</div>';
  });
  return h;
}

function asFiche(n){
  if (typeof FI === "undefined" || !FI.length) return null;
  const mots = n.split(" ").filter(w => w.length > 3);
  if (!mots.length) return null;
  let best = null, score = 0;
  FI.forEach(f => {
    const t = bNorm(f.q + " " + f.r);
    let s = 0;
    mots.forEach(w => { if (t.indexOf(w) >= 0) s++; });
    if (s > score) { score = s; best = f; }
  });
  if (!best || score < Math.min(2, mots.length)) return null;
  return '<div class="ing"><b>' + bEsc(best.q) + '</b></div>' +
    '<div style="margin-top:7px">' + bEsc(best.r) + '</div>' +
    (best.x ? '<div class="ftip" style="margin-top:9px">' + bEsc(best.x) + '</div>' : '') +
    '<div class="note" style="margin-top:9px">Une fiche parmi ' + FI.length + ', onglet Finance.</div>';
}

function asActu(){
  if (typeof AJ === "undefined" || !AJ.length) return '<div class="note">Pas encore d\'actualité chargée.</div>';
  const j = AJ[0];
  let h = '<div class="ing"><b>' + bEsc(finDate(j.d)) + '</b>, ' + j.items.length + ' points.</div>';
  j.items.forEach(it => {
    h += '<div class="row"><div class="lab"><span class="note" style="text-transform:uppercase;font-size:10px">' +
      bEsc((typeof ZONES !== "undefined" && ZONES[it.z]) || "France") + '</span><br><b>' + bEsc(it.t) + '</b>' +
      '<br><span style="font-size:12.5px">' + bEsc(it.e) + '</span></div></div>';
  });
  return h;
}

  else if (rep && rep.soir) h += '<div class="row"><div class="lab"><b>Ce soir</b></div><div style="text-align:right;font-size:13px">' + bEsc(rep.soir) + '</div></div>';
  if (rep && rep.midi) h += '<div class="row"><div class="lab"><b>Ce midi</b></div><div style="text-align:right;font-size:13px">' + bEsc(rep.midi) + '</div></div>';
  const p = prochainsRdv(1);
  if (p.length) {

      bEsc(p[0].t) + '<br>' + (j === 0 ? "aujourd'hui" : j === 1 ? "demain" : "dans " + j + " jours") + '</div></div>';
  }
  if (S.budget && S.budget.soldeDebut !== null && S.budget.soldeDebut !== undefined) {
    const m = S.budget.mvts || [];
    const so = S.budget.soldeDebut + m.filter(x => x.type === "in").reduce((a, x) => a + x.montant, 0) -
      m.filter(x => x.type === "out").reduce((a, x) => a + x.montant, 0);
    h += '<div class="row"><div class="lab"><b>Solde</b></div><div style="text-align:right;font-weight:700">' + fmtEur(so) + '</div></div>';
  }
  const C = PERIODE.courses;
  const pris = C.lignes.filter((l, i) => S.shop[cleShop(i)]).length;

  return h;
}

/* ---------------------------------------------------------------- LE ROUTEUR */
/* Ce qui fait avancer une conversation sans taper. C'est le detail qui manque le plus aux
   assistants maison : on repond, et l'utilisateur ne sait pas quoi demander ensuite. */
let asSuites = [];
function asSuite(){ asSuites = Array.prototype.slice.call(arguments); }

function asRepond(q){
  const n = bNorm(q);
  if (!n) return "";
  asVocal = ""; asSuites = [];

  /* 1. les actions, les plus specifiques d'abord. On photographie l'etat AVANT pour
     pouvoir tout annuler d'un mot, meme si la dictee a mal entendu un montant. */
  const avant = JSON.stringify(S);
  for (let i = 0; i < AS_ACTIONS.length; i++) {
    const r = AS_ACTIONS[i](n, q);
    if (r !== null && r !== undefined) {
      if (JSON.stringify(S) !== avant) {
        asUndo.push({q: q, etat: avant});
        if (asUndo.length > 12) asUndo.shift();
      }
      return r;
    }
  }

  /* 2. les consultations */
  if (/^(aide|help|\?+)$|que sais tu|tu sers a quoi|comment ca marche/.test(n)) return asAide();
  if (/ou j en suis|point du jour|resume|ma journee|quoi de neuf|bonjour|salut/.test(n)) { asSuite("lis ma liste", "mes rendez-vous", "mon solde"); return asPoint(); }
  if (/solde|budget|argent|combien il me reste|fin de mois|depense/.test(n)) { asSuite("j'ai dépensé 12,50 en courses", "va dans budget"); return asSolde(); }
  if (/rendez|rdv|agenda|prochain/.test(n)) { asSuite("rendez-vous dentiste mardi à 14h", "où j'en suis"); return asRdv(); }
  if (/seance|sport|salle|muscu|cycle|pull|push|legs/.test(n)) { asSuite("séance faite", "j'ai bu un verre"); return asSport(); }
  if (/actu|actualite|bce|fed|bceao|beac|nigeria|marche|taux/.test(n)) { asSuite("entraîne-moi", "calcul mental"); return asActu(); }
  if (/combien|prix|total|cout|panier/.test(n)) { asSuite("lis ma liste", "j'ai pris le poulet"); return bBlocCourses(); }

  const j = bJour(n); if (j) { asSuite("cuisine", "combien ça coûte"); return bBlocJour(j); }
  const p = bPlat(n); if (p) { asSuite("cuisine", "minuteur 11 minutes"); return bBlocRecette(p.d, p.x); }
  const i = bIngredient(n); if (i) { asSuite("la recette de ce soir", "lis ma liste"); return bBlocIngredient(i); }

  if (typeof SKILLS !== "undefined") {
    let sk = null;
    SKILLS.forEach(s => { if (!sk && bNorm(s.nm).length > 2 && n.indexOf(bNorm(s.nm)) >= 0) sk = s; });
    if (sk) {
      const cur = S.skills[sk.nm] || {n: 0, note: ""};
      return '<div class="ing"><b>' + bEsc(sk.nm) + '</b>, niveau ' + cur.n + ' sur 5.</div>' +
        '<div class="note" style="margin-top:7px"><b>La cible :</b> ' + bEsc(sk.cible) + '</div>' +
        '<div style="margin-top:8px">' + bEsc(sk.faire) + '</div>' +
        '<div class="note" style="margin-top:9px">Pour changer le niveau, dis « je suis à 3 en ' + bEsc(sk.nm) + ' ».</div>';
    }
  }
  const f = asFiche(n); if (f) return f;
  const g = asCherchePartout(n); if (g) return g;

  return bBlocRien(q);
}

/* ================= LA VOIX, LA CUISINE, L'ANNULATION ================= */
/* Ajoute le 13/09/2026. La LECTURE a voix haute marche hors ligne, les voix sont dans le
   telephone. La DICTEE, elle, envoie l'audio a un serveur sur la plupart des navigateurs :
   elle ne marche donc PAS hors ligne, contrairement au reste de l'assistant. Le bouton du
   micro se cache quand le navigateur ne sait pas faire. */

if (typeof S.bouffe.voix !== "boolean") S.bouffe.voix = false;
let asVocal = "", asCuis = null, asTimer = null, asUndo = [], asEcoute = null;

/* ---------- lire a voix haute ---------- */
function asTexte(h){
  const d = document.createElement("div");
  d.innerHTML = h;
  return d.textContent.replace(/\s+/g, " ").trim();
}
function asParle(t, force){
  if (!force && !S.bouffe.voix) return;
  if (!("speechSynthesis" in window) || !t) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(t).slice(0, 600));
    u.lang = "fr-FR"; u.rate = 1.03; u.pitch = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function asDit(t){ asVocal = t; }

/* ---------- la dictee ---------- */
function asSR(){ return window.SpeechRecognition || window.webkitSpeechRecognition; }
function asMicro(){
  const SR = asSR();
  if (!SR) return;
  if (asEcoute) { try { asEcoute.stop(); } catch (e) {} asEcoute = null; asMajMicro(); return; }
  const r = new SR();
  r.lang = "fr-FR"; r.interimResults = false; r.maxAlternatives = 1; r.continuous = false;
  r.onresult = ev => {
    const t = ev.results[0][0].transcript;
    const i = el("asIn"); if (i) i.value = t;
    asEcoute = null; asMajMicro();
    asEnvoie(t);
  };
  r.onerror = ev => {
    asEcoute = null; asMajMicro();
    const quoi = ev.error === "not-allowed" ? "Le micro est refusé. Autorise-le dans les réglages du navigateur."
      : ev.error === "no-speech" ? "Je n'ai rien entendu."
      : ev.error === "network" ? "La dictée a besoin du réseau, et il ne répond pas. Tape ta question, ça marchera."
      : "La dictée a échoué (" + ev.error + ").";
    asLog.push({q: "🎤", r: '<b>' + quoi + '</b>'});
    asRendu();
  };
  r.onend = () => { if (asEcoute) { asEcoute = null; asMajMicro(); } };
  asEcoute = r;
  try { r.start(); asMajMicro(); } catch (e) { asEcoute = null; asMajMicro(); }
}
function asMajMicro(){
  const b = el("asMic"); if (!b) return;
  b.classList.toggle("ecoute", !!asEcoute);
  b.textContent = asEcoute ? "◉" : "🎤";
}

/* ---------- l'annulation, par photographie de l'etat ---------- */
/* Photographier l'etat avant chaque action et le remettre pour annuler est plus sur que
   dix fonctions d'annulation ecrites a la main, dont une finirait par etre fausse. */
function asRestaure(j){
  const o = JSON.parse(j);
  Object.keys(S).forEach(k => { delete S[k]; });
  Object.keys(o).forEach(k => { S[k] = o[k]; });
  save(); renderAll();
}

/* ---------- le minuteur ---------- */
function asMinuteur(min, quoi){
  if (asTimer) { clearTimeout(asTimer.id); clearInterval(asTimer.tic); }
  const fin = Date.now() + min * 60000;
  const id = setTimeout(() => {
    const t = quoi ? (quoi + ", c'est prêt.") : "Les " + min + " minutes sont passées.";
    notifier("Minuteur", t);
    asParle(t, true);
    asTimer = null;
    if (el("asPan").classList.contains("on")) asRendu();
  }, min * 60000);
  const tic = setInterval(() => {
    if (!asTimer) { clearInterval(tic); return; }
    if (el("asPan").classList.contains("on")) asMajMin();
  }, 1000);
  asTimer = {fin: fin, quoi: quoi, id: id, tic: tic, min: min};
  demanderNotif(function(){});
}
function asResteMin(){
  if (!asTimer) return "";
  const s = Math.max(0, Math.round((asTimer.fin - Date.now()) / 1000));
  return Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0");
}
function asMajMin(){
  const z = el("asMinZ"); if (!z || !asTimer) return;
  const v = z.querySelector("b"); if (v) v.textContent = asResteMin();
}
function asBlocMin(){
  if (!asTimer) return "";
  return '<div class="asMin" id="asMinZ"><span>' + bEsc(asTimer.quoi || "Minuteur") +
    '</span><b>' + asResteMin() + '</b>' +
    '<button class="asIco" id="asMinStop" style="width:34px;height:30px;font-size:14px">✕</button></div>';
}

/* ---------- un rendez-vous dicte ---------- */
const AS_MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function asDate(n){
  const t = auj();
  if (/demain/.test(n)) return plusJours(t, 1);
  if (/apres demain/.test(n)) return plusJours(t, 2);
  let m = n.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})/);
  if (m) {
    const d = new Date(parse(t).getFullYear(), +m[2] - 1, +m[1]);
    return iso(d < parse(t) ? new Date(parse(t).getFullYear() + 1, +m[2] - 1, +m[1]) : d);
  }
  m = n.match(/(\d{1,2})\s+([a-z]+)/);
  if (m) {
    const im = AS_MOIS.findIndex(x => bNorm(x).indexOf(m[2]) === 0);
    if (im >= 0) {
      const d = new Date(parse(t).getFullYear(), im, +m[1]);
      return iso(d < parse(t) ? new Date(parse(t).getFullYear() + 1, im, +m[1]) : d);
    }
  }
  for (let i = 1; i <= 7; i++) {
    const d = plusJours(t, i);
    if (n.indexOf(bNorm(BJOURS[parse(d).getDay()])) >= 0) return d;
  }
  return null;
}
function asHeure(n){
  const m = n.match(/(\d{1,2})\s*(?:h|heures?|:)\s*(\d{2})?/);
  if (!m) return null;
  const h = +m[1], mi = m[2] ? +m[2] : 0;
  if (h > 23 || mi > 59) return null;
  return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
}

/* ---------- la recherche etendue ---------- */
function asCherchePartout(n){
  const mots = n.split(" ").filter(w => w.length > 3);
  if (!mots.length) return null;
  function score(t){ let s = 0; const b = bNorm(t); mots.forEach(w => { if (b.indexOf(w) >= 0) s++; }); return s; }
  let best = null, sc = 0, type = "";
  if (typeof EXO !== "undefined") EXO.forEach(x => {
    const s = score(x.n + " " + x.e + " " + x.q);
    if (s > sc) { sc = s; best = x; type = "exo"; }
  });
  if (typeof MEMO !== "undefined") MEMO.forEach(x => {
    const s = score(x.n + " " + x.l.join(" "));
    if (s > sc) { sc = s; best = x; type = "memo"; }
  });
  if (!best || sc < Math.min(2, mots.length)) return null;
  if (type === "memo") {
    let h = '<div class="ing"><b>' + bEsc(best.n) + '</b>, mémo finance.</div>';
    best.l.forEach(x => { h += '<div style="margin-top:6px">' + bEsc(x) + '</div>'; });
    return h;
  }
  return '<div class="ing"><b>' + bEsc(best.n) + '</b>, exercice de finance.</div>' +
    '<div class="note" style="margin-top:7px">' + bEsc(best.e) + '</div>' +
    '<div style="margin-top:8px;font-weight:700">' + bEsc(best.q) + '</div>' +
    '<div class="ftip" style="margin-top:9px"><b>La réponse :</b> ' + bEsc(best.r) + " " + bEsc(best.u || "") + '</div>' +
    '<div class="note" style="margin-top:8px">Dis « entraîne-moi » pour la série complète.</div>';
}

/* ---------------------------------------------------------------- LE PANNEAU */
const AS_SUGG = {
  jour:    ["où j'en suis", "séance faite", "j'ai bu un verre", "mon solde"],
  semaine: ["mes rendez-vous", "où j'en suis", "le cycle"],
  sport:   ["séance faite", "le cycle", "où j'en suis"],
  skills:  ["Power BI", "où j'en suis", "va dans finance"],

  bouffe:  ["brocoli", "la recette de ce soir", "combien ça coûte", "j'ai pris le poulet"],
  fin:     ["l'actualité", "entraîne-moi", "calcul mental"]
};
function asPills(){

  return l.map(x => '<span class="pill" data-as="' + bEsc(x) + '">' + bEsc(x) + '</span>').join("") +
    '<span class="pill" data-as="aide">Ce que je sais faire</span>';
}
function asHeureCourte(ts){
  const d = new Date(ts || Date.now());
  return String(d.getHours()).padStart(2, "0") + "h" + String(d.getMinutes()).padStart(2, "0");
}
function asRendu(){
  const L = el("asLog");
  if (!L) return;
  if (!asLog.length) {
    L.innerHTML = '<div class="asEch"><div class="asDe">Un coup de main</div><div class="asR">' +
      '<b>Dis-moi ce que tu veux, ou parle-moi.</b><br>Je réponds sur tes repas, ton sport, ton budget, ' +
      'tes rendez-vous, tes compétences et tes révisions. Et je peux agir : cocher une course, noter une ' +
      'dépense, marquer ta séance, lancer un minuteur. Tout ça sans réseau.' + asPoint() + '</div></div>';
  } else {
    L.innerHTML = asLog.map((m, k) => {
      let h = '<div class="asEch">';
      h += '<div class="asQ">' + bEsc(m.q) + '</div>';
      h += '<div class="asDe moi">' + asHeureCourte(m.t) + '</div>';
      if (m.r === null) {
        h += '<div class="asTape"><i></i><i></i><i></i></div>';
      } else {
        h += '<div class="asDe">Un coup de main   ' + asHeureCourte(m.t) + '</div>';
        h += '<div class="asR">' + m.r;
        if (k === asLog.length - 1 && m.suites && m.suites.length) {
          h += '<div class="asSuites">' + m.suites.map(s =>
            '<span class="asChip" data-as="' + bEsc(s) + '">' + bEsc(s) + '</span>').join("") + '</div>';
        }
        h += '</div>';
      }
      return h + '</div>';
    }).join("");
  }
  el("asPills").innerHTML = asPills();
  const hb = asBlocMin() + asCuisBloc();
  const z = el("asBarre"); if (z) z.innerHTML = hb;
  const bv = el("asVoix"); if (bv) bv.classList.toggle("on", !!S.bouffe.voix);
  const bm = el("asMic"); if (bm && !asSR()) bm.style.display = "none";
  const so = el("asSous");
  if (so) so.textContent = asCuis ? "mode cuisine en cours" : (asTimer ? "minuteur en cours" : "toujours là, même sans réseau");
  asMajMicro();
  asBrancheP();
  L.scrollTop = L.scrollHeight;
  asMajBas();
}
function asMajBas(){
  const L = el("asLog"), b = el("asBasBtn");
  if (!L || !b) return;
  b.classList.toggle("on", L.scrollHeight - L.scrollTop - L.clientHeight > 90);
}
function asAutoH(){
  const i = el("asIn"); if (!i) return;
  i.style.height = "auto";
  i.style.height = Math.min(112, Math.max(44, i.scrollHeight)) + "px";
}
function asEnvoie(q){
  q = (q || "").trim();
  if (!q) return;
  const i = el("asIn"); if (i) { i.value = ""; asAutoH(); }
  asLog.push({q: q, r: null, t: Date.now(), suites: []});
  if (asLog.length > 40) asLog = asLog.slice(-40);
  const k = asLog.length - 1;
  asRendu();
  /* Les 260 ms ne servent pas a calculer, la reponse est deja prete. Elles servent a l'oeil :
     sans elles le texte apparait d'un bloc et on relit le debut deux fois. */
  setTimeout(() => {
    let r;
    try { r = asRepond(q); }
    catch (e) { r = '<b>Je me suis cassé la figure sur cette question.</b><br>' + bEsc(e.name + " : " + e.message); }
    if (r === "") { asLog.splice(k, 1); asRendu(); return; }
    asParle(asVocal || asTexte(r).slice(0, 420));
    if (asLog[k]) { asLog[k].r = r; asLog[k].suites = asSuites.slice(); }
    asRendu();
  }, 260);
}
function asOuvre(){
  el("asPan").classList.add("on");
  el("asVoile").classList.add("on");
  asRendu();
  /* Le temps d'un rendu avant d'animer, sinon la transition ne part pas. */

    el("asPan").classList.add("vu");
    el("asVoile").classList.add("vu");
  });
  asAutoH();
}
function asFerme(){
  el("asPan").classList.remove("vu");
  el("asVoile").classList.remove("vu");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  setTimeout(() => {
    el("asPan").classList.remove("on");
    el("asVoile").classList.remove("on");

}
function asBrancheP(){
  el("asLog").querySelectorAll("[data-brem]").forEach(b => b.addEventListener("click", () => {
    S.bouffe.remplace[b.getAttribute("data-brem")] = b.getAttribute("data-bval");

  /* Les puces de suite vivent DANS le journal. Sans cette ligne elles etaient mortes. */
  el("asLog").querySelectorAll("[data-as]").forEach(b => b.addEventListener("click", () => asEnvoie(b.getAttribute("data-as"))));
  const cp = el("asLog").querySelector("#bCopier");
  if (cp) cp.addEventListener("click", () => {
    const t = bPourClaude(asLog.length ? asLog[asLog.length - 1].q : "");
    const fini = () => { const o = el("asLog").querySelector("#bCopieOk"); if (o) o.style.display = "block"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(fini).catch(() => bSecours(t));
    else bSecours(t);
  });
  el("asPills").querySelectorAll("[data-as]").forEach(b =>
    b.addEventListener("click", () => asEnvoie(b.getAttribute("data-as"))));
  const zb = el("asBarre");
  if (zb) {
    zb.querySelectorAll("[data-as]").forEach(b =>
      b.addEventListener("click", () => asEnvoie(b.getAttribute("data-as"))));
    const st = zb.querySelector("#asMinStop");
    if (st) st.addEventListener("click", () => asEnvoie("stop minuteur"));
  }
}
(function(){
  el("asFab").addEventListener("click", asOuvre);
  el("asX").addEventListener("click", asFerme);
  el("asVoile").addEventListener("click", asFerme);
  el("asGo").addEventListener("click", () => asEnvoie(el("asIn").value));
  el("asMic").addEventListener("click", asMicro);
  el("asIn").addEventListener("input", asAutoH);
  el("asLog").addEventListener("scroll", asMajBas);
  el("asBasBtn").addEventListener("click", () => {
    const L = el("asLog"); L.scrollTo({top: L.scrollHeight, behavior: "smooth"});
  });
  el("asVider").addEventListener("click", () => { asLog = []; asRendu(); });
  /* Glisser la poignee vers le bas ferme : c'est le geste attendu sur telephone. */
  (function(){
    const p = el("asPoignee"); let y0 = null;
    p.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, {passive: true});
    p.addEventListener("touchmove", e => {
      if (y0 === null) return;
      const dy = e.touches[0].clientY - y0;
      if (dy > 0) el("asPan").style.transform = "translateY(" + dy + "px)";
    }, {passive: true});
    p.addEventListener("touchend", e => {
      const d = el("asPan").style.transform.match(/translateY\((\d+(?:\.\d+)?)px\)/);
      el("asPan").style.transform = "";
      if (d && +d[1] > 70) asFerme();
      y0 = null;
    });
  })();
  el("asVoix").addEventListener("click", () => {
    S.bouffe.voix = !S.bouffe.voix; save();
    if (!S.bouffe.voix && "speechSynthesis" in window) speechSynthesis.cancel();
    asRendu();
    if (S.bouffe.voix) asParle("La voix est allumée.", true);
  });
  if (!asSR()) el("asMic").style.display = "none";
  el("asIn").addEventListener("keydown", e => {
    /* Entree envoie, Maj plus Entree saute une ligne. C'est ce que tout le monde attend. */
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); asEnvoie(el("asIn").value); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") asFerme(); });
})();
renderAll();
/* si un rendez-vous tombe dans deux jours, on previent des l'ouverture */
setTimeout(rappelsDeuxJours, 1200);
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
