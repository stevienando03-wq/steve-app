<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Meilleure version de moi-même</title>
<style>
:root{
  --bleu:#14213D; --creme:#F5F1E8; --anthr:#4A5568; --or:#C8A24B;
  --on:#E3E8F0; --off:#F2EFE7; --vert:#1E6B33; --vertbg:#DFF0D8;
  --rouge:#9C2330; --rougebg:#F8D7DA; --ligne:#E3DFD4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--creme);color:var(--bleu);
  font-family:-apple-system,'Segoe UI',Roboto,Aptos,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:78px;max-width:520px;margin:0 auto;min-height:100vh}
.head{background:var(--bleu);color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:20}
.head h1{font-size:18px;font-weight:700;letter-spacing:.3px}
.head .mots{font-size:11px;color:#B9C2D6;margin-top:3px;text-transform:uppercase;letter-spacing:1px}
.head .date{font-size:12px;color:var(--or);margin-top:6px;font-weight:600}
.wrap{padding:14px}
.card{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(20,33,61,.04)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--anthr);margin-bottom:10px;font-weight:700}
.card h2 .tag{float:right;font-size:11px;color:var(--or)}
.sec-on{border-left:4px solid #8FA8C8}.sec-off{border-left:4px solid var(--or)}
.sec-done{border-left:4px solid #5BA86B}.sec-today{border-left:4px solid var(--or);background:#FCF8EC}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0ECE2;gap:10px}
.row:last-child{border-bottom:0}
.row .lab{font-size:13px;color:var(--anthr);flex:1}
.row .lab b{color:var(--bleu)}
.meal{font-size:13px;line-height:1.5;color:var(--bleu);padding:8px 0;border-bottom:1px solid #F0ECE2}
.meal:last-child{border-bottom:0}
.meal .k{display:inline-block;width:62px;font-size:11px;text-transform:uppercase;color:var(--or);font-weight:700;vertical-align:top}
.meal .v{display:inline-block;width:calc(100% - 66px)}
.pill{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;
  color:var(--anthr);cursor:pointer;transition:.12s}
.pill.g.act{background:var(--vertbg);border-color:#9BC6A4;color:var(--vert)}
.pill.r.act{background:var(--rougebg);border-color:#E0A4AB;color:var(--rouge)}
.pills{display:flex;gap:8px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--ligne);background:#fff;font-size:20px;
  color:var(--bleu);font-weight:700;cursor:pointer;line-height:1}
.step .val{min-width:54px;text-align:center;font-weight:700;font-size:15px}
.bar{height:9px;background:#EEE9DD;border-radius:6px;overflow:hidden;margin-top:5px}
.bar > i{display:block;height:100%;background:var(--or);border-radius:6px}
.bar.over > i{background:var(--rouge)}
.bar.warn > i{background:#D99A2B}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi .box{flex:1;min-width:78px;background:var(--bleu);color:#fff;border-radius:12px;padding:11px 8px;text-align:center}
.kpi .box.alt{background:var(--anthr)}
.kpi .box .n{font-size:21px;font-weight:800;line-height:1}
.kpi .box .t{font-size:10px;color:#C3CADB;margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
.daycard{border:1px solid var(--ligne);border-radius:12px;padding:11px;margin-bottom:9px;background:#fff}
.daycard .top{display:flex;justify-content:space-between;align-items:center}
.daycard .dl{font-weight:700;font-size:14px}
.daycard .st{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:700}
.st.on{background:var(--on);color:var(--bleu)}.st.off{background:var(--off);color:var(--anthr)}
.st.done{background:var(--vertbg);color:var(--vert)}.st.today{background:var(--or);color:#fff}
.daycard .sub{font-size:12px;color:var(--anthr);margin-top:6px;line-height:1.45}
.acc{border:1px solid var(--ligne);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.acc>.h{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.acc>.h .nm{font-weight:700;font-size:13px}
.acc>.h .meta{font-size:11px;color:var(--or);font-weight:600}
.acc>.b{display:none;padding:0 14px 14px;font-size:13px;line-height:1.6;color:var(--anthr);white-space:pre-line;border-top:1px solid #F0ECE2}
.acc.open>.b{display:block}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid #F0ECE2;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .bx{width:20px;height:20px;border:2px solid var(--ligne);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.chk.on .bx{background:var(--vert);border-color:var(--vert)}
.chk.on .nm{text-decoration:line-through;color:#A9A293}
.chk .px{margin-left:auto;font-size:11px;color:var(--anthr)}
.catname{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--or);font-weight:700;margin:12px 0 4px}
.spend{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F0ECE2}
.spend .c{flex:1;font-size:13px}
.spend .amt{font-size:12px;color:var(--anthr);min-width:84px;text-align:right}
.spend input{width:66px;padding:6px;border:1px solid var(--ligne);border-radius:8px;font-size:13px;text-align:right}
.note{font-size:12px;color:var(--anthr);line-height:1.5}
.big{font-size:26px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--ligne);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;min-width:60px;border:0;background:none;padding:9px 2px 8px;cursor:pointer;color:#A9A293;font-size:10px;font-weight:600}
.nav button .ic{font-size:19px;display:block;margin-bottom:2px}
.nav button.act{color:var(--bleu)}
.nav button.act .ic{transform:translateY(-1px)}
.tab{display:none}.tab.act{display:block}
.hint{background:#FCF8EC;border:1px dashed var(--or);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--anthr);line-height:1.5;margin-bottom:12px}
.miniobj{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0ECE2;font-size:13px}
.miniobj:last-child{border:0}.miniobj b{color:var(--bleu)}.miniobj .c{color:var(--anthr);text-align:right;max-width:55%}
.headbtns{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.headbtns button{background:rgba(255,255,255,.14);border:0;color:#fff;width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
.alert{border-left:4px solid var(--rouge);background:#FCF3F2}
.pomo{position:fixed;inset:0;background:rgba(10,15,25,.86);display:none;align-items:center;justify-content:center;z-index:50}
.pomo.open{display:flex}
.pomo .box2{background:#fff;border-radius:18px;padding:24px;width:84%;max-width:300px;text-align:center}
.pomo .ph{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--or);font-weight:700}
.pomo .time{font-size:56px;font-weight:800;color:var(--bleu);margin:6px 0;font-variant-numeric:tabular-nums}
.pomo .ctrls{display:flex;gap:10px;justify-content:center;margin-top:14px}
.pomo .ctrls button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--ligne);background:var(--creme);color:var(--bleu);font-weight:700;cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pgrid .ph{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--off)}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;font-size:12px;width:22px;height:22px;cursor:pointer}
.pgrid .ph .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 4px;text-align:center}
.hbars{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:8px}
.hbars .hb{flex:1;background:var(--or);border-radius:3px 3px 0 0;min-height:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal .hd{font-size:9px;text-transform:uppercase;color:var(--anthr);text-align:center;font-weight:700}
.cal .cell{border:1px solid var(--ligne);border-radius:8px;min-height:54px;padding:3px 2px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.cal .cell.mut{opacity:.32;cursor:default;background:transparent}
.cal .cell.selq{border-color:var(--or);box-shadow:0 0 0 1.5px var(--or)}
.cal .cell.tdy{background:#FCF8EC}
.cal .dn{font-size:10px;font-weight:800}
.cal .ics{font-size:9px;line-height:1}
.cal .dl{font-size:8px;color:var(--anthr);line-height:1.15;overflow:hidden}
body.dark{--creme:#161b24;--bleu:#E8EBF1;--anthr:#AEB6C4;--ligne:#2c3543;--on:#22304a;--off:#2a2722}
body.dark .card,body.dark .daycard,body.dark .acc,body.dark .pill,body.dark .step button,
body.dark .nav,body.dark input,body.dark textarea,body.dark .pomo .box2,body.dark .pomo .ctrls button{background:#1f2733;color:var(--bleu)}
body.dark .card{border-color:#2c3543}
body.dark .hint{background:#2a2410}
body.dark .sec-today,body.dark .alert{background:#23262f}
body.dark .head{background:#0e1729}
body.dark .kpi .box{background:#2a3346}body.dark .kpi .box.alt{background:#3a4456}
body.dark .nav button{color:#7e879a}body.dark .nav button.act{color:var(--bleu)}
body.dark .bar{background:#2c3543}
body.dark .pill.g.act{background:#1e3a26;color:#9fdcae}body.dark .pill.r.act{background:#3a1f24;color:#e8a8b0}
body.dark .st.on{background:#22304a;color:#cdd6e6}body.dark .st.off{background:#2a2722;color:var(--anthr)}
body.dark .cal .cell{background:#1f2733}body.dark .cal .cell.tdy{background:#23262f}
</style>
</head>

  </div>`;
  // astuce
  h+=`<div class="card"><h2>Astuce du jour</h2><div class="note">💡 ${TIPS[(new Date().getDate())%TIPS.length]}</div></div>`;

function renderEuro(){

  const f=S.fin;
  const totSpent=FIN.budgets.reduce((a,b)=>a+(S.spend[b[0]]||0),0);

  // 1bis. Budget d'août (chiffres donnés par Steve le 06/08)
  h+=`<div class="card sec-today"><h2>💶 Budget août <span class="tag">au 06/08</span></h2>
    <div class="kpi">
      <div class="box"><div class="n">292 €</div><div class="t">Sur le compte</div></div>
      <div class="box alt"><div class="n">150 €</div><div class="t">Tickets resto</div></div>
      <div class="box alt"><div class="n">+10 €</div><div class="t">Rembt à venir</div></div>
    </div>
    <div class="note" style="margin-top:9px"><b>~452 € pour finir le mois.</b> La règle : les courses passent en <b>TR d'abord</b> (150 € ≈ ta bouffe du mois) → le cash (~302 €) couvre le reste : whey ~25 € (1 fois), coiffure, lavage, sorties. Ça laisse ~<b>10-11 €/jour</b> de cash — large si zéro livraison.</div>
    <div class="note" style="margin-top:6px">Enveloppes détaillées ↓ « Mes dépenses du mois ». Listes de courses → onglet 🛒 Courses.</div></div>`;

    h+=`<div class="card sec-off" style="border-left:4px solid var(--rouge);background:#FCF3F2">
      <h2 style="color:var(--rouge)">⚠️ Cash jusqu'à la paie (~${jp} j)</h2>
      <div class="kpi">
        <div class="box" style="background:var(--rouge)"><div class="n">${dispo.toFixed(0)} €</div><div class="t">Reste après coiffure</div></div>
        <div class="box alt"><div class="n">${marge.toFixed(0)} €</div><div class="t">Avec découvert</div></div>
        <div class="box alt"><div class="n">${parJour.toFixed(1)} €</div><div class="t">Par jour max</div></div>
      </div>
      <div class="row" style="margin-top:6px"><div class="lab">💸 <b>Tu peux dépenser aujourd'hui</b></div><b style="font-size:18px;color:var(--rouge)">~${parJour.toFixed(0)} €</b></div>
      <div class="note" style="margin-top:9px">
        <b>On NE coupe PAS la bouffe</b> — couper les calories couperait tes gains. Manger ÉCO ≠ manger MOINS : œufs, lait, avoine, lentilles, riz, pâtes, PB = plein de calories + protéines pour des centimes. Surplus et prise de masse intacts.<br>
        <b>Ce qu'on coupe :</b> 0 resto, 0 livraison, 0 jeux, 0 Vinted. Ta bouffe ~6-7 €/j → tu rentres sous les ${parJour.toFixed(0)} €/j.<br>
        Un découvert qui sert à MANGER pour ta masse = bon découvert (~0,65 € d'agios/15 j), remboursé à la paie.
      </div></div>`;
  } else {
    h+=`<div class="hint">Entre ton solde ci-dessus → je calcule ta marge jusqu'à la paie et ton budget/jour.</div>`;
  }
  // 3. Réappros d'août (payés en TR)
  h+=`<div class="card"><h2>Réappros d'août <span class="tag">en TR</span></h2>
    <div class="row"><div class="lab">Sam 08/08</div><div class="lab" style="flex:2">🛒 GROS PLEIN (socle du mois + whey 1 kg)</div><b>~55-60 €</b></div>
    <div class="row"><div class="lab">Mer 12/08</div><div class="lab" style="flex:2">poulet 1 kg (batch), œufs x12, lait, bananes</div><b>~15 €</b></div>
    <div class="row"><div class="lab">Mer 19/08</div><div class="lab" style="flex:2">poulet, œufs x12, lait, légumes surgelés</div><b>~15 €</b></div>
    <div class="row"><div class="lab">Sam 22/08</div><div class="lab" style="flex:2">socle léger : riz/pâtes si finis, bananes</div><b>~10-12 €</b></div>
    <div class="row"><div class="lab">Mer 26/08</div><div class="lab" style="flex:2">poulet, œufs x12, lait, bananes</div><b>~15 €</b></div>

  // 4. Suivi dépenses (cibles génériques)
  h+=`<div class="card"><h2>Mes dépenses du mois <span class="tag">${totSpent.toFixed(0)} / ${totBud} €</span></h2>`;
  FIN.budgets.forEach(([cat,bud])=>{
    const sp=S.spend[cat]||0; const pct=Math.min(100,bud?sp/bud*100:0);
    const cls=sp>bud?'over':(pct>=80?'warn':'');
    h+=`<div class="spend"><span class="c">${cat}</span><span class="amt">${sp.toFixed(0)} / ${bud} €</span>
      <input type="number" inputmode="decimal" placeholder="+€" data-cat="${cat}"></div>
      <div class="bar ${cls}"><i style="width:${pct}%"></i></div>`;
  });
  h+=`<div class="note" style="margin-top:10px">Tape un montant + Entrée pour l'ajouter. Barre rouge = budget dépassé.</div></div>`;
  // 5. Leviers d'éco (générique)
  h+=`<div class="card"><h2>Leviers d'économie</h2>`;
  FIN.leviers.forEach(([p,t])=>{h+=`<div class="miniobj"><b>${p}</b><span class="c">${t}</span></div>`;});
  h+=`<div class="note" style="margin-top:8px">Le détail chiffré de ton budget reste dans ton Excel (privé). Ici = le rappel des bons réflexes.</div></div>`;
  c.innerHTML=h;
  c.querySelectorAll("[data-cat]").forEach(inp=>{
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")addSpend(inp);});
    inp.addEventListener("blur",()=>{if(inp.value)addSpend(inp);});
  });
  c.querySelectorAll("[data-fin]").forEach(inp=>{
    inp.addEventListener("change",()=>{const k=inp.dataset.fin;S.fin[k]=inp.value===''?'':parseFloat(inp.value.replace(",","."));save();renderEuro();});
  });
  function addSpend(inp){const v=parseFloat(inp.value.replace(",","."));if(!isNaN(v)){const c=inp.dataset.cat;S.spend[c]=(S.spend[c]||0)+v;save();renderEuro();}}
}

 {t:"🔥 CIRCUIT ABDOS A — jours PUSH · haut des abdos + gainage (~9 min)",x:"En fin de séance, 3 tours, repos 30 s (superset les 2 premiers) :\nCrunch à la poulie haute, à genoux — 3×15-20  (EN CHARGE = la clé pour épaissir)\nRelevé de buste sur banc incliné — 3×15\nPlanche (gainage) — 3×40 s"},
 {t:"🔥 CIRCUIT ABDOS B — jours PULL · bas des abdos + obliques (~9 min)",x:"Enchaîné, repos 30 s :\nRelevé de jambes suspendu à la barre (ou appui coudes) — 3×12-15  (le meilleur pour le bas + le « V »)\nReverse crunch au sol — 3×15\nRussian twist lesté — 3×20 (10/côté)\nPlanche latérale — 2×30 s/côté"},
 {t:"🔥 CIRCUIT ABDOS C — jours LEGS · core profond + anti-rotation (~9 min)",x:"Enchaîné, repos 30 s :\nRoulette abdominale (ab wheel) OU crunch poulie — 3×10-12\nPallof press (anti-rotation à la poulie) — 3×12/côté\nHollow hold (bas du dos collé au sol) — 3×25-30 s\nMountain climbers lents — 3×30 s"},
 {t:"Progression (la clé — abdos compris)",x:"Double progression : monte les reps jusqu'au haut de la fourchette, puis +1-2 kg et repars en bas. +1 rep ou +1-2 kg/semaine, 1-2 reps en réserve. LES ABDOS AUSSI se chargent (poulie, lest) — pas 300 crunchs au poids de corps. Deload toutes les 6-8 sem si stagnation."},
 {t:"Cardio & pied (pour faire RESSORTIR les abdos)",x:"10-15 min de cardio SANS impact (vélo, rameur, marche inclinée) 2-3×/sem, en fin de séance ou les jours OFF. JAMAIS course/saut tant que la gêne avant-pied est là. C'est ce cardio + l'assiette qui révèlent les abdos que tu construis."},
 {t:"Récup",x:"Repos 60-90s en isolation, 2-3 min sur presse/hack, 30 s sur le circuit abdos. 2 ON / 1 OFF, jamais 2 OFF d'affilée. Sommeil 7-8h. Shake whey + gainer dans l'heure après la séance."},
];
function renderSport(){
  const c=document.getElementById("sport");
  let h=`<div class="card sec-on"><h2>Basic Fit — reprise à 0 <span class="tag">focus abdos</span></h2>
    <div class="note">Compteur à <b>ZÉRO</b>, on repart proprement. Rythme : 2 ON / 1 OFF, jamais 2 OFF d'affilée. Objectif : <b>≥ 14 séances en août</b>. <b>Nouveau cap : des abdos qui se voient</b> → un circuit abdos EN CHARGE à <b>CHAQUE séance</b> (A les jours PUSH, B les PULL, C les LEGS), sans jamais dépasser 1h15. Gêne avant-pied → LEGS sans charge sur les orteils. Touche un titre pour le détail.</div></div>`;
  h+=`<div class="card sec-today"><h2>🔥 Abdos visibles — la vérité utile</h2>
    <div class="note">Un abdo qui se voit = <b>2 conditions</b>.<br><b>1. Le muscle assez épais</b> → c'est ce que font tes 3 circuits, <b>en charge</b> (poulie, lest), pas 300 crunchs au poids de corps.<br><b>2. Un taux de gras assez bas</b> pour qu'il apparaisse → ça se joue à la <b>cuisine</b>, pas à la salle.<br>Ton compromis (tu prends du muscle en même temps) : <b>lean bulk LENT</b> (+0,3-0,5 kg/mois max, cf. onglets Bouffe/Courses) + <b>10-15 min de cardio faible impact 2-3×/sem</b>. Tu construis des abdos épais maintenant ; dès que tu sécheras un peu, ils ressortiront déjà dessinés.</div></div>`;
  h+=`<div class="card"><h2>⏱️ Séance efficace — 1h15 chrono</h2>
    <div class="note">Échauffement 6-8 min → <b>les exos du jour ~45 min</b> (superset les isolations, repos 60-75 s) → <b>circuit abdos 8-10 min</b> → fini. Si tu débordes : coupe le dernier exo d'isolation, <b>jamais les abdos</b>. Minuteur de repos plus bas ↓</div></div>`;
  PROG.forEach(p=>{h+=`<div class="acc" data-acc><div class="h"><span class="nm">${p.t}</span><span class="meta">›</span></div><div class="b">${p.x}</div></div>`;});
  h+=`<div class="card"><h2>⏱️ Minuteur de repos</h2>
    <div style="font-size:40px;text-align:center;font-weight:800;color:var(--bleu)" id="restTime">${restS>0?restS+'s':'—'}</div>
    <div class="pills" style="justify-content:center;gap:8px;margin-top:6px"><span class="pill" data-rest="60">60s</span><span class="pill" data-rest="90">90s</span><span class="pill" data-rest="120">120s</span><span class="pill r" data-rest="0">Stop</span></div>
    <div class="note" style="margin-top:8px">60-90s en isolation, 2-3 min sur presse/hack.</div></div>`;
  h+=`<div class="card"><h2>Suivi des charges & poids</h2><div class="note">Note tes charges semaine/semaine dans l'Excel (onglet 📓 Journal) ou en « note du jour ». Ton poids + mensurations se suivent dans l'onglet Semaine. Progresse : +1 rep ou +1-2 kg/sem.</div></div>`;
  c.innerHTML=h;
  c.querySelectorAll("[data-acc]").forEach(a=>a.querySelector(".h").addEventListener("click",()=>a.classList.toggle("open")));
  c.querySelectorAll("[data-rest]").forEach(b=>b.addEventListener("click",()=>{clearInterval(restT);restS=+b.dataset.rest;const el=document.getElementById("restTime");el.textContent=restS>0?restS+'s':'—';if(restS>0){restT=setInterval(()=>{restS--;const e=document.getElementById("restTime");if(!e){clearInterval(restT);return;}if(restS<=0){e.textContent='GO 💪';clearInterval(restT);}else{e.textContent=restS+'s';}},1000);}}));
}
function listHTML(arr,key){let h='';arr.forEach(it=>{h+=`<div class="chk ${it.done?'on':''}" data-tg="${key}:${it.id}"><span class="bx">${it.done?'✓':''}</span><span class="nm">${it.text}</span><button class="del" style="margin-left:auto;background:none;border:0;color:var(--anthr);cursor:pointer;font-size:14px" data-del="${key}:${it.id}">✕</button></div>`;});return h;}
function renderApprendre(){
  const c=document.getElementById("apprendre");
  let h=`<div class="hint">Tes lectures et ce que tu veux apprendre. Tape dans le champ + Entrée pour ajouter, touche une ligne pour la cocher. Tout reste sur ton tél.</div>`;
  h+=`<div class="card"><h2>📖 À lire <span class="tag">${S.read.filter(x=>x.done).length}/${S.read.length}</span></h2>${S.read.length?listHTML(S.read,'read'):'<div class="note">Rien encore.</div>'}
    <input type="text" data-add="read" placeholder="Ajouter un livre / article…" style="width:100%;margin-top:8px;border:1px solid var(--ligne);border-radius:8px;padding:8px;font-size:13px;font-family:inherit"></div>`;
  h+=`<div class="card"><h2>🎯 À apprendre <span class="tag">${S.skills.filter(x=>x.done).length}/${S.skills.length}</span></h2>${S.skills.length?listHTML(S.skills,'skills'):'<div class="note">Rien encore.</div>'}
    <input type="text" data-add="skills" placeholder="Ex : Excel avancé, anglais, cuisine, montage…" style="width:100%;margin-top:8px;border:1px solid var(--ligne);border-radius:8px;padding:8px;font-size:13px;font-family:inherit"></div>`;
  const SUGG_READ=["Atomic Habits (J. Clear) — bâtir des habitudes","La psychologie de l'argent (M. Housel)","Deep Work (C. Newport) — concentration","Comment se faire des amis (D. Carnegie) — confiance","Les mots sont des fenêtres (CNV, Rosenberg) — couple","Père riche père pauvre (Kiyosaki) — argent"];
  const SUGG_SKILL=["Excel avancé (TCD, RECHERCHEV, Power Query)","Anglais — 15 min/jour","Cuisine — 5 techniques de base","Prise de parole / gérer les appels","Time-blocking / anti-procrastination","Bases nutrition prise de masse"];
  h+=`<div class="card"><h2>💡 Suggestions <span class="tag">touche = ajouter</span></h2>
    <div class="note" style="margin-bottom:8px">Choisies pour ton profil (RAF + M2 Finance + dev perso). Touche une pastille pour l'ajouter à tes listes.</div>
    <div class="pills" style="flex-wrap:wrap;gap:6px">`;
  SUGG_READ.forEach(t=>h+=`<span class="pill" data-sugg="read::${t}">📖 ${t.split(' (')[0]}</span>`);
  SUGG_SKILL.forEach(t=>h+=`<span class="pill" data-sugg="skills::${t}">🎯 ${t.split(' (')[0]}</span>`);
  h+=`</div></div>`;
  h+=`<div class="card"><h2>Le réflexe</h2><div class="note">Lecture 20 min/jour (tracker dans « Aujourd'hui »). Commence petit : 10 pages ou 1 chapitre par soir.</div></div>`;
  c.innerHTML=h;
  c.querySelectorAll('[data-sugg]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.sugg.split('::'),k=p[0],txt=p[1];if(!S[k].some(x=>x.text===txt)){S[k].push({id:String(Date.now()),text:txt,done:false});save();renderApprendre();}}));
  c.querySelectorAll('[data-add]').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()){const k=inp.dataset.add;S[k].push({id:String(Date.now()),text:inp.value.trim(),done:false});save();renderApprendre();}}));
  c.querySelectorAll('[data-tg]').forEach(el=>el.addEventListener('click',e=>{if(e.target.dataset.del!==undefined)return;const p=el.dataset.tg.split(':'),k=p[0],id=p[1];const it=S[k].find(x=>x.id===id);if(it){it.done=!it.done;save();renderApprendre();}}));
  c.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const p=b.dataset.del.split(':'),k=p[0],id=p[1];S[k]=S[k].filter(x=>x.id!==id);save();renderApprendre();}));
}
function renderAll(){renderJour();renderSemaine();renderSport();renderBouffe();renderMenu();renderCourses();renderEuro();renderStyle();renderApprendre();renderObj();}

function applyDark(){document.body.classList.toggle('dark',!!S.dark);document.getElementById('darkBtn').textContent=S.dark?'☀️':'🌙';}
document.getElementById('darkBtn').addEventListener('click',function(){S.dark=!S.dark;save();applyDark();});

// pomodoro 25/5
(function(){
 let secs=25*60,phase='Travail',running=false,timer=null,count=0;
 const ov=document.getElementById('pomo'),tEl=document.getElementById('pomoTime'),phEl=document.getElementById('pomoPhase'),cEl=document.getElementById('pomoCount'),stB=document.getElementById('pomoStart');
 function fmt(){const m=Math.floor(secs/60),s=secs%60;tEl.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;phEl.textContent=phase;cEl.textContent=count+' pomodoro fait(s)';}
 function tick(){secs--;if(secs<0){if(phase==='Travail'){count++;phase='Pause';secs=5*60;}else{phase='Travail';secs=25*60;}}fmt();}
 stB.addEventListener('click',function(){running=!running;stB.textContent=running?'Pause':'Reprendre';if(running){timer=setInterval(tick,1000);}else{clearInterval(timer);}});
 document.getElementById('pomoReset').addEventListener('click',function(){clearInterval(timer);running=false;stB.textContent='Démarrer';phase='Travail';secs=25*60;fmt();});
 document.getElementById('pomoBtn').addEventListener('click',function(){ov.classList.add('open');fmt();});
 document.getElementById('pomoClose').addEventListener('click',function(){ov.classList.remove('open');});
 fmt();
})();
// photos garde-robe
function addPhoto(file){
 const r=new FileReader();
 r.onload=function(){const img=new Image();img.onload=function(){
   const max=600;let w=img.width,h=img.height;
   if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;}
   const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
   try{S.photos.push({id:String(Date.now()),data:cv.toDataURL('image/jpeg',0.6)});save();renderStyle();}
   catch(e){alert('Mémoire pleine — supprime quelques photos.');}
 };img.src=r.result;};
 r.readAsDataURL(file);
}
