<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma version">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Meilleure version de moi-même</title>
<style>
:root{
  --bleu:#14213D; --creme:#F5F1E8; --anthr:#4A5568; --or:#C8A24B;
  --vert:#1E6B33; --vertbg:#DFF0D8; --rouge:#9C2330; --rougebg:#F8D7DA;
  --ligne:#E3DFD4; --bleuclair:#8FA8C8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--creme);color:var(--bleu);
  font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:76px;max-width:520px;margin:0 auto;min-height:100vh}
.head{background:var(--bleu);color:#fff;padding:16px 18px 13px;position:sticky;top:0;z-index:20}
.head h1{font-size:17px;font-weight:700}
.head .date{font-size:12px;color:var(--or);margin-top:4px;font-weight:600}
.head button{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);border:0;color:#fff;
  width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
.wrap{padding:14px;overflow-wrap:break-word}
.card{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:15px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--anthr);margin-bottom:10px;font-weight:700}
.card h2 .tag{float:right;font-size:11px;color:var(--or);text-transform:none;letter-spacing:0}
.hero{background:var(--bleu);color:#fff;border:0}
.hero h2{color:#B9C2D6}
.hero .big{font-size:26px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.hero .sub{font-size:13px;color:#C3CADB;line-height:1.5}
.sec-or{border-left:4px solid var(--or)}
.sec-vert{border-left:4px solid #5BA86B}
.sec-rouge{border-left:4px solid var(--rouge)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0ECE2;gap:10px}
/* Un enfant de flex a min-width:auto par defaut et REFUSE de retrecir sous la taille de son
   contenu. Un texte long dans une colonne poussait donc la page entiere a 946 px de large
   sur un ecran de 375. Constate le 13/09/2026. */
.row > *{min-width:0}
.row:last-child{border-bottom:0}
.row .lab{font-size:13.5px;color:var(--anthr);flex:1;line-height:1.45}
.row .lab b{color:var(--bleu)}
.note{font-size:12.5px;color:var(--anthr);line-height:1.55}
.pill{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:8px 15px;font-size:13px;
  font-weight:600;color:var(--anthr);cursor:pointer;display:inline-block}
.pill.on{background:var(--vertbg);border-color:#9BC6A4;color:var(--vert)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:block;width:100%;text-align:center;background:var(--bleu);color:#fff;border:0;padding:13px;
  border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.light{background:#fff;color:var(--bleu);border:1px solid var(--ligne)}
.btn.or{background:var(--or)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:36px;height:36px;border-radius:9px;border:1px solid var(--ligne);background:#fff;font-size:20px;
  color:var(--bleu);font-weight:700;cursor:pointer;line-height:1}
.step .val{min-width:56px;text-align:center;font-weight:700;font-size:15px}
.bar{height:9px;background:#EEE9DD;border-radius:6px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--or);border-radius:6px}
.bar.vert > i{background:#5BA86B}
.acc{border:1px solid var(--ligne);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.acc > .h{padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc > .h .nm{font-weight:700;font-size:13.5px}
.acc > .h .meta{font-size:11px;color:var(--or);font-weight:600;white-space:nowrap}
.acc > .b{display:none;padding:0 15px 14px;font-size:13px;line-height:1.65;color:var(--anthr);white-space:pre-line;border-top:1px solid #F0ECE2}
.acc.open > .b{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--ligne);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 2px 8px;cursor:pointer;color:#A9A293;font-size:10px;font-weight:600}
.nav button .ic{font-size:19px;display:block;margin-bottom:2px}
.nav button.act{color:var(--bleu)}
.tab{display:none}
/* --- onglet Finance : calcul mental et fiches --- */
.fq{font-size:20px;font-weight:800;color:var(--bleu);line-height:1.35;margin:2px 0 12px}
.fin-in{width:100%;padding:13px;font-size:19px;font-weight:700;text-align:center;
  border:2px solid var(--ligne);border-radius:11px;background:#fff;color:var(--bleu)}
.fin-in:focus{outline:0;border-color:var(--bleu)}
.fbon{background:var(--vertbg);border-color:var(--vert)}
.fmal{background:var(--rougebg);border-color:var(--rouge)}
.ftip{background:#FCF8EC;border-left:3px solid var(--or);border-radius:0 9px 9px 0;
  padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--anthr);margin-top:10px}
.frep{font-size:15px;font-weight:700;margin-top:10px}
.fprog{height:5px;background:var(--ligne);border-radius:3px;overflow:hidden;margin-bottom:12px}
.fprog i{display:block;height:100%;background:var(--bleu)}
.fmeta{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--or);margin-bottom:6px}
.fduo{display:flex;gap:9px;margin-top:10px}
.fduo .btn{margin-top:0}
.bsec{background:#fff;color:var(--bleu);border:1px solid var(--ligne)}
body.dark .fin-in,body.dark .fq{color:#e8eaf0}
body.dark .ftip{background:#2a2f3a}.tab.act{display:block}
.rdv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #F0ECE2;align-items:flex-start}
.rdv:last-child{border-bottom:0}
.rdv .j{background:var(--creme);border-radius:10px;padding:6px 9px;text-align:center;min-width:52px;flex:none}
.rdv .j .n{font-size:17px;font-weight:800;line-height:1}
.rdv .j .m{font-size:9.5px;text-transform:uppercase;color:var(--anthr);letter-spacing:.4px}
.rdv .c{flex:1}
.rdv .c .t{font-weight:700;font-size:13.5px}
.rdv .c .h{font-size:12px;color:var(--or);font-weight:600;margin-top:1px}
.rdv .c .w{font-size:12px;color:var(--anthr);margin-top:4px;line-height:1.45}
.rdv.urgent .j{background:var(--rougebg)}
.gcal{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--bleu);
  background:var(--creme);border:1px solid var(--ligne);border-radius:16px;padding:5px 12px;text-decoration:none}
.donut{display:block;margin:4px auto 0}
#restT.fini{color:var(--vert);animation:flash .5s ease-in-out 3}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.25}}
.donut-c{font-size:20px;font-weight:800;fill:var(--bleu)}
.donut-l{font-size:9px;fill:var(--anthr);text-transform:uppercase;letter-spacing:.6px}
.mvt{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F0ECE2;font-size:13px;gap:8px}
.mvt:last-child{border-bottom:0}
.mvt .g{flex:1}
.mvt .cat{font-size:11px;color:var(--anthr)}
.mvt .amt{font-weight:700;white-space:nowrap}
.mvt .amt.in{color:var(--vert)}
.mvt .amt.out{color:var(--rouge)}
.mvt .del{background:none;border:0;color:#C9C2B4;font-size:15px;cursor:pointer;padding:0 2px}
.form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form input,.form select{flex:1;min-width:88px;padding:11px;border:1px solid var(--ligne);border-radius:10px;
  font-size:14px;font-family:inherit;background:#fff;color:var(--bleu)}
.kpi{display:flex;gap:10px}
.kpi .box{flex:1;background:var(--creme);border-radius:12px;padding:11px 8px;text-align:center}
.kpi .box .n{font-size:18px;font-weight:800}
.kpi .box .t{font-size:9.5px;color:var(--anthr);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.kpi .box.v .n{color:var(--vert)}.kpi .box.r .n{color:var(--rouge)}
.skill{border:1px solid var(--ligne);border-radius:12px;padding:12px;margin-bottom:9px;background:#fff}
.skill .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skill .nm{font-weight:700;font-size:13.5px}
.skill .lvl{font-size:11px;color:var(--or);font-weight:700;white-space:nowrap}
.skill .why{font-size:12px;color:var(--anthr);margin-top:5px;line-height:1.5}
.skill .dots{display:flex;gap:5px;margin-top:9px}
.skill .dots span{width:26px;height:8px;border-radius:4px;background:#EEE9DD;cursor:pointer}
.skill .dots span.on{background:var(--or)}
.skill .res{font-size:11.5px;color:var(--anthr);margin-top:8px;line-height:1.5;padding-top:8px;border-top:1px solid #F0ECE2}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid #F0ECE2;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .bx{width:20px;height:20px;border:2px solid var(--ligne);border-radius:6px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;color:#fff}
.chk.on .bx{background:var(--vert);border-color:var(--vert)}
.chk.on .nm{text-decoration:line-through;color:#A9A293}
.hint{background:#FCF8EC;border:1px dashed var(--or);border-radius:11px;padding:11px 13px;font-size:12.5px;
  color:var(--anthr);line-height:1.55;margin-bottom:12px}
textarea{width:100%;border:1px solid var(--ligne);border-radius:10px;padding:10px;font-size:13.5px;
  font-family:inherit;color:var(--bleu);min-height:60px;background:#fff}
.jour-repas{border:1px solid var(--ligne);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:#fff}
.jour-repas:last-child{margin-bottom:0}
.jour-repas.auj{border-color:var(--or);border-width:2px;background:#FCF8EC}
.jour-repas .d{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--or);margin-bottom:6px}
.jour-repas .l{display:flex;gap:9px;font-size:12.5px;padding:3px 0;line-height:1.45}
.jour-repas .l .q{color:#A9A293;min-width:64px;flex:none;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding-top:3px}
.jour-repas .l .v{color:var(--anthr);flex:1}
.jour-repas .l .v b{color:var(--bleu)}
.chk .nm .sq{display:block;font-size:11px;color:#A9A293;font-weight:600;margin-top:1px}
.chk .qt{font-size:11px;color:#A9A293;white-space:nowrap;margin-left:auto;font-weight:700;flex:none}
.chk.on .qt,.chk.on .sq{text-decoration:line-through}
.alerte{background:var(--rougebg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;
  color:var(--rouge);font-weight:600;margin-top:9px}
.etape{display:flex;gap:9px;padding:4px 0;font-size:12.5px;line-height:1.6;color:var(--anthr)}
.etape .n{width:19px;height:19px;border-radius:50%;background:var(--bleu);color:#fff;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.ing{background:var(--creme);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:var(--anthr)}
.ing b{color:var(--bleu)}
body.dark{--creme:#161b24;--bleu:#E8EBF1;--anthr:#AEB6C4;--ligne:#2c3543}
body.dark .card,body.dark .acc,body.dark .skill,body.dark .nav,body.dark input,body.dark select,
body.dark textarea,body.dark .pill,body.dark .step button{background:#1f2733;color:var(--bleu)}
body.dark .head{background:#0e1729}
body.dark .hero{background:#26304a}
body.dark .kpi .box,body.dark .rdv .j{background:#2a3346}
body.dark .hint{background:#2a2410}
body.dark .jour-repas{background:#1f2733}
body.dark .jour-repas.auj{background:#2a2410}
body.dark .alerte{background:#3a1c22;color:#F0A0AA}
body.dark .ing{background:#2a3346}
body.dark .etape .n{background:#3b4763}
body.dark .bar{background:#2c3543}
body.dark .nav button{color:#7e879a}
body.dark .donut-c{fill:#E8EBF1}
/* ---------- L'assistant global, ajoute le 13/09/2026 ---------- */
.asFab{position:fixed;left:12px;bottom:72px;z-index:60;width:54px;height:54px;border-radius:50%;
  background:var(--bleu);color:#fff;font-size:21px;cursor:pointer;
  /* Le lisere creme le detache du texte : sans lui il se posait au ras des phrases. */
  border:3px solid var(--creme);
  box-shadow:0 6px 18px rgba(31,56,100,.34);display:flex;align-items:center;justify-content:center;
  transition:transform .16s ease}
.asFab:active{transform:scale(.92)}
.asVoile{position:fixed;inset:0;z-index:70;background:rgba(20,24,34,.46);display:none;
  opacity:0;transition:opacity .2s ease}
.asVoile.on{display:block}
.asVoile.vu{opacity:1}
.asPan{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--creme);
  border-radius:20px 20px 0 0;display:none;flex-direction:column;height:88vh;max-height:88vh;
  box-shadow:0 -10px 34px rgba(20,24,34,.24);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.22,1,.36,1)}
.asPan.on{display:flex}
.asPan.vu{transform:translateY(0)}

/* La poignee : glisser vers le bas ferme, c'est le geste attendu sur telephone. */
.asPoignee{padding:9px 0 4px;cursor:grab;touch-action:none;display:flex;justify-content:center}
.asPoignee i{display:block;width:42px;height:4px;border-radius:3px;background:var(--ligne)}
.asPan > .t{padding:2px 15px 11px;border-bottom:1px solid var(--ligne);display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.asPan > .t .nom{display:flex;align-items:center;gap:9px;min-width:0}
.asPan > .t .av{width:30px;height:30px;border-radius:50%;background:var(--bleu);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.asPan > .t b{font-size:15px;display:block;line-height:1.15}
.asPan > .t .sous{font-size:11px;color:var(--anthr);opacity:.75}
.asPan > .t .out{display:flex;gap:4px;flex:0 0 auto}
.asPan > .t .x{background:none;border:none;font-size:19px;line-height:1;cursor:pointer;
  color:var(--anthr);width:34px;height:34px;border-radius:9px}
.asPan > .t .x:active{background:var(--ligne)}

.asLog{flex:1;overflow-y:auto;padding:14px 15px 4px;min-height:120px;-webkit-overflow-scrolling:touch}
.asEch{margin-bottom:16px}
.asQ{background:var(--bleu);color:#fff;border-radius:16px 16px 5px 16px;padding:10px 14px;
  margin:0 0 9px auto;max-width:84%;width:fit-content;font-size:14.5px;line-height:1.5;
  animation:asMonte .22s ease both}
.asDe{font-size:10.5px;color:var(--anthr);opacity:.62;margin:0 2px 4px;display:flex;
  align-items:center;gap:5px}
.asDe.moi{justify-content:flex-end}
.asR{background:#fff;border-radius:16px 16px 16px 5px;padding:13px 15px;
  font-size:14.5px;line-height:1.62;color:var(--anthr);overflow-wrap:break-word;
  box-shadow:0 1px 3px rgba(20,24,34,.07);animation:asMonte .24s ease both}
.asR > *:first-child{margin-top:0}
.asR .ing{font-size:15px;line-height:1.5}
.asR .note{font-size:13.5px;line-height:1.58}
.asR .row{padding:9px 0}
.asR .lab{font-size:13.5px}
.asR .etape{font-size:13.5px;line-height:1.62;padding:6px 0}
@keyframes asMonte{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* Trois points : la reponse est instantanee, mais l'oeil a besoin de savoir ou regarder. */
.asTape{background:#fff;border-radius:16px 16px 16px 5px;padding:14px 16px;width:fit-content;
  box-shadow:0 1px 3px rgba(20,24,34,.07);display:flex;gap:5px}
.asTape i{width:7px;height:7px;border-radius:50%;background:var(--anthr);opacity:.4;
  animation:asPoint 1.1s infinite}
.asTape i:nth-child(2){animation-delay:.18s}
.asTape i:nth-child(3){animation-delay:.36s}
@keyframes asPoint{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:.85;transform:translateY(-4px)}}

.asSuites{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.asChip{background:var(--creme);border:1px solid var(--ligne);border-radius:16px;
  padding:8px 13px;font-size:13px;cursor:pointer;color:var(--bleu);font-weight:600;
  line-height:1.2}
.asChip:active{background:var(--ligne)}

.asBasBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:104px;z-index:5;
  background:#fff;border:1px solid var(--ligne);border-radius:50%;width:36px;height:36px;
  cursor:pointer;box-shadow:0 3px 10px rgba(20,24,34,.16);font-size:15px;display:none;
  color:var(--bleu)}
.asBasBtn.on{display:block}

.asBas{padding:11px 15px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--ligne);
  background:var(--creme);border-radius:0 0 20px 20px}
.asBas .form{display:flex;gap:8px;align-items:flex-end}
.asBas textarea{flex:1;min-width:0;resize:none;height:44px;max-height:112px;overflow-y:auto;
  font-size:15px;line-height:1.45;padding:11px 13px;font-family:inherit}
.asEnv{width:44px;height:44px;border-radius:50%;background:var(--bleu);color:#fff;border:none;
  font-size:17px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.asEnv:disabled{opacity:.4}
.asBas .pills{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px}
.asOk{background:var(--vertbg);border-radius:11px;padding:11px 13px;font-size:13.5px;
  line-height:1.55;color:var(--anthr);margin-top:8px}
.asIco{background:var(--creme);border:1px solid var(--ligne);border-radius:50%;width:44px;
  height:44px;font-size:17px;cursor:pointer;flex:0 0 auto;line-height:1}
body.dark .asPan,body.dark .asBas{background:#1B2233}
body.dark .asR,body.dark .asTape{background:#222B40;box-shadow:none}
body.dark .asChip,body.dark .asBasBtn{background:#222B40;border-color:#33405C;color:#C6CEDC}
/* ---------- La voix et le mode cuisine, 13/09/2026 ---------- */
.asIco{background:var(--creme);border:1px solid var(--ligne);border-radius:12px;width:42px;
  height:38px;font-size:17px;cursor:pointer;flex:0 0 auto;line-height:1}
.asIco.on{background:var(--bleu);border-color:var(--bleu);color:#fff}
.asIco.ecoute{background:var(--rouge);border-color:var(--rouge);color:#fff;animation:asPulse 1s infinite}
@keyframes asPulse{0%,100%{opacity:1}50%{opacity:.45}}
.asCuis{background:var(--bleu);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.asCuis .p{font-size:11px;letter-spacing:.6px;text-transform:uppercase;opacity:.72}
.asCuis .e{font-size:15px;line-height:1.55;margin-top:5px}
.asCuis .b{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.asCuis .b button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:9px;
  padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.asMin{background:var(--orbg);border-radius:11px;padding:10px 13px;margin-bottom:11px;
  font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:9px}
.asMin b{font-size:16px}
body.dark .asIco{background:#222B40;border-color:#33405C;color:#E7EAF2}
</style>
</head>
<body>

<div class="head">
  <h1>Meilleure version de moi-même</h1>
  <div class="date" id="hdate"></div>
  <button id="darkBtn" title="Mode sombre">🌙</button>

/* ================= DATES ================= */
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const JOURS_C = ["dim","lun","mar","mer","jeu","ven","sam"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function auj(){ return iso(new Date()); }
function moisCourant(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
/* « 2026-08 » devient « août ». Sert a afficher le mois SUIVI, pas celui du jour. */
function libelleMois(cle){
  const p = String(cle || moisCourant()).split("-");
  return MOIS[parseInt(p[1], 10) - 1] || "";
}
/* « 2026-08 » devient « 2026-09 », et « 2026-12 » devient « 2027-01 ». */
function moisApres(cle){
  const p = String(cle || moisCourant()).split("-");
  let an = parseInt(p[0], 10), mo = parseInt(p[1], 10) + 1;
  if (mo > 12) { mo = 1; an += 1; }
  return an + "-" + String(mo).padStart(2, "0");
}
function parse(s){ const p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function joursEntre(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function plusJours(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function libelle(s){ const d=parse(s); return JOURS_C[d.getDay()]+" "+d.getDate()+" "+MOIS_C[d.getMonth()]; }
function libelleLong(s){ const d=parse(s); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }

/* type de séance du jour, calculé depuis le début du cycle */
function seanceDu(dateIso){
  const n = joursEntre(CYCLE_DEBUT, dateIso);
  const i = ((n % CYCLE.length) + CYCLE.length) % CYCLE.length;
  return CYCLE[i];
}
function estTravail(dateIso){ return TRAVAIL.jours.indexOf(parse(dateIso).getDay()) >= 0; }
function creneauSport(dateIso){
  const d = parse(dateIso).getDay();
  if (d === 4) return "le matin avant le travail, tu as ta réunion à 20h30";
  if (estTravail(dateIso)) return "après le travail, vers 19h00";
  return "quand tu veux dans la journée";
}
/* Les rendez-vous viennent de deux endroits : RDV, ecrit dans le code, et S.rdv, ce que
   Steve ajoute lui-meme. Depuis le 13/09/2026 il peut aussi en RETIRER. Un rendez-vous a
   lui est supprime de S.rdv. Un rendez-vous fixe ne peut pas l'etre, il est dans le code :
   sa cle part alors dans S.rdvMasques et il n'est plus affiche nulle part. */
S.rdvMasques = Array.isArray(S.rdvMasques) ? S.rdvMasques : [];
function cleRdv(r){ return r.d + "|" + r.h + "|" + r.t; }
function tousRdv(){
  return RDV.concat(S.rdv).filter(r => S.rdvMasques.indexOf(cleRdv(r)) < 0);
}
let RDV_VUS = [];
function oublieRdv(i){
  const r = RDV_VUS[i];
  if (!r) return;
  if (!confirm("Retirer " + r.t + ", " + libelleLong(r.d) + " ?")) return;
  const k = S.rdv.findIndex(x => cleRdv(x) === cleRdv(r));
  if (k >= 0) S.rdv.splice(k, 1);
  else if (S.rdvMasques.indexOf(cleRdv(r)) < 0) S.rdvMasques.push(cleRdv(r));
  save(); renderSemaine(); renderJour();
}

/* rendez-vous d'un jour donné, fixes plus les tiens */
function rdvDu(dateIso){
  let out = tousRdv().filter(r => r.d === dateIso);
  const jour = parse(dateIso).getDay();
  RECURRENT.forEach(r => { if (r.jour === jour) out.push({d:dateIso, h:r.h, dur:r.dur, t:r.t, note:r.note, rec:true}); });
  return out.sort((a,b) => a.h.localeCompare(b.h));
}
function prochainsRdv(n){
  const t = auj();
  let out = tousRdv().filter(r => r.d >= t).sort((a,b) => (a.d+a.h).localeCompare(b.d+b.h));
  return out.slice(0, n);
}

/* Les abonnements alimentent le prévisionnel. Une ligne prévue issue d'un abonnement porte
   son rid, ce qui permet de la retrouver plus tard. On n'injecte que ce qui manque, donc
   appeler cette fonction deux fois ne crée pas de doublon. */
function injecteRecurrents(){
  const presents = {};
  S.budget.prev.forEach(p => { if (p.rid) presents[p.rid] = true; });
  S.budget.recur.forEach(r => {
    if (presents[r.rid]) return;
    S.budget.prev.push({type:r.type, montant:r.montant, cat:r.cat, lib:r.lib, rid:r.rid});
  });
}

function renderEuro(){
  const b = S.budget;
  const entrees = b.mvts.filter(m => m.type === "in").reduce((a, m) => a + m.montant, 0);
  const sorties = b.mvts.filter(m => m.type === "out").reduce((a, m) => a + m.montant, 0);
  const base = (b.soldeDebut || 0) + entrees;
  const solde = base - sorties;
  const pct = base > 0 ? Math.max(0, Math.min(1, solde / base)) : 0;
  const prec = b.histo.length ? b.histo[b.histo.length - 1] : null;
  let h = "";

  if (b.soldeDebut === null) {
    h += '<div class="card"><h2>Pour commencer</h2>' +
         '<div class="note">Entre ce que tu as sur ton compte aujourd\'hui. Ensuite tu ajoutes tes entrées et tes sorties, le cercle suit.</div>' +
         '<div class="form"><input type="number" inputmode="decimal" id="initSolde" placeholder="Solde actuel en euros"></div>' +
         '<button class="btn" id="setSolde">Enregistrer</button></div>';
    el("euro").innerHTML = h;
    el("setSolde").addEventListener("click", () => {
      const v = parseFloat((el("initSolde").value || "").replace(",", "."));
      if (!isNaN(v)) { S.budget.soldeDebut = v; S.budget.mois = moisCourant(); save(); renderEuro(); }
    });
    return;
  }

  /* épargne : ce qui est mis de côté moins ce qui est repris, sur tous les mois */
  function epargneDe(mvts) {
    let mis = 0, repris = 0;
    mvts.forEach(m => {
      if (m.type === "out" && m.cat === CAT_EPARGNE.sortie) mis += m.montant;
      if (m.type === "in" && m.cat === CAT_EPARGNE.entree) repris += m.montant;
    });
    return {mis:mis, repris:repris, net:mis - repris};
  }
  const epMois = epargneDe(b.mvts);
  let epTotal = epMois.net;
  b.histo.forEach(m => { epTotal += (m.epargne || 0); });

  const R = 62, C = 2 * Math.PI * R;
  h += '<div class="card"><h2>Mon solde <span class="tag">' + libelleMois(b.mois) + '</span></h2>' +
       '<svg class="donut" width="170" height="170" viewBox="0 0 170 170">' +
       '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="#EEE9DD" stroke-width="15"></circle>' +
       '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="' + (pct > .35 ? "#1E6B33" : pct > .15 ? "#C8A24B" : "#9C2330") + '" ' +
       'stroke-width="15" stroke-linecap="round" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '" ' +
       'transform="rotate(-90 85 85)"></circle>' +
       '<text x="85" y="88" text-anchor="middle" class="donut-c">' + eur(solde) + '</text>' +
       '<text x="85" y="106" text-anchor="middle" class="donut-l">disponible</text></svg>' +
       '<div class="kpi" style="margin-top:10px">' +
       '<div class="box v"><div class="n">+' + eur(entrees) + '</div><div class="t">entrées</div></div>' +
       '<div class="box r"><div class="n">-' + eur(sorties) + '</div><div class="t">sorties</div></div>' +
       '<div class="box"><div class="n">' + eur(entrees - sorties) + '</div><div class="t">net du mois</div></div>' +
       '</div></div>';

  /* prévisionnel : ce qui est prévu mais pas encore passé */
  const prevIn  = b.prev.filter(x => x.type === "in").reduce((a, x) => a + x.montant, 0);
  const prevOut = b.prev.filter(x => x.type === "out").reduce((a, x) => a + x.montant, 0);
  const finMois = solde + prevIn - prevOut;
  h += '<div class="card"><h2>Où je finis le mois <span class="tag">' + eur(finMois) + '</span></h2>' +
       '<div class="kpi">' +
       '<div class="box"><div class="n">' + eur(solde) + '</div><div class="t">aujourd\'hui</div></div>' +
       '<div class="box v"><div class="n">+' + eur(prevIn) + '</div><div class="t">encore à recevoir</div></div>' +
       '<div class="box r"><div class="n">-' + eur(prevOut) + '</div><div class="t">encore à payer</div></div>' +
       '</div>' +
       '<div class="kpi" style="margin-top:8px"><div class="box' + (finMois < 0 ? ' r' : finMois < 200 ? '' : ' v') +
       '"><div class="n">' + eur(finMois) + '</div><div class="t">solde estimé en fin de mois</div></div></div>' +
       '<div class="form" style="margin-top:12px"><input type="number" inputmode="decimal" id="prevM" placeholder="Montant">' +
       '<select id="prevC">' +
       '<optgroup label="À recevoir">' + CAT_IN.map(c => '<option>' + c + '</option>').join("") + '</optgroup>' +
       '<optgroup label="À payer">' + CAT_OUT.map(c => '<option>' + c + '</option>').join("") + '</optgroup>' +
       '</select>' +
       '<input type="text" id="prevL" placeholder="Quoi exactement ? (facultatif)" style="flex:2 1 150px">' +
       '</div>' +
       '<button class="btn light" id="addPrev">Ajouter au prévisionnel</button>';
  if (b.prev.length) {
    h += '<div style="margin-top:12px">';
    b.prev.forEach((x, i) => {
      h += '<div class="mvt"><div class="g"><div>' + (x.lib || x.cat) + '</div>' +
           '<div class="cat">' + (x.lib ? x.cat + '  /  ' : '') +
           (x.type === "in" ? "à recevoir" : "à payer") +
           (x.rid ? " chaque mois" : "") + '</div></div>' +
           '<span class="amt ' + x.type + '">' + (x.type === "in" ? "+" : "-") + eur(x.montant) + '</span>' +
           '<button class="btn light" data-fait="' + i + '" style="padding:5px 10px;font-size:11px;width:auto;margin:0 6px">C\'est fait</button>' +
           '<button class="del" data-prevdel="' + i + '">\u2715</button></div>';
    });
    h += '</div>';
  }
  h += '<div class="note" style="margin-top:9px">Mets ici ce que tu sais déjà : le loyer qui va tomber, ' +
       'une facture, une rentrée d\'argent attendue. Prévois large, ce n\'est pas grave. ' +
       'Quand ça arrive, clique sur <b>C\'est fait</b> et indique le montant réel : si tu avais ' +
       'prévu 100 et qu\'il n\'en sort que 60, les 60 passent en mouvement réel et 40 restent ' +
       'en prévision. Quand tu sais que ces 40 ne viendront plus, la croix les efface. ' +
       'Le libellé est facultatif : il sert à te rappeler de quoi il s\'agit. ' +
       'Le prévisionnel survit à la clôture, et les lignes marquées <b>chaque mois</b> ' +
       'viennent de tes charges fixes : elles se remettent toutes seules à chaque clôture.' +
       '</div></div>';

  /* les abonnements et charges qui reviennent tous les mois */
  const recOut = b.recur.filter(r => r.type === "out").reduce((a, r) => a + r.montant, 0);
  const recIn  = b.recur.filter(r => r.type === "in").reduce((a, r) => a + r.montant, 0);
  h += '<div class="card"><h2>Ce qui revient chaque mois' +
       (b.recur.length ? ' <span class="tag">-' + eur(recOut) +
        (recIn ? '  /  +' + eur(recIn) : '') + '</span>' : '') + '</h2>';
  if (b.recur.length) {
    h += '<div style="margin-bottom:4px">';
    b.recur.forEach((r, i) => {
      h += '<div class="mvt"><div class="g"><div>' + (r.lib || r.cat) + '</div>' +
           '<div class="cat">' + (r.lib ? r.cat + '  /  ' : '') +
           (r.type === "in" ? "revient chaque mois" : "à payer chaque mois") + '</div></div>' +
           '<span class="amt ' + r.type + '">' + (r.type === "in" ? "+" : "-") + eur(r.montant) + '</span>' +
           '<button class="del" data-recdel="' + i + '">\u2715</button></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="note">Rien pour l\'instant. Mets ici ton loyer, ton forfait, Netflix, ' +
         'la salle de sport, ton salaire. Tu ne les ressaisiras plus jamais.</div>';
  }
  h += '<div class="form"><input type="number" inputmode="decimal" id="recM" placeholder="Montant">' +
       '<select id="recC">' +
       '<optgroup label="Je reçois">' + CAT_IN.map(c => '<option>' + c + '</option>').join("") + '</optgroup>' +
       '<optgroup label="Je paie">' + CAT_OUT.map(c => '<option>' + c + '</option>').join("") + '</optgroup>' +
       '</select>' +
       '<input type="text" id="recL" placeholder="Nom, par exemple Netflix" style="flex:2 1 150px">' +
       '</div>' +
       '<button class="btn light" id="addRec">Ajouter à mes charges fixes</button>' +
       '<div class="note" style="margin-top:9px">Ces lignes partent directement dans ton ' +
       'prévisionnel, et y reviennent seules à chaque clôture : plus besoin de les ressaisir. ' +
       'Quand tu paies, tu cliques sur <b>C\'est fait</b> dans le prévisionnel comme d\'habitude. ' +
       'La croix ici supprime l\'abonnement pour de bon.</div></div>';

  /* épargne */
  h += '<div class="card sec-or"><h2>Mon épargne <span class="tag">' + eur(epTotal) + ' au total</span></h2>' +
       '<div class="kpi"><div class="box v"><div class="n">' + eur(epMois.mis) + '</div><div class="t">mis de côté ce mois</div></div>' +
       '<div class="box r"><div class="n">' + eur(epMois.repris) + '</div><div class="t">repris ce mois</div></div>' +
       '<div class="box"><div class="n">' + eur(epTotal) + '</div><div class="t">épargne cumulée</div></div></div>' +
       '<div class="note" style="margin-top:9px">Pour mettre de côté, ajoute une dépense avec la catégorie ' +
       '<b>Mise de côté</b> : elle sort de ton disponible et vient grossir cette ligne. Pour piocher dedans, ' +
       'ajoute une entrée <b>Retrait d\'épargne</b>. Objectif : un mois de salaire d\'avance.</div></div>';

  h += '<div class="card sec-vert"><h2>J\'ai reçu de l\'argent</h2>' +
       '<div class="form"><input type="number" inputmode="decimal" id="inM" placeholder="Montant">' +
       '<select id="inC">' + CAT_IN.map(c => '<option>' + c + '</option>').join("") + '</select>' +
       '<input type="text" id="inL" placeholder="Quoi exactement ? (facultatif)" style="flex:2 1 150px">' +
       '</div>' +
       '<button class="btn light" id="addIn">Ajouter cette entrée</button></div>';

  h += '<div class="card sec-rouge"><h2>J\'ai dépensé</h2>' +
       '<div class="form"><input type="number" inputmode="decimal" id="outM" placeholder="Montant">' +
       '<select id="outC">' + CAT_OUT.map(c => '<option>' + c + '</option>').join("") + '</select>' +
       '<input type="text" id="outL" placeholder="Quoi exactement ? (facultatif)" style="flex:2 1 150px">' +
       '</div>' +
       '<button class="btn light" id="addOut">Ajouter cette dépense</button></div>';

  /* tableaux par catégorie, avec la colonne du mois précédent si elle existe */
  const parCat = {in:{}, out:{}};
  b.mvts.forEach(m => { parCat[m.type][m.cat] = (parCat[m.type][m.cat] || 0) + m.montant; });

  function tableauCat(type, titre, total, couleur) {
    const catsPrec = prec ? (prec.cats && prec.cats[type] ? prec.cats[type] : {}) : {};
    /* deux colonnes seulement : sur un telephone, six colonnes ne se lisent pas.
       L'ecart avec le mois precedent devient une mention a cote du montant. */
    const toutes = Object.keys(parCat[type])
                     .filter(c => (parCat[type][c] || 0) > 0)
                     .sort((a, x) => (parCat[type][x] || 0) - (parCat[type][a] || 0));
    let t = '<div class="card"><h2>' + titre + ' <span class="tag">' + eur(total) + '</span></h2>';
    if (!toutes.length) return t + '<div class="note">Rien pour l\'instant ce mois-ci.</div></div>';
    t += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
    toutes.forEach(c => {
      const v = parCat[type][c] || 0, vp = catsPrec[c] || 0, ecart = v - vp;
      const n = b.mvts.filter(m => m.type === type && m.cat === c).length;
      const p = total > 0 ? v / total * 100 : 0;
      const coulEcart = (type === "out" ? (ecart > 0 ? "var(--rouge)" : "var(--vert)")
                                        : (ecart > 0 ? "var(--vert)" : "var(--rouge)"));
      const mention = (prec && Math.abs(ecart) >= 1)
        ? '<div style="font-size:11px;font-weight:600;color:' + coulEcart + '">' +
          (ecart > 0 ? "+" : "") + eur(ecart) + ' vs ' + prec.libelle.split(" ")[0] + '</div>'
        : '';
      t += '<tr style="border-bottom:1px solid #F0ECE2">' +
           '<td style="padding:8px 0">' + c +
           '<div class="cat">' + n + (n > 1 ? ' mouvements' : ' mouvement') + ', ' + pourcent(p) + ' du total</div></td>' +
           '<td style="text-align:right;white-space:nowrap">' +
           '<div style="font-weight:700;color:' + couleur + '">' + eur(v) + '</div>' + mention + '</td></tr>';
    });
    t += '<tr><td style="padding:9px 0;font-weight:700">Total</td>' +
         '<td style="text-align:right;font-weight:800;color:' + couleur + '">' + eur(total) + '</td></tr></table></div>';
    return t;
  }
  h += tableauCat("out", "Où part l'argent", sorties, "var(--rouge)");
  h += tableauCat("in", "Ce qui rentre", entrees, "var(--vert)");

  /* comparaison globale avec le mois précédent */
  function phraseBouge(dS) {
    const pc = (prec && prec.cats && prec.cats.out) ? prec.cats.out : {};
    const noms = Object.keys(parCat.out).concat(Object.keys(pc))
                   .filter((v, i, a) => a.indexOf(v) === i);
    const bouges = noms.map(c => ({c: c, d: (parCat.out[c] || 0) - (pc[c] || 0)}))
                       .filter(x => Math.abs(x.d) >= 1)
                       .sort((a, x) => Math.abs(x.d) - Math.abs(a.d))
                       .slice(0, 2);
    if (!bouges.length) return "Tes dépenses sont au même niveau que le mois dernier.";
    const dire = bouges.map(x => x.c + " " + (x.d > 0 ? "+" : "") + eur(x.d)).join(", ");
    return (dS <= 0 ? "Tu dépenses moins que le mois dernier. " : "Tu as dépensé " + eur(dS) + " de plus. ") +
           "Ce qui a le plus bougé : " + dire + ".";
  }
  if (prec) {
    const dS = sorties - prec.sorties, dE = entrees - prec.entrees, dN = (entrees - sorties) - (prec.entrees - prec.sorties);
    h += '<div class="card"><h2>Comparé à ' + prec.libelle + '</h2>' +
         '<div class="kpi"><div class="box"><div class="n" style="color:' + (dE >= 0 ? "var(--vert)" : "var(--rouge)") + '">' +
         (dE > 0 ? "+" : "") + eur(dE) + '</div><div class="t">entrées</div></div>' +
         '<div class="box"><div class="n" style="color:' + (dS <= 0 ? "var(--vert)" : "var(--rouge)") + '">' +
         (dS > 0 ? "+" : "") + eur(dS) + '</div><div class="t">sorties</div></div>' +
         '<div class="box"><div class="n" style="color:' + (dN >= 0 ? "var(--vert)" : "var(--rouge)") + '">' +
         (dN > 0 ? "+" : "") + eur(dN) + '</div><div class="t">net</div></div></div>' +
         '<div class="note" style="margin-top:9px">' +
         phraseBouge(dS) + '</div></div>';
  }

  h += '<div class="card"><h2>Le détail <span class="tag">' + b.mvts.length + ' mouvements</span></h2>';
  if (b.mvts.length) {
    b.mvts.slice().reverse().forEach((m, idx) => {
      const vrai = b.mvts.length - 1 - idx;
      h += '<div class="mvt"><div class="g"><div>' + (m.lib || m.cat) + '</div>' +
           '<div class="cat">' + (m.lib ? m.cat + '  /  ' : '') + libelle(m.d) + '</div></div>' +
           '<span class="amt ' + m.type + '">' + (m.type === "in" ? "+" : "-") + eur(m.montant) + '</span>' +
           '<button class="del" data-del="' + vrai + '">✕</button></div>';
    });
  } else { h += '<div class="note">Rien pour l\'instant.</div>'; }
  h += '<button class="btn or" id="resetMois" style="margin-top:14px">Clôturer le mois et repartir de zéro</button>' +
       '<div class="note" style="margin-top:8px">Le mois est archivé pour la comparaison, ton solde devient le point de départ du suivant, et la liste se vide.</div></div>';

  /* historique des mois clôturés : une ligne par mois, le détail en sous-titre.
     La carte s'affiche même vide, sinon le bouton de remise à zéro serait introuvable. */
  h += '<div class="card"><h2>Les mois précédents' +
       (b.histo.length ? ' <span class="tag">' + b.histo.length + ' mois</span>' : '') + '</h2>';
  if (b.histo.length) {
    b.histo.slice().reverse().forEach((m, idx) => {
      const vrai = b.histo.length - 1 - idx;
      const net = m.entrees - m.sorties;
      h += '<div class="mvt"><div class="g"><div>' + m.libelle + '</div>' +
           '<div class="cat">+' + eur(m.entrees) + '  /  -' + eur(m.sorties) +
           (m.epargne ? '  /  ' + eur(m.epargne) + ' mis de côté' : '') + '</div></div>' +
           '<span class="amt ' + (net >= 0 ? 'in' : 'out') + '">' +
           (net > 0 ? '+' : '') + eur(net) + '</span>' +
           '<button class="del" data-histodel="' + vrai + '">\u2715</button></div>';
    });
  } else {
    h += '<div class="note">Aucun mois clôturé pour l\'instant. Le premier apparaîtra ici ' +
         'après ta première clôture.</div>';
  }
  h += '<button class="btn or" id="resetTout" style="margin-top:14px">Tout remettre à zéro</button>' +
       '<div class="note" style="margin-top:8px">Efface l\'historique, les mouvements de ce mois, ' +
       'le prévisionnel et le solde de départ. <b>Tes charges fixes sont conservées.</b> ' +
       'À utiliser une fois, pour repartir sur des chiffres ' +
       'propres. La croix à côté d\'un mois n\'efface que ce mois.</div></div>';

  el("euro").innerHTML = h;

  el("addIn").addEventListener("click", () => {
    const v = parseFloat((el("inM").value || "").replace(",", "."));
    if (isNaN(v) || v <= 0) return;
    S.budget.mvts.push({d:auj(), type:"in", montant:v, cat:el("inC").value,
                        lib:(el("inL").value || "").trim()}); save(); renderEuro();
  });
  el("addOut").addEventListener("click", () => {
    const v = parseFloat((el("outM").value || "").replace(",", "."));
    if (isNaN(v) || v <= 0) return;
    S.budget.mvts.push({d:auj(), type:"out", montant:v, cat:el("outC").value,
                        lib:(el("outL").value || "").trim()}); save(); renderEuro();
  });
  el("euro").querySelectorAll("[data-del]").forEach(x => x.addEventListener("click", () => {
    S.budget.mvts.splice(+x.dataset.del, 1); save(); renderEuro();
  }));
  el("addPrev").addEventListener("click", () => {
    const v = parseFloat((el("prevM").value || "").replace(",", "."));
    if (isNaN(v) || v <= 0) return;
    const sel = el("prevC"), opt = sel.options[sel.selectedIndex];
    const type = (opt.parentNode && opt.parentNode.label === "À recevoir") ? "in" : "out";
    S.budget.prev.push({type:type, montant:v, cat:sel.value,
                        lib:(el("prevL").value || "").trim()}); save(); renderEuro();
  });
  el("euro").querySelectorAll("[data-prevdel]").forEach(x => x.addEventListener("click", () => {
    S.budget.prev.splice(+x.dataset.prevdel, 1); save(); renderEuro();
  }));
  el("addRec").addEventListener("click", () => {
    const v = parseFloat((el("recM").value || "").replace(",", "."));
    if (isNaN(v) || v <= 0) return;
    const sel = el("recC"), opt = sel.options[sel.selectedIndex];
    const type = (opt.parentNode && opt.parentNode.label === "Je reçois") ? "in" : "out";
    S.budget.recur.push({rid:"r" + Date.now(), type:type, montant:v, cat:sel.value,
                         lib:(el("recL").value || "").trim()});
    injecteRecurrents();   /* il compte dès ce mois-ci, sans attendre la clôture */
    save(); renderEuro();
  });
  el("euro").querySelectorAll("[data-recdel]").forEach(x => x.addEventListener("click", () => {
    const r = S.budget.recur[+x.dataset.recdel];
    if (!r) return;
    if (!confirm("Supprimer " + (r.lib || r.cat) + " de tes charges fixes ?\n\n" +
                 "Cette ligne ne reviendra plus dans le prévisionnel.")) return;
    /* on retire aussi sa ligne du prévisionnel, si elle n'est pas encore passée */
    S.budget.prev = S.budget.prev.filter(p => p.rid !== r.rid);
    S.budget.recur.splice(+x.dataset.recdel, 1);
    save(); renderEuro();
  }));
  el("euro").querySelectorAll("[data-histodel]").forEach(x => x.addEventListener("click", () => {
    S.budget.histo.splice(+x.dataset.histodel, 1); save(); renderEuro();
  }));
  el("resetTout").addEventListener("click", () => {
    if (!confirm("Tout remettre à zéro ?\n\nCela efface l'historique des mois clôturés, les " +
                 "mouvements de ce mois, le prévisionnel et le solde de départ.\nC'est définitif.")) return;
    S.budget.histo = []; S.budget.mvts = []; S.budget.prev = [];
    S.budget.soldeDebut = 0; S.budget.mois = moisCourant();
    injecteRecurrents();   /* les charges fixes restent : c'est une configuration, pas un chiffre */
    save(); renderEuro();
  });
  /* une ligne prévue qui arrive : on saisit le montant RÉEL, qui n'est pas toujours celui
     qu'on avait prévu. En dessous, le reste demeure en prévision. Au-dessus ou égal, la
     ligne disparaît. */
  el("euro").querySelectorAll("[data-fait]").forEach(x => x.addEventListener("click", () => {
    const i = +x.dataset.fait, p = S.budget.prev[i];
    if (!p) return;
    const saisi = prompt("Montant réellement " + (p.type === "in" ? "reçu" : "payé") +
                         " pour " + (p.lib || p.cat) + " ?\n\nPrévu : " + eur(p.montant) +
                         "\nSi tu mets moins, le reste demeure en prévision.",
                         String(p.montant).replace(".", ","));
    if (saisi === null) return;
    const v = parseFloat(String(saisi).replace(",", "."));
    if (isNaN(v) || v <= 0) return;
    S.budget.mvts.push({d:auj(), type:p.type, montant:v, cat:p.cat, lib:p.lib || ""});
    const reste = Math.round((p.montant - v) * 100) / 100;
    if (reste > 0) { p.montant = reste; } else { S.budget.prev.splice(i, 1); }
    save(); renderEuro();
  }));
  el("resetMois").addEventListener("click", () => {
    if (!confirm("Clôturer le mois ? Il sera archivé pour que tu puisses comparer, et la liste repart à zéro.")) return;
    /* le mois archivé est celui qu'on suivait, pas celui du jour où on clique.
       Sans ça, clôturer août le 1er septembre archivait « septembre ». */
    const mc = (S.budget.mois || moisCourant()).split("-");
    const moisFini = MOIS[parseInt(mc[1], 10) - 1] + " " + mc[0];
    S.budget.histo.push({
      mois: S.budget.mois, libelle: moisFini,
      soldeDebut: S.budget.soldeDebut, soldeFin: solde,
      entrees: entrees, sorties: sorties, epargne: epMois.net,
      cats: {in: Object.assign({}, parCat.in), out: Object.assign({}, parCat.out)}
    });
    if (S.budget.histo.length > 12) S.budget.histo.shift();
    S.budget.soldeDebut = solde; S.budget.mvts = [];
    /* on repart sur le mois SUIVANT celui qu'on vient de clôturer, sauf si la date
       du jour est déjà plus loin. Sans ça, clôturer le 20 laissait le même mois et
       l'historique se retrouvait avec deux « août 2026 ». */
    S.budget.mois = moisApres(S.budget.mois) > moisCourant() ? moisApres(S.budget.mois) : moisCourant();
    /* les abonnements repartent à neuf : on efface leurs lignes, payées ou non, puis on les
       réinjecte au montant plein. Les lignes ponctuelles, elles, survivent. */
    S.budget.prev = S.budget.prev.filter(p => !p.rid);
    injecteRecurrents();
    save(); renderEuro();
  });
}

function fmtEur(v){ return v.toFixed(2).replace(".", ",") + " \u20ac"; }

    const x = dinerDu(d); if (!x || r) return;
    const t = bNorm(x.nm);
    if (t.indexOf(n) >= 0) { r = {d: d, x: x}; return; }
    const mots = n.split(" ").filter(w => w.length > 3);
    if (mots.length && mots.every(w => t.indexOf(w) >= 0)) r = {d: d, x: x};
  });
  return r;
}
const BJOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function bJour(n){
  if (/aujourd|ce soir|ce midi/.test(n)) return auj();
  if (/demain/.test(n)) return plusJours(auj(), 1);
  let r = null;
  joursPeriode().forEach(d => {
    if (r) return;
    if (n.indexOf(bNorm(BJOURS[parse(d).getDay()])) >= 0) r = d;
  });
  return r;
}

/* ---------- ou sert un ingredient ---------- */
function bOuSert(k){
  const cles = [bNorm(k)].concat((REMPLACE[k].syn || []).map(bNorm));
  const out = [];
  joursPeriode().forEach(d => {
    const x = dinerDu(d); if (!x) return;
    const t = bNorm(x.nm + " " + x.ing);
    if (cles.some(c => c.length > 2 && t.indexOf(c) >= 0)) out.push(libelle(d) + ", " + x.nm);
  });
  PERIODE.courses.lignes.forEach(l => {
    const t = bNorm(l.n);
    if (cles.some(c => c.length > 2 && (t.indexOf(c) >= 0 || c.indexOf(t) >= 0)))
      out.push("ta liste de courses, " + l.q);
  });
  return out;
}

/* ---------- les blocs de reponse ---------- */
function bTitre(t){ return '<div class="fmeta" style="margin:12px 0 6px">' + bEsc(t) + '</div>'; }

function bBlocIngredient(k){
  const v = REMPLACE[k], sert = bOuSert(k), pris = S.bouffe.remplace[k];
  let h = '<div class="ing"><b>' + bEsc(k) + '</b>, ' + bEsc(v.role) + '.</div>';
  if (sert.length) h += '<div class="note" style="margin-top:7px"><b>Ça sert dans :</b> ' + bEsc(sert.join(" ; ")) + '.</div>';
  if (pris) h += '<div class="alerte" style="margin-top:9px">Tu as déjà choisi <b>' + bEsc(pris) + '</b> à la place. <button class="gcal" id="bAnnuleRem" style="cursor:pointer;margin-left:6px">Annuler</button></div>';
  h += bTitre("Par quoi le remplacer");
  v.ok.forEach((c, i) => {
    h += '<div class="row"><div class="lab"><b>' + bEsc(c[0]) + '</b><br>' +
         '<span style="font-size:12.5px">' + bEsc(c[1]) + '</span></div>' +
         '<button class="gcal" style="cursor:pointer;white-space:nowrap" data-brem="' + bEsc(k) + '" data-bval="' + bEsc(c[0]) + '">Je prends ça</button></div>';
  });
  if (v.non.length) {
    h += bTitre("Ce qu'il ne faut pas prendre");
    v.non.forEach(c => {
      h += '<div class="alerte" style="margin-top:7px"><b>' + bEsc(c[0]) + '.</b> ' + bEsc(c[1]) + '</div>';
    });
  }
  return h;
}

function bBlocRecette(d, x){
  let h = '<div class="ing"><b>' + bEsc(x.nm) + '</b>, ' + bEsc(libelle(d)) + ', ' + x.portions + ' portions, ' + bEsc(x.temps) + '.</div>';
  h += '<div class="note" style="margin-top:7px"><b>Il te faut :</b> ' + bEsc(x.ing) + '</div>';
  x.etapes.forEach((e, i) => {
    h += '<div class="etape"><span class="n">' + (i + 1) + '</span><span>' + bEsc(e) + '</span></div>';
  });
  if (x.alerte) h += '<div class="alerte" style="margin-top:9px">' + bEsc(x.alerte) + '</div>';
  if (x.batch) h += '<div class="note" style="margin-top:9px"><b>Ce qui part en boîte :</b> ' + bEsc(x.batch) + '</div>';
  return h;
}

function bBlocJour(d){
  const p = repasDu(d), x = dinerDu(d);
  if (!p) return '<div class="note">Le ' + bEsc(libelleLong(d)) + ' est hors de ta période.</div>';
  let h = '<div class="ing"><b>' + bEsc(libelleLong(d)) + '</b></div>';
  [["Matin", p.matin], ["Collation", p.collation], ["Midi", p.midi], ["Soir", p.soir]].forEach(l => {
    if (l[1]) h += '<div class="row"><div class="lab"><b>' + l[0] + '</b></div><div style="font-size:13px;text-align:right">' + bEsc(l[1]) + '</div></div>';
  });
  if (x) h += bBlocRecette(d, x);
  return h;
}

function bBlocCourses(){
  const C = PERIODE.courses;
  const tb = C.lignes.reduce((a, l) => a + l.bas, 0), th = C.lignes.reduce((a, l) => a + l.haut, 0);
  const rb = C.lignes.reduce((a, l, i) => a + (S.shop[cleShop(i)] ? 0 : l.bas), 0);
  const rh = C.lignes.reduce((a, l, i) => a + (S.shop[cleShop(i)] ? 0 : l.haut), 0);
  const pris = C.lignes.filter((l, i) => S.shop[cleShop(i)]).length;
  let h = '<div class="ing"><b>Tout le panier :</b> ' + fmtEur(tb) + ' à ' + fmtEur(th) + ', sur ' + C.lignes.length + ' lignes.</div>';
  h += '<div class="row"><div class="lab"><b>Déjà dans le panier</b></div><div style="font-weight:700">' + pris + ' / ' + C.lignes.length + '</div></div>';
  h += '<div class="row"><div class="lab"><b>Il te reste à prendre</b></div><div style="font-weight:700;color:var(--or)">' + fmtEur(rb) + ' à ' + fmtEur(rh) + '</div></div>';
  const jours = joursPeriode().length;
  h += '<div class="note" style="margin-top:9px">Soit ' + fmtEur(tb / (jours * 2)) + ' à ' + fmtEur(th / (jours * 2)) + ' par personne et par jour, sur ' + jours + ' jours à deux.</div>';
  h += '<div class="note" style="margin-top:7px">' + bEsc(C.verite) + '</div>';
  return h;
}

/* ---------- la question preparee, pour ce que je ne sais pas ---------- */
function bPourClaude(q){
  const L = ["Question sur mes repas : " + q, ""];
  L.push("Contexte : je suis deux, je n'ai PAS de four, j'ai un petit frigo, je suis en prise de masse, et je fais mes courses chez Lidl.");
  L.push("Ma période va du " + PERIODE.du + " au " + PERIODE.au + ".");
  L.push("");
  joursPeriode().forEach(d => {
    const x = dinerDu(d);
    if (x) L.push(libelle(d) + " : " + x.nm + ". " + x.ing);
  });
  L.push("");
  L.push("Déjà chez moi : " + PERIODE.courses.dejaLa);
  const R = Object.keys(S.bouffe.remplace);
  if (R.length) L.push("J'ai déjà remplacé : " + R.map(k => k + " par " + S.bouffe.remplace[k]).join(", ") + ".");
  return L.join("\n");
}

function bBlocRien(q){
  return '<div class="ing">Je n\'ai pas ça en mémoire.</div>' +
    '<div class="note" style="margin-top:7px">Je réponds sur un ingrédient, un plat de ta période, un jour, ou le coût des courses. ' +
    'Pour le reste, le bouton ci-dessous prépare ta question avec toute ta période dedans, tu la colles dans Claude.</div>' +
    '<button class="btn light" id="bCopier" style="margin-top:10px">Préparer la question pour Claude</button>' +
    '<div class="note" id="bCopieOk" style="margin-top:7px;display:none">Copié. Colle-le dans Claude.</div>';
}

/* ---------- le routeur ---------- */
function bRepond(q){
  const n = bNorm(q);
  if (n.length < 2) return "";
  if (/combien|prix|total|cout|budget|depens|cher|panier/.test(n)) return bBlocCourses();
  const j = bJour(n); if (j) return bBlocJour(j);
  const p = bPlat(n); if (p) {
    let h = bBlocRecette(p.d, p.x);
    const i = bIngredient(n);
    if (i) h += '<div class="note" style="margin-top:9px">Tu cherchais l\'ingrédient ? ' +
      '<button class="gcal" style="cursor:pointer" data-bq="' + bEsc(i) + '">Voir ' + bEsc(i) + '</button></div>';
    return h;
  }
  const i = bIngredient(n); if (i) return bBlocIngredient(i);
  return bBlocRien(q);
}

/* ---------- la carte ---------- */
function bCarte(){
  let h = '<div class="card sec-or"><h2>Un coup de main <span class="tag">hors ligne</span></h2>' +
    '<div class="note">Tape un ingrédient, un plat, un jour, ou « combien ». Ça marche sans réseau, donc en rayon.</div>' +
    '<div class="form" style="margin-top:10px"><input type="text" id="bIn" placeholder="brocoli, curry, mardi, combien" value="' + bEsc(bQ) + '"></div>' +
    '<div class="pills" style="margin-top:9px">' +
    '<span class="pill" data-bq="brocoli">Il me manque un truc</span>' +
    '<span class="pill" data-bq="curry">Une recette</span>' +
    '<span class="pill" data-bq="combien">Combien ça coûte</span>' +
    '<span class="pill" id="bEchanger">Intervertir deux soirs</span></div>';

  const R = Object.keys(S.bouffe.remplace);
  if (R.length) {
    h += '<div class="note" style="margin-top:10px"><b>Tes remplacements en cours :</b> ' +
      bEsc(R.map(k => k + " devient " + S.bouffe.remplace[k]).join(" ; ")) +
      '. <button class="gcal" id="bResetRem" style="cursor:pointer;margin-left:6px">Tout annuler</button></div>';
  }
  if (Object.keys(S.bouffe.perm).length) {
    h += '<div class="note" style="margin-top:7px"><b>Tu as interverti des soirs.</b> ' +
      '<button class="gcal" id="bResetPerm" style="cursor:pointer;margin-left:6px">Remettre l\'ordre</button></div>';
  }

  if (bMode === "echange") {
    const opts = joursPeriode().filter(d => dinerDu(d))
      .map(d => '<option value="' + d + '">' + bEsc(libelle(d)) + ", " + bEsc(dinerDu(d).nm) + '</option>').join("");
    h += '<div style="margin-top:11px;padding-top:11px;border-top:1px solid #F0ECE2">' +
      '<div class="fmeta" style="margin-bottom:6px">Quels deux soirs ?</div>' +
      '<select id="bEchA" style="width:100%;margin-bottom:7px">' + opts + '</select>' +
      '<select id="bEchB" style="width:100%">' + opts + '</select>' +
      '<button class="btn light" id="bEchOk" style="margin-top:9px">Intervertir</button></div>';
  }

  const rep = bRepond(bQ);
  if (rep) h += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #F0ECE2">' + rep + '</div>';
  return h + '</div>';
}

/* ---------- les actions ---------- */
function bVa(q){ bQ = q; bMode = ""; renderBouffe(); }
function bEchangeFait(){
  const a = el("bEchA").value, b = el("bEchB").value;
  if (a === b) { bMode = ""; renderBouffe(); return; }
  const p = S.bouffe.perm, ra = p[a] || a, rb = p[b] || b;
  p[a] = rb; p[b] = ra;
  Object.keys(p).forEach(k => { if (p[k] === k) delete p[k]; });
  save(); bMode = ""; renderBouffe();
}
function bBranche(){
  const w = el("bouffe");
  const i = w.querySelector("#bIn");
  if (i) {
    i.addEventListener("input", () => { bQ = i.value; });
    i.addEventListener("change", () => bVa(i.value));
    i.addEventListener("keydown", e => { if (e.key === "Enter") bVa(i.value); });
  }
  w.querySelectorAll("[data-bq]").forEach(b => b.addEventListener("click", () => bVa(b.getAttribute("data-bq"))));
  w.querySelectorAll("[data-brem]").forEach(b => b.addEventListener("click", () => {
    S.bouffe.remplace[b.getAttribute("data-brem")] = b.getAttribute("data-bval");
    save(); renderBouffe();
  }));
  const ar = w.querySelector("#bAnnuleRem");
  if (ar) ar.addEventListener("click", () => {
    const k = bIngredient(bNorm(bQ));
    if (k) delete S.bouffe.remplace[k];
    save(); renderBouffe();
  });
  const rr = w.querySelector("#bResetRem");
  if (rr) rr.addEventListener("click", () => { S.bouffe.remplace = {}; save(); renderBouffe(); });
  const rp = w.querySelector("#bResetPerm");
  if (rp) rp.addEventListener("click", () => { S.bouffe.perm = {}; save(); renderBouffe(); });
  const ec = w.querySelector("#bEchanger");
  if (ec) ec.addEventListener("click", () => { bMode = (bMode === "echange" ? "" : "echange"); renderBouffe(); });
  const eo = w.querySelector("#bEchOk");
  if (eo) eo.addEventListener("click", bEchangeFait);
  const cp = w.querySelector("#bCopier");
  if (cp) cp.addEventListener("click", () => {
    const t = bPourClaude(bQ);
    const fini = () => { const o = w.querySelector("#bCopieOk"); if (o) o.style.display = "block"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(fini).catch(() => bSecours(t));
    else bSecours(t);
  });
}
/* Sur un navigateur qui refuse le presse-papiers, on affiche le texte a selectionner. */
function bSecours(t){
  const o = el("bouffe").querySelector("#bCopieOk");
  if (!o) return;
  o.style.display = "block";
  o.innerHTML = '<b>Copie ce texte :</b><textarea readonly style="width:100%;height:130px;margin-top:6px;font-size:12px"></textarea>';
  o.querySelector("textarea").value = t;
}

/* Les remplacements choisis s'affichent dans les recettes. */
function bRemplacesDe(txt){
  const t = bNorm(txt), out = [];
  Object.keys(S.bouffe.remplace).forEach(k => {
    const cles = [bNorm(k)].concat((REMPLACE[k] ? REMPLACE[k].syn : []) || []).map(bNorm);
    if (cles.some(c => c.length > 2 && t.indexOf(c) >= 0)) out.push(k + " devient " + S.bouffe.remplace[k]);
  });
  return out;
}

/* L'interversion de deux soirs vit dans S.bouffe.perm. En passant par ici, elle se
   repercute PARTOUT : le calendrier, l'onglet Aujourd'hui, la semaine et le fichier ICS. */
function dinerDu(d){
  const p = (S.bouffe && S.bouffe.perm && S.bouffe.perm[d]) || d;
  return PERIODE.diners[p] || null;
}

/* Rend la recette complete d'un diner. Sortie en accordeon, replie par defaut. */
function blocRecette(r, ouvert){
  let x = '<div class="acc' + (ouvert ? " open" : "") + '" style="margin-top:10px">' +
    '<div class="h"><span class="nm">La recette</span>' +
    '<span class="meta">' + r.portions + ' portions, ' + r.temps + '</span></div><div class="b">' +
    '<div class="ing"><b>Il te faut :</b> ' + r.ing + '</div>';
  const rem = (typeof bRemplacesDe === "function") ? bRemplacesDe(r.ing) : [];
  if (rem.length) x += '<div class="alerte" style="margin-top:9px"><b>Tes remplacements :</b> ' + rem.join(" ; ") + '.</div>';
  r.etapes.forEach((e, i) => {
    x += '<div class="etape"><span class="n">' + (i + 1) + '</span><span>' + e + '</span></div>';
  });
  if (r.alerte) x += '<div class="alerte" style="margin-top:9px">' + r.alerte + '</div>';
  if (r.batch)  x += '<div class="note" style="margin-top:9px;padding-top:9px;border-top:1px solid #F0ECE2"><b>Ce qui part en boîte :</b> ' + r.batch + '</div>';
  return x + '</div></div>';
}

/* avecRecette n'est vrai que dans l'onglet Bouffe. Les onglets Aujourd'hui et Semaine
   reutilisent ce bloc et doivent rester courts. */
function blocJourRepas(d, avecRecette){
  const p = repasDu(d); if (!p) return "";
  const din = dinerDu(d), estAuj = (d === auj());
  let x = '<div class="jour-repas' + (estAuj ? " auj" : "") + '">' +
          '<div class="d">' + (estAuj ? "Aujourd\'hui, " : "") + libelle(d) + '</div>';
  function l(q, v){ return v ? '<div class="l"><span class="q">' + q + '</span><span class="v">' + v + '</span></div>' : ""; }
  x += l("Matin", p.matin);
  x += l("Collation", p.collation);
  x += l("Midi", p.midi);
  x += l("Soir", din ? "<b>" + din.nm + "</b>, " + din.temps : p.soir);
  if (d === PERIODE.courses.d) x += l("Courses", "<b>Les courses</b>, vers " + PERIODE.courses.h.replace(":", "h") + ", environ " + PERIODE.courses.attendu + " \u20ac");
  if (din && din.alerte && !avecRecette) x += '<div class="alerte">' + din.alerte + '</div>';
  if (din && avecRecette) x += blocRecette(din, estAuj);
  return x + '</div>';
}

function renderBouffe(){
  const t = auj(), C = PERIODE.courses;
  let h = "";

  h += '<div class="card hero"><h2>Ta période</h2><div class="big">' + PERIODE.titre + '</div>' +
       '<div class="sub">Du ' + libelleLong(PERIODE.du) + ' au ' + libelleLong(PERIODE.au) + '.<br>' + PERIODE.intro + '</div></div>';

  /* La carte est remontee dans l'assistant global, en bas a gauche. */
  if (t > PERIODE.au) {
    h += '<div class="hint"><b>Cette période est finie.</b> Donne ta prochaine liste de courses et tes repas, ' +
         'et tout se remet à jour d\'un coup : les cases, le calendrier des repas, l\'onglet Aujourd\'hui et le fichier Google Agenda.</div>';
  }

  /* ---------- LE CALENDRIER DES REPAS ---------- */
  h += '<div class="card"><h2>Ton calendrier <span class="tag">jour par jour</span></h2>';

  const totHaut = C.lignes.reduce((a, l) => a + l.haut, 0);
  const resteBas  = C.lignes.reduce((a, l, i) => a + (S.shop[cleShop(i)] ? 0 : l.bas), 0);
  const resteHaut = C.lignes.reduce((a, l, i) => a + (S.shop[cleShop(i)] ? 0 : l.haut), 0);

  h += '<div class="card sec-or"><h2>Les courses <span class="tag">' + libelle(C.d) + ', ' + C.quand + '</span></h2>';
  h += '<div class="kpi"><div class="box"><div class="n">' + pris + ' / ' + nb + '</div><div class="t">dans le panier</div></div>' +

         '<span class="nm">' + l.n + '<span class="sq">' + l.q + '</span></span>' +

    h += '<div class="chk' + (on ? " on" : "") + '" data-shop="' + id + '"><span class="bx">' + (on ? "\u2713" : "") + '</span>' +
         '<span class="nm">' + nom + '<span class="sq">ajouté par toi</span></span>' +
         '<span class="qt">sans prix</span></div>';

  h += '<div class="row" style="border-top:1px solid #F0ECE2;margin-top:4px"><div class="lab"><b>Tout le panier</b></div>' +

  if (pris > 0 && pris < nb) {
    h += '<div class="row"><div class="lab"><b>Il te reste à prendre</b></div>' +
         '<div style="font-weight:700;font-size:13px;color:var(--or)">' + fmtEur(resteBas) + ' à ' + fmtEur(resteHaut) + '</div></div>';
  }
  h += '<div class="note" style="margin-top:9px">' + C.verite + '</div></div>';

    h += '<div class="row"><div class="lab"><b>' + v.n + '</b><br><span style="font-size:12px">Il te faut ' + v.besoin + '</span></div>' +
         '<div style="font-size:12px;color:var(--anthr);text-align:right;max-width:46%">si manquant<br><b>' + v.si + '</b></div></div>';

  h += '</div>';

  /* La carte « Les diners » a ete retiree le 13/09/2026 : les recettes sont desormais
     depliables sous le plat de chaque jour, dans le calendrier ci-dessus. */

    h += '<div class="ing"><b>Il te faut :</b> ' + f.quoi.join(", ") + '</div>';
    f.blocs.forEach(b => {
      h += '<div style="margin-top:9px"><b style="color:var(--bleu);font-size:12.5px">' + b[0] + '</b><br>' + b[1] + '</div>';
    });

  });
  h += '</div>';

  /* ---------- LA REGLE ET LE BILAN ---------- */

/* ================= NOTIFICATIONS ================= */
function notifOk(){ return ("Notification" in window) && Notification.permission === "granted"; }
function demanderNotif(cb){
  if (!("Notification" in window)) { if (cb) cb(false); return; }
  if (Notification.permission === "granted") { if (cb) cb(true); return; }
  if (Notification.permission === "denied") { if (cb) cb(false); return; }
  Notification.requestPermission().then(p => { if (cb) cb(p === "granted"); });
}
function notifier(titre, corps){
  if (navigator.vibrate) { try { navigator.vibrate([200, 90, 200]); } catch(e){} }
  if (!notifOk()) return false;
  const o = {body: corps, icon: "./icon-192.png", badge: "./icon-192.png", tag: "steve", renotify: true};
  function simple(){ try { new Notification(titre, o); } catch(e){} }
  /* ready ne rejette jamais : sans delai, une page sans service worker n'afficherait rien */
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    Promise.race([navigator.serviceWorker.ready,
                  new Promise((_, rej) => setTimeout(() => rej(new Error("delai")), 800))])
      .then(r => r.showNotification(titre, o))
      .catch(simple);
  } else { simple(); }
  return true;
}
/* trois bips courts, sans fichier son */
function bip(){
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    const c = new A();
    if (c.state === "suspended") c.resume();
    [0, 0.20, 0.40].forEach(t => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, c.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.30, c.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.18);
    });
    setTimeout(() => { try { c.close(); } catch(e){} }, 1200);
  } catch(e){}
}

/* lien qui ouvre Google Agenda avec l'evenement deja rempli, dans l'agenda personnel */
function lienGoogle(r){
  const hm = r.h.split(":");
  const debut = parse(r.d);
  debut.setHours(+hm[0], +hm[1], 0, 0);
  const fin = new Date(debut.getTime() + (r.dur || 60) * 60000);
  function fmt(d){
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") +
           "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00";
  }
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: r.t,
    dates: fmt(debut) + "/" + fmt(fin),
    ctz: "Europe/Paris",
    details: (r.note || "") + "\n\nRappel par défaut de ton agenda. Pour deux jours avant sur tout : " +
             "Paramètres, Paramètres de mes agendas, ton agenda, Notifications relatives à un événement."
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

function icsDate(d, h){
  return d.replace(/-/g, "") + "T" + h.replace(":", "") + "00";
}
function construireIcs(seulementRdv){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Steve//Ma version//FR","CALSCALE:GREGORIAN",
             "METHOD:PUBLISH",(seulementRdv ? "X-WR-CALNAME:Mes rendez-vous" : "X-WR-CALNAME:Steve, ma semaine"),"X-WR-TIMEZONE:Europe/Paris",
             "REFRESH-INTERVAL;VALUE=DURATION:PT6H","X-PUBLISHED-TTL:PT6H"];
  function ev(uid, d, h, dur, titre, desc, alarmes){
    const fin = new Date(parse(d).getTime());
    const hm = h.split(":");
    fin.setHours(+hm[0], +hm[1] + dur, 0, 0);
    L.push("BEGIN:VEVENT", "UID:" + uid, "DTSTAMP:" + icsDate(auj(), "08:00") + "Z",
           "DTSTART:" + icsDate(d, h),
           "DTEND:" + icsDate(iso(fin), String(fin.getHours()).padStart(2,"0") + ":" + String(fin.getMinutes()).padStart(2,"0")),
           /* la virgule s'échappe aussi dans SUMMARY, pas seulement dans DESCRIPTION :
              sans ça « Salle, PULL » est une liste de deux valeurs pour la norme, et un
              agenda a le droit d'en couper la moitié. Corrigé le 13/09/2026. */
           "SUMMARY:" + titre.replace(/,/g, "\\,"));
    if (desc) L.push("DESCRIPTION:" + desc.replace(/,/g, "\\,"));
    (alarmes || []).forEach(a => L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + a[1].replace(/,/g,"\\,"),
                                        "TRIGGER;RELATED=START:" + a[0], "END:VALARM"));
    L.push("END:VEVENT");
  }
  /* séances des 60 prochains jours, sautées si on ne veut que les rendez-vous */
  for (let i = 0; i < (seulementRdv ? 0 : 60); i++) {
    const d = plusJours(auj(), i), s = seanceDu(d);
    if (s === "REPOS") continue;
    const dj = parse(d).getDay();
    const h = (dj === 4 || dj === 0 || dj === 6) ? "09:00" : "19:00";
    ev("sport-" + d + "@steve", d, h, 75, "Salle, " + s,
       "Deux jours de salle un jour de repos. Le circuit abdos se fait en fin de séance.",
       [["-PT2H", "Séance dans deux heures, prépare ton sac"]]);
  }
  /* réunion du jeudi, sur 60 jours */
  for (let i = 0; i < (seulementRdv ? 0 : 60); i++) {
    const d = plusJours(auj(), i);
    if (parse(d).getDay() !== 4) continue;
    ev("hebdo-" + d + "@steve", d, "20:30", 90, "Réunion hebdomadaire", "",
       [["-PT3H", "Réunion ce soir à 20h30"]]);
  }
  /* rendez-vous, avec rappels à deux jours, un jour et deux heures */
  tousRdv().forEach((r, i) => {
    ev("rdv" + i + "-" + r.d + "@steve", r.d, r.h, r.dur || 60, r.t, r.note || "",
       [["-P2D", r.t + " dans deux jours"], ["-P1D", r.t + " demain"], ["-PT2H", r.t + " dans deux heures"]]);
  });
  /* courses et sessions de cuisine de la période en cours */
  if (!seulementRdv) {
    const C = PERIODE.courses;
    if (C.d >= auj()) {
      ev("courses-" + C.d + "@steve", C.d, C.h, C.dur || 45, "Courses, environ " + C.attendu + " \u20ac",
         C.lignes.map(l => l.n + " " + l.q).join(", "),
         [["-PT1H", "Courses dans une heure, la liste est dans l\'app"]]);
    }
    joursPeriode().forEach(d => {
      const r = dinerDu(d);
      if (!r || d < auj()) return;
      ev("cuisine-" + d + "@steve", d, r.h, r.dur, "Cuisine : " + r.nm,
         r.ing + (r.alerte ? " || " + r.alerte : ""),
         [["-PT1H", r.nm + " à préparer dans une heure"]]);
    });
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function telechargerIcs(seulementRdv){
  const blob = new Blob([construireIcs(seulementRdv)], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = seulementRdv ? "mes-rendez-vous.ics" : "ma-semaine.ics";
  a.click();
}

   Chaque generateur rend {q, r, u, x} : enonce, reponse exacte, unite, astuce.
   Les nombres sont choisis pour que la reponse tombe juste, sinon on entraine
   la calculette et pas la tete. */
function fRi(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function fPick(t){ return t[Math.floor(Math.random() * t.length)]; }
function fNum(n){
  const s = Math.round(n * 100) / 100;
  return String(s).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

   q l'enonce, r la reponse exacte, u l'unite, x l'astuce qui se transporte ailleurs,

   astuce generique oblige a la reappliquer soi-meme a la question qu'on vient de rater. */

/* Decompose un pourcentage en gestes faisables de tete. */
function fPourcent(n, p){
  const dix = n / 10, e = [];
  e.push("10 % de " + fNum(n) + ", c'est " + fNum(dix) + ". On décale la virgule d'un rang.");
  if (p === 5) e.push("5 %, c'est la moitié de 10 % : " + fNum(dix) + " divisé par 2.");
  else if (p === 15) e.push("15 % = 10 % plus 5 %, donc " + fNum(dix) + " plus " + fNum(dix / 2) + ".");
  else if (p === 25) e.push("25 %, c'est le quart : " + fNum(n) + " divisé par 4.");
  else if (p === 75) e.push("75 %, c'est trois quarts : " + fNum(n) + " divisé par 4, fois 3.");
  else if (p === 50) e.push("50 %, c'est la moitié : " + fNum(n) + " divisé par 2.");
  else e.push(p + " % = " + (p / 10) + " fois 10 %, donc " + (p / 10) + " fois " + fNum(dix) + ".");
  e.push("Résultat : " + fNum(n * p / 100) + ".");
  return e;
}

       "Somme : " + fNum(a * pa) + " plus " + fNum(b * (100 - pa)) + " = " + fNum(a * pa + b * (100 - pa)) + ".",
       "Divisé par 100 : " + fNum(moy) + " %. La moyenne simple aurait donné " + fNum((a + b) / 2) + " %, c'est faux."],
    x:"Moyenne PONDÉRÉE, jamais la moyenne simple. On multiplie chaque valeur par son poids, on additionne, on divise par 100."}; },

function(){ const cf = fRi(2,30) * 1000, tm = fPick([20,25,40,50]);
  const coef = {20:5, 25:4, 40:2.5, 50:2};
  return {q:fNum(cf) + " euros de charges fixes, taux de marge sur coût variable de " + tm + " %. Quel seuil de rentabilité ?", r:cf / (tm / 100), u:"euros",
    d:["Seuil = charges fixes divisées par le TAUX, jamais par la marge en euros.",
       "Diviser par " + tm + " % revient à multiplier par " + fNum(coef[tm]) + ".",
       fNum(cf) + " x " + fNum(coef[tm]) + " = " + fNum(cf / (tm / 100)) + " euros de chiffre d'affaires."],
    x:"Charges fixes divisées par le taux de marge sur coût variable. À 25 %, il faut vendre quatre fois les charges fixes."}; },

function(){ const n = fRi(11,49), d = fPick([5,25,50]);
  const astuces = {5:"Diviser par 5 = fois 2 puis divisé par 10.", 25:"Diviser par 25 = fois 4 puis divisé par 100.",
    50:"Diviser par 50 = fois 2 puis divisé par 100."};
  const det = {
    5: [fNum(n * 5) + " x 2 = " + fNum(n * 10) + ".", "On divise par 10 : " + n + "."],
    25:[fNum(n * 25) + " x 4 = " + fNum(n * 100) + ".", "On divise par 100 : " + n + "."],
    50:[fNum(n * 50) + " x 2 = " + fNum(n * 100) + ".", "On divise par 100 : " + n + "."]
  };
  return {q:"Combien font " + (n * d) + " divisé par " + d + " ?", r:n, u:"", d:det[d], x:astuces[d]}; },
];

function finTire(){
  const g = CALCULS[Math.floor(Math.random() * CALCULS.length)];
  return g();
}

/* ---------- rendu ---------- */
/* Sous filet : si quoi que ce soit leve, on AFFICHE l'erreur au lieu de laisser un ecran
   blanc. Un onglet vide n'apprend rien, une ligne qui nomme l'erreur se corrige. */
function renderFin(){
  try { renderFinInterne(); }
  catch (err){
    el("fin").innerHTML = '<div class="card"><h2>L\'onglet a bute</h2>' +
      '<p class="note">Envoie-moi cette ligne, elle dit exactement ou.</p>' +
      '<p style="font-family:monospace;font-size:12px;background:#F7F5EF;padding:11px;' +
      'border-radius:9px;word-break:break-word">' + esc(err.name + " : " + err.message) + '</p>' +
      '<button class="btn bsec" onclick="finRemiseAZero()">Repartir de zero sur cet onglet</button>' +
      '</div>';
  }
}
/* Ne touche QUE l'onglet finance. Le sport, le budget et le reste ne bougent pas. */
function finRemiseAZero(){
  S.fin = {vus:{}, revoir:{}, serie:0, dernier:"", record:0};

  renderFin(); window.scrollTo(0, 0);
}
function renderFinInterne(){

function finKpi(v, l){

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function finGo(v, theme){
  fVue = v; fTheme = theme || ""; fPos = 0; fBon = 0; fRep = false;
  if (v === "calcul"){
    fLot = []; for (let i = 0; i < 10; i++) fLot.push(finTire());
  } else if (v === "fiches"){
    let src = FI;
    if (theme === "@revoir") src = FI.filter(f => S.fin.revoir[finCle(f)]);
    else if (theme) src = FI.filter(f => f.t === theme);
    src = src.slice();
    for (let i = src.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = src[i]; src[i] = src[j]; src[j] = t; }
    fLot = src.slice(0, 10);
  }
  renderFin(); window.scrollTo(0, 0);
}
function finVa(v){ fVue = v; renderFin(); window.scrollTo(0, 0); }
function finQuitter(){ fVue = "accueil"; renderFin(); window.scrollTo(0, 0); }

function finBarre(){
  return '<div class="fprog"><i style="width:' + Math.round(fPos / fLot.length * 100) + '%"></i></div>' +
    '<div class="fmeta">Question ' + Math.min(fPos + 1, fLot.length) + ' sur ' + fLot.length + '</div>';
}

/* ---------- calcul mental ---------- */
function finEcranCalcul(){
  if (fPos >= fLot.length) return finBilan("Calcul mental");
  const q = fLot[fPos];
  let h = '<div class="card">' + finBarre() + '<div class="fq">' + esc(q.q) + '</div>' +
    '<input class="fin-in" id="finRep" inputmode="decimal" placeholder="ta réponse" autocomplete="off">' +
    '<button class="btn" id="finBtnV" onclick="finValide()">Valider</button>' +
    '<button class="btn bsec" onclick="finQuitter()">Arrêter</button></div>';
  el("fin").innerHTML = h;
  const i = el("finRep");
  i.addEventListener("keydown", e => { if (e.key === "Enter") finValide(); });
  i.focus();
}
function finValide(){
  if (fRep) return;
  const q = fLot[fPos], br = el("finRep").value.trim().replace(/\s/g, "").replace(",", ".");
  if (br === "") return;
  const v = parseFloat(br);
  const ok = isFinite(v) && Math.abs(v - q.r) <= Math.max(0.05, Math.abs(q.r) * 0.005);
  if (ok) fBon++;
  fRep = true;
  const inp = el("finRep");
  inp.classList.add(ok ? "fbon" : "fmal"); inp.disabled = true;
  const bv = el("finBtnV"); if (bv) bv.style.display = "none";
  const d = document.createElement("div");
  d.innerHTML = '<div class="frep" style="color:var(--' + (ok ? "vert" : "rouge") + ')">' +
    (ok ? "Juste." : "Non. La réponse est " + fNum(q.r) + (q.u ? " " + q.u : "") + ".") + '</div>' +
    (q.d && q.d.length ?
      '<div style="background:#F7F5EF;border-radius:11px;padding:12px 13px;margin-top:10px">' +
      '<div class="fmeta" style="margin-bottom:6px">Le calcul, pas à pas</div>' +
      q.d.map((e, k) => '<div class="etape"><span class="n">' + (k + 1) + '</span><span>' + esc(e) + '</span></div>').join("") +
      '</div>' : '') +
    '<div class="ftip"><b>L\'astuce, pour la prochaine fois.</b> ' + esc(q.x) + '</div>' +
    '<button class="btn" onclick="finSuivant()">Suivant</button>';
  inp.parentNode.insertBefore(d, inp.nextSibling.nextSibling);
}
function finSuivant(){ fPos++; fRep = false; renderFin(); window.scrollTo(0, 0); }

/* ---------- fiches ---------- */
function finEcranFiches(){
  if (!fLot.length){ finQuitter(); return; }
  if (fPos >= fLot.length) return finBilan("Fiches");
  const f = fLot[fPos];
  let h = '<div class="card">' + finBarre() +
    '<div class="fmeta">' + esc(FT[f.t] || "") + '</div>' +
    '<div class="fq">' + esc(f.q) + '</div>';

    h += '<button class="btn" onclick="finMontre()">Voir la réponse</button>' +

    h += '<p>' + esc(f.r) + '</p><div class="ftip"><b>À retenir.</b> ' + esc(f.x) + '</div>' +

}
function finMontre(){ fRep = true; renderFin(); }
function finJuge(su){
  const f = fLot[fPos], c = finCle(f);
  S.fin.vus[c] = 1;
  if (su){ fBon++; delete S.fin.revoir[c]; } else { S.fin.revoir[c] = 1; }
  save(); fPos++; fRep = false; renderFin(); window.scrollTo(0, 0);
}

    '<p class="note">' + mot + ' Série en cours : ' + S.fin.serie + ' jour(s), record ' + (S.fin.record || 0) + '.</p>' +
    '<button class="btn" onclick="finGo(\'' + (titre === "Fiches" ? "fiches" : "calcul") + '\',\'' + fTheme + '\')">Une autre série</button>' +
